<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #262626; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; }
    h2 { color: #faad14; font-size: 18px; margin: 0 0 16px 0; }
    p { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; }
    .info { background: #fffbe6; border-radius: 6px; padding: 12px 16px; margin: 12px 0; font-size: 14px; }
    .muted { color: #8c8c8c; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Nhắc nhở: Khóa học bắt đầu sau 3 ngày</h2>
    <p>Xin chào {{full_name}},</p>
    <p>Khóa học <strong>{{course_name}}</strong> sẽ bắt đầu vào <strong>{{start_date}}</strong>.</p>
    <div class="info">
      <p style="margin:0;"><strong>Địa điểm:</strong> {{location}}</p>
      <p style="margin:4px 0 0 0;">Vui lòng mang đầy đủ giấy tờ tùy thân và tài liệu theo yêu cầu của trung tâm.</p>
    </div>
    <p>Hẹn gặp bạn tại lớp học.</p>
    <p class="muted">Email này được gửi tự động từ MarinePort.</p>
  </div>
</body>
</html>
