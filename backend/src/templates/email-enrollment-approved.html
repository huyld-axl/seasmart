<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #262626; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; }
    h2 { color: #52c41a; font-size: 18px; margin: 0 0 16px 0; }
    p { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; }
    .info { background: #f5f7fa; border-radius: 6px; padding: 12px 16px; margin: 12px 0; font-size: 14px; }
    .muted { color: #8c8c8c; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đăng ký khóa học đã được duyệt</h2>
    <p>Đăng ký của bạn cho khóa học <strong>{{course_name}}</strong> đã được chấp nhận.</p>
    <div class="info">
      <p style="margin:0;"><strong>Ngày bắt đầu:</strong> {{start_date}}</p>
      <p style="margin:4px 0 0 0;"><strong>Địa điểm:</strong> {{location}}</p>
    </div>
    <p>Vui lòng chuẩn bị đầy đủ tài liệu và có mặt đúng giờ. Nếu có thắc mắc, liên hệ trung tâm đào tạo.</p>
    <p class="muted">Email này được gửi tự động từ MarinePort.</p>
  </div>
</body>
</html>
