<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #262626; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; }
    h2 { color: #1677ff; font-size: 18px; margin: 0 0 16px 0; }
    p { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; }
    .btn { display: inline-block; background: #1677ff; color: #fff !important; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 14px; margin-top: 8px; }
    .muted { color: #8c8c8c; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đăng ký mới cần duyệt</h2>
    <p><strong>{{seafarer_name}}</strong> vừa đăng ký khóa học <strong>{{course_name}}</strong>.</p>
    <p>Vui lòng vào hệ thống để duyệt hoặc từ chối đăng ký.</p>
    <a href="{{approve_url}}" class="btn">Xem và duyệt đăng ký</a>
    <p class="muted" style="margin-top: 16px;">Email này được gửi tự động từ MarinePort.</p>
  </div>
</body>
</html>
