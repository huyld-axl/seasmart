<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, 'Segoe UI', sans-serif; max-width: 560px; margin: 0 auto; padding: 24px; color: #262626; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 24px; }
    h2 { color: #ff4d4f; font-size: 18px; margin: 0 0 16px 0; }
    p { margin: 0 0 12px 0; font-size: 14px; line-height: 1.5; }
    .reason { background: #fff2f0; border-radius: 6px; padding: 12px 16px; margin: 12px 0; font-size: 14px; }
    .muted { color: #8c8c8c; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đăng ký khóa học chưa được chấp nhận</h2>
    <p>Đăng ký của bạn cho khóa học <strong>{{course_name}}</strong> đã không được duyệt.</p>
    <div class="reason">
      <strong>Lý do:</strong> {{reject_reason}}
    </div>
    <p>Nếu bạn cần làm rõ hoặc muốn đăng ký khóa khác, vui lòng liên hệ trung tâm đào tạo.</p>
    <p class="muted">Email này được gửi tự động từ MarinePort.</p>
  </div>
</body>
</html>
