<!doctype html>
<html lang="vi">
  <body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;padding:32px">
            <tr>
              <td>
                <p style="margin:0 0 16px;font-size:16px">Chào {{fullName}},</p>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.5">
                  Bạn được mời dùng {{appName}} với vai trò <strong>{{roleName}}</strong>.
                  Bấm nút bên dưới để đặt mật khẩu và bắt đầu.
                </p>
                <p style="margin:0 0 24px">
                  <a href="{{link}}" style="display:inline-block;padding:12px 24px;background:#0b6bcb;color:#ffffff;text-decoration:none;border-radius:8px;font-size:15px">Đặt mật khẩu</a>
                </p>
                <p style="margin:0 0 4px;font-size:13px;color:#617083">Nếu nút không bấm được, mở địa chỉ này trong trình duyệt:</p>
                <p style="margin:0;font-size:13px;word-break:break-all"><a href="{{link}}" style="color:#0b6bcb">{{link}}</a></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
