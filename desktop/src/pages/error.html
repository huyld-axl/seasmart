<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>MCAH chưa mở được</title>
<style>
  /* Màn lỗi khởi động (wireframe 7, GĐ1 mục 3.2). Mã lỗi và thời điểm lấy từ query. */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f6; color: #2c2c2c; font: 14px/1.5 'Inter', system-ui, 'Segoe UI', sans-serif; }
  .box { width: min(480px, calc(100% - 32px)); background: #fff; border-radius: 16px; padding: 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 16px; }
  .err { padding: 10px 12px; border-radius: 8px; background: #fef2f2; color: #c10007; }
  .muted { margin: 0; color: #707070; }
  .code { font-family: ui-monospace, monospace; font-size: 12px; background: #e7e8ec; padding: 8px 10px; border-radius: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; border: 1px solid #d3d5db; background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button.pri { background: #003366; border-color: #003366; color: #fff; }
  button:focus-visible { outline: 2px solid #003366; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="box">
    <h1>MCAH chưa mở được</h1>
    <div class="err" id="reason"></div>
    <p class="muted">Thử: đóng app và mở lại; kiểm còn chỗ trống trên ổ đĩa; nếu vẫn lỗi, gửi mã lỗi và tệp nhật ký cho bộ phận hỗ trợ.</p>
    <div class="code" id="code"></div>
    <div class="row">
      <button type="button" id="logs">Mở thư mục nhật ký</button>
      <button type="button" id="quit">Thoát</button>
      <button type="button" class="pri" id="retry">Thử lại</button>
    </div>
  </main>
  <script src="error.js"></script>
</body>
</html>
