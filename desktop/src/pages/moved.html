<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Văn phòng đã chuyển máy</title>
<style>
  /* Máy chính cũ sau khi văn phòng chuyển sang máy khác (docs/design/wireframes/desktop-gd4.html màn 9). */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f6; color: #2c2c2c; font: 14px/1.5 'Inter', system-ui, 'Segoe UI', sans-serif; }
  .box { width: min(480px, calc(100% - 32px)); background: #fff; border-radius: 16px; padding: 28px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 16px; }
  p { margin: 0; }
  .muted { color: #707070; }
  .row { display: flex; justify-content: flex-end; }
  button { font: inherit; border: 1px solid #d3d5db; background: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #003366; outline-offset: 2px; }
</style>
</head>
<body>
  <main class="box">
    <h1>Văn phòng đã chuyển sang máy chính khác</h1>
    <p id="text">Văn phòng đã được chuyển sang một máy chính mới. Máy này ngừng phục vụ để tránh có hai bản dữ liệu.</p>
    <p class="muted">Dữ liệu cũ vẫn còn trên máy này. Muốn dùng máy này làm máy nhân viên: gỡ MCAH rồi cài lại.</p>
    <div class="row"><button type="button" id="quit">Thoát</button></div>
  </main>
  <script src="moved.js"></script>
</body>
</html>
