<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>MCAH</title>
<style>
  /* Màn chờ lúc mở app (GĐ1 mục 3.2): thay cửa sổ trắng trong 1–5 giây khởi động. */
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f4f4f6; color: #707070; font: 14px/1.5 'Inter', system-ui, 'Segoe UI', sans-serif; }
  .box { display: grid; justify-items: center; gap: 16px; }
  img { width: 64px; height: 64px; }
  .bar { width: 160px; height: 4px; border-radius: 2px; background: #e7e8ec; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #003366; border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; } }
</style>
</head>
<body>
  <div class="box" role="status">
    <img src="logo.svg" alt="MCAH">
    <div class="bar"><i></i></div>
    <div>Đang mở MCAH…</div>
  </div>
</body>
</html>
