  return `<button type="button" class="d-vchip" ${locked ? 'aria-disabled="true"' : ''}>${icon('search')}Đối chiếu tàu</button>`;
}
function inputRow(f, { vessel, locked, focusKey }) {
  const unsure = f.st === 'DATE_AMBIGUOUS';
  const unknown = f.st === 'UNKNOWN' || (f.st === 'UNKNOWN_KEPT' && !f.val);
  const edited = f.st === 'EDITED';
  const done = f.st === 'ACCEPTED';
  const value = unknown ? '' : f.val;
  const ph = f.st === 'UNKNOWN_KEPT' ? 'Để trống' : 'Không đọc được';
  const destText = f.to === 'pf' ? 'vào hồ sơ' : f.to === 'cmp' ? 'chỉ để so' : '';
  const hint = f.hint || (unsure ? 'Chữ viết tay, kiểm lại với bản gốc' : f.key === 'coc' ? 'Số dài, so từng ký tự với bản gốc' : (edited && f.raw !== f.val ? `AI đọc: ${f.raw}` : (f.note || '')));
  const touch = edited ? `<span class="d-okmark" title="Đã sửa">${icon('check-circle')}</span>` : needsTouch(f) && !locked ? `<button type="button" class="btn btn--sm btn--icon d-ok" aria-label="Đúng, giữ nguyên" title="Đúng, giữ nguyên">${icon('check')}</button>` : (done && (f.key === 'coc' || f.date) ? `<span class="d-okmark" title="Đã xác nhận">${icon('check-circle')}</span>` : '');
  const vc = f.key === 'ship' ? vesselChip(vessel, locked) : '';
  const norm = f.norm ? `<span class="d-in__hint">→ ${esc(f.norm)}</span>` : '';
  return `<div class="d-in ${f.half ? 'd-in--half' : ''} ${unsure ? 'd-in--warn' : ''} ${edited ? 'd-in--edited' : ''} ${focusKey === f.key ? 'd-in--focus' : ''}" data-key="${f.key}">
    <label class="d-in__label"><span>${esc(f.label)}${f.req ? ' <span class="d-req">*</span>' : ''}</span>${destText ? `<i>${destText}</i>` : ''}${edited ? `<b class="d-in__edited">${icon('check')}Đã sửa</b>` : ''}</label>
    <div class="d-in__box"><input class="input input--sm ${f.num ? 'd-mono' : ''}" data-orig="${esc(value)}" value="${esc(value)}" placeholder="${ph}" ${locked ? 'disabled' : ''} />${touch}${vc}</div>
    ${hint ? `<span class="d-in__hint ${unsure || f.hint ? 'd-in__hint--warn' : ''}">${esc(hint)}</span>` : ''}${norm}</div>`;
}

function t2Screen() {
  const tt = state.tt;
  const id = (state.page && SEQ.includes(state.page) ? state.page : null) || T2_DOC_BY_STATE[tt] || 'c2';
  const meta = DOCMETA[id];
  const idx = SEQ.indexOf(id);
  const locked = tt === 'da-vao-ho-so';
  const reading = tt === 'dang-doc';
  const failed = tt === 'giay-loi';
  const { fields, vessel } = docFieldsFor(id);
  const touch = fields.filter(needsTouch).length;
  const focusKey = fields.some((f) => f.key === state.hl) ? state.hl : (fields.find((f) => f.st === 'DATE_AMBIGUOUS') || fields.find((f) => f.st === 'UNKNOWN') || {}).key;
  const kindName = KIND_NAME[meta.kind];

  const head = `<div class="page-head d-top" data-wf-block="3"><div class="page-head__text"><h1 class="page-head__title">Duyệt giấy tờ</h1></div>
    <div class="page-head__actions"><span class="d-pagerbtns">${iconBtn('left', 'Giấy trước', 'md')}<span class="num">Giấy ${idx + 1}/${SEQ.length}</span>${iconBtn('right', 'Giấy sau', 'md')}</span>${btn('Đưa vào hồ sơ', { variant: 'primary', attrs: tt === 'may-chu-tu-choi' ? '' : 'aria-disabled="true" title="Còn 6 giấy chưa duyệt"' })}</div></div>`;
  const refused = tt === 'may-chu-tu-choi' ? `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Máy chủ không nhận việc đưa vào hồ sơ</p><p class="ds-banner__text">"Còn giấy chưa duyệt xong". Duyệt nốt các giấy còn lại rồi thử lại.</p></div><div class="ds-banner__action">${btn('Thử lại', { size: 'sm' })}</div></div>` : '';
  const mismatch = tt === 'khac-nguoi' && id === 'info' ? `<div role="alert" class="ds-banner ds-banner--warning">${icon('exclamation-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Tên trên giấy khác hồ sơ</p><p class="ds-banner__text">Giấy ghi "TRẦN VĂN KHÔI", hồ sơ là "Trần Minh Khôi". Giấy chưa vào hồ sơ được cho tới khi bạn quyết.</p></div><div class="ds-banner__action">${btn('Vẫn đúng người', { size: 'sm', variant: 'primary' })}${btn('Bỏ giấy', { size: 'sm' })}</div></div>` : '';
  const lockedBanner = locked ? `<div role="status" class="ds-banner ds-banner--neutral">${icon('lock', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Giấy này đã vào hồ sơ ngày 12/10/2026</p><p class="ds-banner__text">Chỉ để xem. Muốn đổi dữ liệu thì sửa ở hồ sơ, kèm lý do.</p></div></div>` : '';

  const frame = (content) => shell({ crumb: 'Thuyền viên', crumb2: 'Trần Minh Khôi', content });
  if (tt === 'dang-tai') return frame(`${head}<div class="cmp"><div class="cmp__pane"><span class="sk" style="width:100%;height:480px;border-radius:12px"></span></div><div class="cmp__pane"><div class="d-stack" style="padding:16px">${rowSkel(5)}</div></div></div>`);
  if (tt === 'rong') return frame(`${head}${emptyBlock('Chưa có giấy nào để duyệt', 'Thả giấy tờ ở hồ sơ thuyền viên. Giấy đọc xong sẽ hiện ở đây, từng giấy một.', btn('Về hồ sơ để thả tệp', { iconName: 'upload' }))}`);
  if (tt === 'mat-ket-noi') return frame(`${head}${errorBlock('Mất kết nối với máy chủ', 'Chưa lấy được giấy này. Phần bạn đã duyệt vẫn được giữ.')}`);
  if (tt === 'chua-cau-hinh') return frame(`${head}${aiOffBanner('Bạn vẫn xem được bản gốc. ')}<div class="cmp"><section class="cmp__pane cmp__pane--goc"><header class="cmp__head"><span class="cmp__title">Bản gốc</span></header><div class="cmp__stage d-doc-stage">${paperGoc(id, fields, focusKey)}</div></section></div>`);

  const left = `<section class="cmp__pane cmp__pane--goc"><header class="cmp__head"><span class="cmp__title">Bản gốc</span><span class="muted d-trunc">${esc(meta.file)} · ${meta.page}</span>
      <span class="cmp__tools">${iconBtn('zoom-out', 'Thu nhỏ')}<span class="num muted">100%</span>${iconBtn('zoom-in', 'Phóng to')}${iconBtn('rotate-right', 'Xoay')}</span></header>
    <div class="cmp__stage d-doc-stage" data-wf-block="5">${paperGoc(id, fields, focusKey)}</div></section>`;

  const typeHead = `<header class="cmp__head d-typehead"><span class="d-kind d-kind--${meta.kind}">${icon(meta.kind === 'cert' ? 'safety-certificate' : meta.kind === 'other' ? 'file' : 'book')}${kindName}</span><span class="d-grow"></span><span class="d-select d-select--ghost" title="Đổi loại giấy: AI đọc lại giấy này, khoảng 30 giây"><span>Đổi loại</span>${icon('down')}</span><span class="d-typehead__sub">${esc(meta.sub)}</span></header>`;
  let inner;
  if (reading) inner = `<div class="d-bulk" aria-live="polite"><span class="d-spin">${icon('loading')}</span><div class="d-grow"><b>Đang xử lý giấy này</b><p class="d-note">Khoảng 30 giây. Bạn xem bản gốc ở bên trái trong lúc chờ.</p></div></div>${Array.from({ length: 5 }, () => `<div class="d-in" aria-busy="true"><span class="sk" style="width:35%"></span><span class="sk" style="width:100%;height:36px;border-radius:8px"></span></div>`).join('')}`;
  else if (failed) inner = `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Không đọc được giấy này</p><p class="ds-banner__text">Các giấy khác vẫn đưa vào hồ sơ được; giấy này ở ngoài cho tới khi đọc xong.</p></div><div class="ds-banner__action">${btn('Thử lại', { size: 'sm', iconName: 'reload' })}${btn('Bỏ giấy', { size: 'sm' })}</div></div>`;
  else if (meta.kind === 'other') inner = `<div class="d-other"><p class="d-h">Giấy này được lưu kèm hồ sơ, không cần duyệt.</p><p class="d-note">Không phải sổ thuyền viên hay chứng chỉ nên không đọc từng ô. AI nhận sai thì bấm Đổi loại.</p><div class="d-row" style="justify-content:center;margin-top:12px">${btn('Giấy tiếp', { variant: 'primary', iconName: 'right' })}</div></div>`;
  else {
    const note = meta.kind === 'duty' ? `<p class="d-note">Mọi ô của trang này vào chuyến đi tàu.</p>` : '';
    const rows = fields.map((f) => inputRow(f, { vessel, locked, focusKey })).join('');
    const label = meta.kind === 'cert' ? 'Đã so số, xác nhận' : 'Xong, giấy tiếp';
    const disabled = locked ? true : touch > 0;
    const why = !locked && touch ? `<span class="d-note d-grow">${touch} ô tô vàng cần bạn xác nhận ✓</span>` : '<span class="d-grow"></span>';
    inner = `${note}<div class="d-ins">${rows}</div>${locked ? '' : `<div class="d-foot">${why}${btn(label, { variant: 'primary', iconName: meta.kind === 'cert' ? 'check' : 'right', attrs: disabled ? 'aria-disabled="true"' : '' })}</div>`}`;
  }
  const right = `<section class="cmp__pane cmp__pane--so">${typeHead}<div class="cmp__stage d-stack d-form-stage" data-wf-block="6">${inner}</div></section>`;
  const switcher = `<div class="switch-view"><div class="seg" role="group" aria-label="Xem"><button type="button" data-dview="doc" aria-pressed="${state.view === 'doc'}">Bản gốc</button><button type="button" data-dview="fields" aria-pressed="${state.view !== 'doc'}">Bản số hoá</button></div></div>`;
  return frame(`${refused}${head}${mismatch}${lockedBanner}${switcher}<div class="cmp" data-dview="${state.view === 'doc' ? 'doc' : 'fields'}">${left}${right}</div>`);
}

// ===== T5. Hồ sơ: tab Đi tàu và tab Giấy tờ =====
const MATCH_PILL = {
  MATCHED: (s) => pill('success', 'Tàu khớp danh mục', 'check-circle'),
  NOT_CHECKED: () => pill('neutral', 'Tàu chưa đối chiếu', 'ring'),
  NOT_FOUND: () => pill('warning', 'Không thấy trong danh mục', 'question-circle'),
};
function seaBadges(s) {
  const out = [];
  if (s.ongoing) out.push(pill('success', 'Đang trên tàu', 'ring-dot'));
  if (s.overlap) out.push(pill('warning', 'Trùng thời gian', 'swap'));
  if (s.missing) out.push(pill('warning', s.missing, 'calendar'));
  out.push(MATCH_PILL[s.match](s));
  return out;
}
const srcLink = (s) => (s.src === 'doc'
  ? `<span class="d-src">${icon('file-text')}${esc(s.srcLabel)} · <a class="d-link" style="font-size:12px">Xem bản gốc</a></span>`
  : `<span class="d-src">${icon('edit')}Nhập tay</span>`);
const dateCell = (date, port, { open = false } = {}) => (date
  ? `<div class="d-cell"><span class="d-cell__main d-mono" style="font-size:13px">${date}</span><span class="d-cell__sub">${esc(port || '—')}</span></div>`
  : `<div class="d-cell"><span class="d-cell__main" style="color:var(--muted);font-weight:400">${open ? 'Chưa rời tàu' : 'Chưa có ngày'}</span><span class="d-cell__sub">${esc(port || '')}</span></div>`);

const dateInline = (date, port, { open = false } = {}) => (date
  ? `<span class="d-nowrap"><span class="d-mono" style="font-size:13px">${date}</span> <span class="d-cell__sub">· ${esc(port || '—')}</span></span>`
  : `<span class="d-nowrap" style="color:var(--muted)">${open ? 'Chưa rời tàu' : 'Chưa có ngày'}${port ? ` · ${esc(port)}` : ''}</span>`);

function seaForm(s, { reason = true, create = false, reasonEmpty = true } = {}) {
  const input = (label, value, { full = false, mono = false, req = false } = {}) => `<div class="${full ? 'full' : ''}"><label class="field-label">${label}${req ? ' <span class="d-req">*</span>' : ''}</label><input class="input input--sm ${mono ? 'd-mono' : ''}" value="${esc(value ?? '')}" /></div>`;
  return `<div class="d-form">
    ${input('Tên tàu', create ? '' : s.ship, { full: true })}
    ${input('Loại tàu', create ? '' : s.shipSub.split(' · ')[0])}${input('Cờ tàu', create ? '' : s.shipSub.split(' · ')[1] || '')}
    ${input('Chức danh', create ? '' : s.rank)}${input('Số GCNKNCM', create ? '' : '004217/HP', { mono: true })}
    ${input('Cảng xuống tàu', create ? '' : s.onPort)}${input('Ngày xuống tàu', create ? '' : s.on, { mono: true })}
    ${input('Cảng rời tàu', create ? '' : s.offPort)}${input('Ngày rời tàu', create ? '' : s.off, { mono: true })}
    ${reason ? `<div class="full"><label class="field-label">Lý do sửa <span class="d-req">*</span></label><textarea class="input ${reasonEmpty ? 'input--error' : ''}" placeholder="Ví dụ: sửa ngày rời tàu theo bản gốc, AI đọc nhầm tháng 06 thành 08"></textarea>
      ${reasonEmpty ? `<p class="d-field-error">Cần ghi lý do để lưu. Lý do được ghi vào lịch sử hồ sơ.</p>` : ''}</div>` : ''}</div>`;
}
function editSheet(s, create = false) {

    <header class="d-sheet__head"><div><h2 class="d-sheet__title">${create ? 'Thêm chuyến (nhập tay)' : `Sửa chuyến ${esc(s.ship)}`}</h2><p class="d-note">${create ? 'Chuyến nhập tay không có bản gốc đi kèm.' : esc(s.srcLabel)}</p></div>${iconBtn('close', 'Đóng', 'md')}</header>

function deleteModal(s) {

// ----- tab Đi tàu: A bảng, B dòng thời gian, C danh sách + bản gốc -----
function seaA(rows, { editing, create } = {}) {
  const tr = rows.map((s) => `<tr data-tone="${s.overlap || s.missing ? 'warn' : ''}">
      <td><div class="d-cell"><span class="d-cell__main">${esc(s.ship)}</span><span class="d-cell__sub">${esc(s.shipSub)}</span>${dedupe() ? '' : `<span class="d-row" style="margin-top:4px">${seaBadges(s).join('')}</span>`}${s.overlap && !compact() ? `<span class="d-cell__sub" style="color:var(--warning)">${esc(s.overlap)}</span>` : ''}</div></td>
      <td><span class="d-cell__main" title="${esc(s.rankName)}">${esc(s.rank)}</span></td>
      <td>${dateInline(s.on, s.onPort)}</td><td>${dateInline(s.off, s.offPort, { open: s.ongoing })}</td>
      <td>${s.src === 'doc' ? `<div class="d-cell"><span class="d-src">${icon('file-text')}Từ sổ · ${s.srcLabel.split(', ')[1]}</span><a class="d-link" style="font-size:12px">Xem bản gốc</a></div>` : srcLink(s)}</td>
      <td class="r"><span class="d-row" style="justify-content:flex-end;flex-wrap:nowrap">${iconBtn('edit', `Sửa chuyến ${s.ship}`)}${iconBtn('delete', `Xoá chuyến ${s.ship}`)}</span></td></tr>`).join('');
  const cards = rows.map((s) => `<li><div class="d-row"><b class="d-grow">${esc(s.ship)}</b>${iconBtn('edit', `Sửa chuyến ${s.ship}`)}${iconBtn('delete', `Xoá chuyến ${s.ship}`)}</div>
      <span class="d-cell__sub">${esc(s.rank)} · ${s.on || 'chưa có ngày'} → ${s.off || (s.ongoing ? 'đang trên tàu' : 'chưa có ngày')}</span><div class="d-row">${seaBadges(s).join('')}</div>${srcLink(s)}</li>`).join('');
  return `<div class="d-only-wide" style="overflow-x:auto"><table class="d-sv-tbl" data-wf-block="6"><thead><tr><th>Tàu</th><th>Chức danh</th><th>Xuống tàu</th><th>Rời tàu</th><th>Nguồn</th><th class="r">Thao tác</th></tr></thead><tbody>${tr}</tbody></table></div>
    <ul class="d-card-list d-only-narrow">${cards}</ul>`;
}
function seaB(rows, { editing } = {}) {
  const items = rows.map((s) => {
    const isEdit = editing === s.id;
    return `<li data-now="${!!s.ongoing}"><div class="d-row"><b class="d-grow">${esc(s.ship)}</b>${s.overlap ? pill('warning', 'Trùng thời gian', 'swap') : ''}${iconBtn('edit', `Sửa chuyến ${s.ship}`)}${iconBtn('delete', `Xoá chuyến ${s.ship}`)}</div>
      <div class="d-cell__sub">${esc(s.shipSub)}</div>
      <div class="d-row"><span class="${s.on ? 'd-mono' : 'd-note'}" style="font-size:13px">${s.on || 'chưa có ngày xuống'}</span>${icon('arrow-right')}<span class="${s.off ? 'd-mono' : 'd-note'}" style="font-size:13px">${s.off || (s.ongoing ? 'đang trên tàu' : 'chưa có ngày')}</span></div><div class="d-note">${esc(s.rank)} (${esc(s.rankName)})</div>
      ${dedupe() ? '' : `<div class="d-row">${seaBadges(s).filter((b) => !b.includes('Trùng thời gian')).join('')}</div>`}${s.overlap && !compact() ? `<p class="d-note" style="color:var(--warning)">${esc(s.overlap)}</p>` : ''}${srcLink(s)}
      ${isEdit ? `<hr class="d-sep" />${seaForm(s, {})}<div class="d-row" style="justify-content:flex-end">${btn('Huỷ', {})}${btn('Lưu', { variant: 'primary', attrs: 'aria-disabled="true"' })}</div>` : ''}
      ${state.tt === 'xoa' && s.id === 's3' ? `<hr class="d-sep" /><div class="d-stack"><b>Xoá chuyến này?</b><div><label class="field-label">Lý do xoá <span class="d-req">*</span></label><textarea class="input input--error"></textarea><p class="d-field-error">Cần ghi lý do để xoá.</p></div><div class="d-row" style="justify-content:flex-end">${btn('Huỷ', {})}${btn('Xoá chuyến', { cls: 'btn--danger', attrs: 'aria-disabled="true"' })}</div></div>` : ''}</li>`;
  }).join('');
  return `<ol class="d-tl" data-wf-block="6">${items}</ol>`;
}
function seaC(rows) {
  const cur = rows.find((s) => s.id === (state.sel || 's3')) || rows[0];
  const list = rows.map((s) => `<li><button type="button" aria-current="${s.id === cur.id}" data-dsel="${s.id}"><span class="d-cell__main">${esc(s.ship)}</span><span class="d-cell__sub">${esc(s.rank)} · ${s.on || '—'} → ${s.off || (s.ongoing ? 'đang trên tàu' : '—')}</span>${s.overlap || s.missing || s.match !== 'MATCHED' ? `<span class="d-row">${seaBadges(s).slice(0, 2).join('')}</span>` : ''}</button></li>`).join('');
  const editing = state.tt === 'sua' || true;
  const detail = `<div class="panel" data-wf-block="7"><div class="panel__head"><h3 class="panel__title">${esc(cur.ship)}</h3>${srcLink(cur)}</div><div class="panel__body d-stack">
      ${cur.src === 'doc' ? `<div style="max-width:560px">${img('land', { spread: true, tag: `${cur.srcLabel.replace('Từ ', '')} · bản gốc, hai trang mở ra` })}</div>` : `<p class="d-note">${icon('edit')} Chuyến nhập tay, không có bản gốc đi kèm.</p>`}
      ${seaForm(cur, { reasonEmpty: state.tt === 'sua' })}<div class="d-row" style="justify-content:flex-end">${btn('Xoá chuyến', { cls: 'btn--danger', iconName: 'delete' })}${btn('Lưu', { variant: 'primary', attrs: 'aria-disabled="true"' })}</div></div></div>`;
  return `<div class="d-md"><section class="panel" data-wf-block="6"><ul class="d-md-list">${list}</ul></section>${detail}</div>`;

    document.querySelectorAll('#wf-design .d-in').forEach((r) => r.classList.toggle('d-in--focus', r.dataset.key === key));

    row.classList.remove('d-in--warn');
    if (edited) {
      row.classList.add('d-in--edited');
      const label = row.querySelector('.d-in__label');

Object.assign(STATUS, STATUS_BC);

const OPTION_LABELS = { loi: { a: '403', b: '404', c: '500' } };
const KEYS = ['man', 'v', 'mau', 'kho', 'nav', 'tt'];
const state = { man: Object.keys(SCREENS)[0], step: null, vtab: null, v: '', mau: 'mau', kho: 'desktop', nav: 'menu', tt: 'du-lieu', menuOpen: false, userOpen: false, sider: null, view: 'fields', tab: null, pick: 'mk', doc: null, focus: null, flip: 'so', ptab: null };
let currentTab = ['#flow', '#ds'].includes(location.hash) ? location.hash.slice(1) : 'screens';
const INITIAL_HASH = location.hash.replace(/^#/, '');
(function readState() {
  const params = new URLSearchParams(location.search);
  const hash = location.hash.replace(/^#/, '').split('.');
  if (hash.length === 1 && hash[0] && !['flow', 'ds'].includes(hash[0])) state.man = hash[0];
  KEYS.forEach((key, index) => { state[key] = params.get(key) || (hash.length === KEYS.length ? hash[index] : '') || state[key]; });
  if (!SCREENS[state.man]) state.man = Object.keys(SCREENS)[0];
})();
function normalize() {
  const screen = SCREENS[state.man];
  if (!screen.options.includes(state.v)) state.v = screen.recommended || screen.options[0];
  if (!screen.states.includes(state.tt)) state.tt = screen.states[0];
}
function syncHash() { try { if (currentTab === 'screens') history.replaceState(null, '', '#' + state.man); } catch (error) { /* bỏ qua */ } }

function shell({ title, crumb, crumb2, content, collapsedDefault = false, current = 'seafarers' }) {
  const collapsed = state.sider === null ? collapsedDefault : state.sider === 'collapsed';
  const nav = (withLabels = true) => NAV.map(([key, label, iconName]) =>
    `<a class="nav-item" ${key === current && state.man !== 'loi' ? 'aria-current="page"' : ''} ${key === 'admin' && state.man === 'loi' && state.v === 'a' ? 'aria-current="page"' : ''} title="${label}">${icon(iconName)}${withLabels ? `<span>${label}</span>` : ''}</a>`).join('');
  const heading = crumb
    ? `<nav class="topbar__crumb" aria-label="Đường dẫn"><a href="#">${crumb}</a>${icon('right')}${crumb2 ? `<a href="#">${crumb2}</a>${icon('right')}` : ''}</nav>`
    : `<h1 class="topbar__title">${title}</h1>`;
  return `<div class="app" data-nav="${state.nav}">
    <aside class="sider ${collapsed ? 'sider--collapsed' : ''}" data-wf-block="2">
      <div class="sider__head">${brand()}</div>
      <nav class="sider__nav">${nav()}</nav>
    </aside>
    <div class="main">
      <header class="topbar" data-wf-block="1">
        <button type="button" class="btn btn--ghost btn--icon burger" data-action="menu" aria-label="Mở menu">${icon('menu')}</button>
        <button type="button" class="btn btn--ghost btn--icon sider-toggle" data-action="sider" aria-label="${collapsed ? 'Mở rộng sidebar' : 'Thu gọn sidebar'}">${icon(collapsed ? 'menu-unfold' : 'menu-fold')}</button>
        ${heading}
        <div class="topbar__right">
          <button type="button" class="user-btn" data-action="user" aria-haspopup="menu" aria-expanded="${state.userOpen}">
            <span class="avatar">PT</span><span class="user-btn__name">Phạm Văn Tùng</span>${icon('down')}
          </button>
          ${state.userOpen ? `<div class="menu" role="menu"><p class="menu__meta">phamvantung@mcah.demo · Crewing Officer</p><div class="menu__sep"></div>
            <button type="button" class="menu__item menu__item--danger" role="menuitem">${icon('logout')}Đăng xuất</button></div>` : ''}
        </div>
      </header>
      <div class="content">${content}</div>
      <nav class="bottombar" aria-label="Điều hướng">${NAV.map(([key, label, iconName]) => `<a ${key === current ? 'aria-current="page"' : ''}>${icon(iconName)}${label}</a>`).join('')}</nav>
    </div>
    ${state.menuOpen ? `<div class="drawer-scrim" data-action="menu"></div><aside class="drawer"><div class="sider__head">${brand()}</div><nav class="sider__nav">${nav()}</nav></aside>` : ''}
  </div>`;
}

function statusTabs(selected) {
  const current = TABS.find(([value]) => value === selected);
  return `<div class="ds-tabs-boxed" role="tablist">${TABS.map(([value, label, count]) =>
    `<button type="button" role="tab" class="ds-tabs-boxed__tab" data-tab="${value}" aria-selected="${value === selected}">${label}<span class="ds-tabs-boxed__count">${state.tt === 'dang-tai' ? '' : state.tt === 'rong' ? 0 : count}</span></button>`).join('')}</div>
    <button type="button" class="btn ds-tabs-mobile"><span class="muted">Hiển thị:</span> ${current[1]} · ${state.tt === 'rong' ? 0 : current[2]} ${icon('down')}</button>`;
}

const avatar = (name, size = '') => `<span class="avatar ${size}">${initials(name)}</span>`;

const availability = (crew) => (crew.status === 'ONBOARD' ? `${crew.vessel} · đến ${crew.until}` : crew.status === 'STANDBY' ? `Sẵn sàng từ ${crew.ready}` : `Nghỉ đến ${crew.ready}`);

function listState(columns) {
  const head = columns.map((column) => `<th class="${column.cls || ''}">${column.title}</th>`).join('');
  if (state.tt === 'dang-tai') {
    const skeletonRows = Array.from({ length: 6 }, () => `<tr>${columns.map((column, index) => `<td class="${column.cls || ''}">${index === 0 ? '<span style="display:flex;gap:12px;align-items:center"><span class="sk" style="width:36px;height:36px;border-radius:999px"></span><span style="flex:1"><span class="sk" style="width:70%"></span><span class="sk" style="width:40%;margin-top:8px"></span></span></span>' : '<span class="sk" style="width:60%"></span>'}</td>`).join('')}</tr>`).join('');
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${skeletonRows}</tbody></table></div>
      <ul class="doc-list">${Array.from({ length: 4 }, () => '<li><span class="sk" style="width:80%"></span><span class="sk" style="width:60px"></span><span class="sk" style="width:50%"></span></li>').join('')}</ul>`;
  }
  if (state.tt === 'rong') return `<div class="ds-empty"><p class="ds-empty__title">Chưa có thuyền viên nào</p><p class="ds-empty__text">Thêm thuyền viên rồi thả sổ thuyền viên, chứng chỉ vào hồ sơ. AI đọc giấy tờ và điền sẵn để bạn duyệt.</p><div class="ds-empty__action">${btn('Thêm thuyền viên', { iconName: 'plus' })}</div></div>`;

  return null;
}

function crewScreen() {
  const v = state.v;
  const selectedTab = state.tab || 'all';
  const filter = { onboard: (crew) => crew.status === 'ONBOARD', standby: (crew) => crew.status !== 'ONBOARD', review: (crew) => crew.review, expiring: (crew) => crew.expired || crew.expiring }[selectedTab];
  const rows = filter ? CREW.filter(filter) : CREW;
  const toolbar = `<div class="toolbar" data-wf-block="3">${statusTabs(selectedTab)}<label class="search toolbar__search">${icon('search')}<input class="input" placeholder="Tìm tên, chức danh, số sổ" aria-label="Tìm thuyền viên" /></label>${btn('Thêm thuyền viên', { variant: 'primary', iconName: 'plus' })}</div>`;
  const pending = listState([CREW_COL.person, CREW_COL.status, CREW_COL.where]);

  if (v === 'b') {
    const cards = pending ? `<div class="panel">${pending}</div>` : `<div class="crew-grid" data-wf-block="4">${rows.map((crew) => `<a class="crew-card">
      <span class="crew-card__top">${avatar(crew.name, 'avatar--md')}<span class="cell2"><span class="cell2__main">${esc(crew.name)}</span><span class="cell2__sub">${crew.rank}</span></span></span>
      <span class="crew-card__row">${crewStatus(crew)}<span class="muted crew-card__where">${availability(crew)}</span></span>
      <span class="crew-card__foot"><span>${docsAlert(crew)}</span><span class="complete-cell">${completeness(crew)}</span></span>
      ${crew.review ? `<span class="crew-card__review">${reviewChip(crew)}</span>` : ''}</a>`).join('')}</div>`;
    return shell({ title: 'Thuyền viên', current: 'seafarers', content: `${toolbar}${cards}` });
  }
  if (v === 'c') {
    const picked = CREW.find((crew) => crew.id === (state.pick || 'mk'));
    const list = pending ? `<div class="panel">${pending}</div>` : `<div class="panel md-list" data-wf-block="4"><ul>${rows.map((crew) => `<li><button type="button" data-pick="${crew.id}" aria-current="${crew.id === picked.id}"><span class="person">${avatar(crew.name)}<span class="cell2"><span class="cell2__main">${esc(crew.name)}</span><span class="cell2__sub">${crew.rank} · ${availability(crew)}</span></span></span>${crewStatus(crew)}</button></li>`).join('')}</ul></div>`;
    const preview = pending ? '' : `<section class="panel md-detail" data-wf-block="5"><div class="panel__body" style="display:grid;gap:16px">
      <div class="person">${avatar(picked.name, 'avatar--lg')}<span class="cell2"><span class="cell2__main" style="font-size:16px">${esc(picked.name)}</span><span class="cell2__sub">${picked.rank} · ${picked.nat}</span></span><span style="margin-left:auto">${btn('Mở hồ sơ', { size: 'sm' })}</span></div>
      <dl class="facts"><div><dt>Tình trạng</dt><dd>${crewStatus(picked)}</dd></div><div><dt>Tàu / sẵn sàng</dt><dd>${availability(picked)}</dd></div><div><dt>Giấy tờ</dt><dd>${docsAlert(picked)}</dd></div><div><dt>Hồ sơ đầy đủ</dt><dd class="complete-cell">${completeness(picked)}</dd></div></dl>
      ${picked.review ? `<div role="status" class="ds-banner ds-banner--warning">${icon('ellipsis', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">${picked.review} giấy tờ AI vừa đọc, chờ bạn duyệt</p></div><div class="ds-banner__action">${btn('Duyệt')}</div></div>` : ''}
      ${dropzone(picked)}</div></section>`;
    return shell({ title: 'Thuyền viên', current: 'seafarers', content: `${toolbar}<div class="md">${list}${preview}</div>` });
  }
  const columns = [CREW_COL.person, CREW_COL.status, CREW_COL.where, CREW_COL.docs, CREW_COL.complete, CREW_COL.open];
  const body = pending || `<div class="tbl-wrap"><table class="tbl tbl--link"><thead><tr>${columns.map((column) => `<th class="${column.cls || ''}">${column.title}</th>`).join('')}</tr></thead><tbody>${rows.map((crew) => `<tr>${columns.map((column) => `<td class="${column.cls || ''}">${column.render(crew)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <ul class="doc-list">${rows.map((crew) => `<li><span class="person">${avatar(crew.name)}<span class="cell2"><span class="cell2__main">${esc(crew.name)}</span><span class="cell2__sub">${crew.rank}</span></span></span><span>${crewStatus(crew)}</span><span class="cell2__sub">${availability(crew)} · ${docsAlert(crew)}</span>${reviewChip(crew)}</li>`).join('')}</ul>
    <div class="tbl-foot"><span>${rows.length} thuyền viên</span></div>`;
  return shell({ title: 'Thuyền viên', current: 'seafarers', content: `${toolbar}<div class="panel" data-wf-block="4">${body}</div>` });
}

function paper(type, mode, { focus, onlyIssues = false } = {}) {
  const doc = DOC_TYPES[type];
  const original = mode === 'goc';
  const rows = doc.fields.map(([key, label, english, raw, value, fieldState, width]) => {
    const unknown = fieldState === 'UNKNOWN';
    const shown = original ? (raw ? `<span class="ink">${esc(raw)}</span>` : '<span class="ink ink--blank">&nbsp;</span>')
      : `<span class="dv" data-st="${fieldState}">${unknown ? 'Không có trên giấy' : esc(value)}${fieldState === 'ACCEPTED' || fieldState === 'EDITED' ? icon(fieldState === 'EDITED' ? 'edit' : 'check', 'dv__mark') : fieldState === 'PROPOSED' ? '' : icon(STATUS.field[fieldState][2], 'dv__mark')}</span>`;
    const dim = onlyIssues && ['ACCEPTED'].includes(fieldState);
    return `<div class="pf ${width === 'half' ? 'pf--half' : ''} ${focus === key ? 'pf--focus' : ''} ${dim ? 'pf--dim' : ''}" data-field="${key}"><span class="pf__label">${label}<i>${english}</i></span><span class="pf__value">${shown}</span></div>`;
  }).join('');
  return `<div class="paper ${original ? 'paper--goc' : 'paper--so'}">
    <p class="paper__title">${doc.title[0]}<i>${doc.title[1]}</i></p>
    ${doc.photo ? `<span class="paper__photo">${original ? 'Ảnh' : icon('user')}</span>` : ''}
    <div class="paper__fields">${rows}</div>
    <div class="paper__stamps">${doc.stamps.map((stamp) => `<span class="paper__stamp">${original ? '<span class="seal" aria-hidden="true"></span>' : ''}${stamp}</span>`).join('')}</div>
  </div>`;
}

function fieldActionBar(type, focus) {
  const field = DOC_TYPES[type].fields.find(([key]) => key === focus);
  if (!field) return '';
  const [, label, , raw, value, fieldState] = field;
  const [note, actions] = FIELD_NOTES[focus] || ['AI đọc rõ. Kiểm lại với bản gốc rồi chấp nhận.', [['check', 'Chấp nhận'], ['edit', 'Sửa'], ['close', 'Từ chối']]];
  return `<div class="field-bar" data-wf-block="7"><div class="field-bar__text"><p class="field-bar__label">${label} ${badge('field', fieldState)}</p><p class="field-bar__note">Trên giấy: <b class="ink-inline">${esc(raw) || 'để trống'}</b> → ${esc(value) || 'không có'}. ${note}</p></div><div class="field-bar__actions">${actions.map(([iconName, text], index) => btn(text, { size: 'sm', variant: index === 0 ? 'primary' : '', iconName })).join('')}</div></div>`;
}

function docSwitcher(current) {
  return `<div class="doc-switch" role="tablist" aria-label="Giấy tờ trong lần tải này" data-wf-block="4">${DOC_ORDER.map((key) => `<button type="button" role="tab" data-doc="${key}" aria-selected="${key === current}"><span class="doc-switch__name">${DOC_TYPES[key].label}</span><span class="doc-switch__meta">${DOC_TYPES[key].page} · ${STATUS.document[DOC_STATUS[key]][0]}</span></button>`).join('')}</div>`;
}

function reviewScreen() {
  const type = state.doc || 'so-45';
  const doc = DOC_TYPES[type];
  const focus = state.focus || 'off';
  if (state.tt === 'loi') return shell({ crumb: 'Thuyền viên', crumb2: 'Trần Minh Khôi', current: 'seafarers', collapsedDefault: true, content: `<div class="ds-empty" role="alert" style="padding-top:96px"><p class="ds-empty__title ds-empty__title--error">Không tải được giấy tờ</p><p class="ds-empty__text">Mất kết nối tới máy chủ. Phần đã duyệt vẫn được giữ.</p><div class="ds-empty__action">${btn('Thử lại', { iconName: 'reload' })}</div></div>` });
  const loading = state.tt === 'dang-tai';
  const counts = doc.fields.reduce((acc, [, , , , , fieldState]) => { acc[['ACCEPTED', 'EDITED'].includes(fieldState) ? 'done' : 'todo'] += 1; return acc; }, { done: 0, todo: 0 });
  const conflict = state.tt === 'xung-dot' ? `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Hồ sơ vừa được Lê Thu Hà cập nhật</p><p class="ds-banner__text">Thay đổi của bạn chưa lưu. Tải lại để xem bản mới rồi duyệt tiếp.</p></div><div class="ds-banner__action">${btn('Tải lại')}</div></div>` : '';
  const head = `<div class="page-head" data-wf-block="3"><div class="page-head__text"><h1 class="page-head__title">${loading ? '<span class="sk" style="width:280px;height:20px"></span>' : `Duyệt giấy tờ của Trần Minh Khôi`}</h1><p class="page-head__desc">${loading ? '' : `4 giấy tờ tải lên 10:40 hôm nay bởi Phạm Văn Tùng`}</p></div>
    <div><div class="page-head__actions">${loading ? '' : `<span role="status" class="ds-save">${icon('check')} Đã lưu</span>`}${btn('Đưa vào hồ sơ', { variant: 'primary', attrs: 'aria-disabled="true"' })}</div>${loading ? '' : `<p class="publish-note">Còn ${counts.todo} ô chưa duyệt ở giấy tờ này</p>`}</div></div>`;
  if (loading) return shell({ crumb: 'Thuyền viên', crumb2: 'Trần Minh Khôi', current: 'seafarers', collapsedDefault: true, content: `${head}<div class="cmp"><div class="cmp__pane"><span class="sk" style="width:100%;height:480px;border-radius:12px"></span></div><div class="cmp__pane"><span class="sk" style="width:100%;height:480px;border-radius:12px"></span></div></div>` });
  const empty = state.tt === 'rong';
  const paneHead = (title, extra = '') => `<header class="cmp__head"><span class="cmp__title">${title}</span>${extra}</header>`;
  const tools = `<span class="cmp__tools">${btn('', { variant: 'ghost', size: 'sm', iconName: 'minus', attrs: 'aria-label="Thu nhỏ"' }).replace('btn--sm', 'btn--sm btn--icon')}<span class="num muted">100%</span>${btn('', { variant: 'ghost', size: 'sm', iconName: 'plus', attrs: 'aria-label="Phóng to"' }).replace('btn--sm', 'btn--sm btn--icon')}</span>`;
  const progress = `<span class="muted num">${counts.done} / ${doc.fields.length} ô đã duyệt</span>`;
  const right = empty
    ? `<div class="ds-banner ds-banner--warning" role="status">${icon('exclamation-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">AI không đọc được giấy tờ này</p><p class="ds-banner__text">Chọn loại giấy tờ rồi nhập tay theo khuôn bên dưới.</p></div><div class="ds-banner__action">${btn('Chọn loại giấy tờ')}</div></div>`
    : paper(type, 'so', { focus, onlyIssues: state.v === 'c' });
  const switcher = `<div class="switch-view"><div class="seg" role="group" aria-label="Xem"><button type="button" data-view="doc" aria-pressed="${state.view === 'doc'}">Bản gốc</button><button type="button" data-view="fields" aria-pressed="${state.view !== 'doc'}">Bản số hoá</button></div></div>`;
  let body;
  if (state.v === 'b') {
    const showing = state.flip === 'goc' ? 'goc' : 'so';
    body = `<div class="flip" data-wf-block="5"><header class="cmp__head"><div class="seg" role="group" aria-label="Lật"><button type="button" data-flip="goc" aria-pressed="${showing === 'goc'}">Bản gốc</button><button type="button" data-flip="so" aria-pressed="${showing === 'so'}">Bản số hoá</button></div><span class="muted">Giữ phím Space để lật nhanh</span>${progress}</header>
      <div class="flip__stage">${showing === 'goc' ? paper(type, 'goc', { focus }) : right}</div></div>${empty ? '' : fieldActionBar(type, focus)}`;
  } else {
    body = `${switcher}<div class="cmp" data-view="${state.view === 'doc' ? 'doc' : 'fields'}">
      <section class="cmp__pane cmp__pane--goc" data-wf-block="5">${paneHead('Bản gốc', `<span class="muted">${doc.file}</span>${tools}`)}<div class="cmp__stage">${paper(type, 'goc', { focus })}</div></section>
      <section class="cmp__pane cmp__pane--so" data-wf-block="6">${paneHead('Bản số hoá', `${state.v === 'c' ? '<span class="muted cmp__note">Chỉ sáng các ô cần xem</span>' : ''}${progress}`)}<div class="cmp__stage">${right}</div></section></div>${empty ? '' : fieldActionBar(type, focus)}`;
  }
  return shell({ crumb: 'Thuyền viên', crumb2: 'Trần Minh Khôi', current: 'seafarers', collapsedDefault: true, content: `${conflict}${head}${docSwitcher(type)}${body}` });
}

function placeBlockNumbers() {
  const overlap = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  for (const block of document.querySelectorAll('[data-wf-block]')) {
    const rect = block.getBoundingClientRect();
    const numberRect = { left: rect.left + 4, top: rect.top + 4, right: rect.left + 22, bottom: rect.top + 22 };
    const contentRects = [...block.querySelectorAll('svg, img')].map((node) => node.getBoundingClientRect());
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (!node.textContent.trim()) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      contentRects.push(...range.getClientRects());
    }
    block.toggleAttribute('data-wf-block-out', contentRects.some((r) => r.width > 0 && overlap(r, numberRect)));
  }
}

  if (button.closest('#tt-menu')) {
    const menu = document.getElementById('tt-menu');
    const existing = document.querySelector('.wf-popover');

  state.man = key; resetLocal(); state.v = SCREENS[key].options[0]; state.tt = SCREENS[key].states[0]; state.kho = key === 'ky-online' ? 'mobile' : 'desktop';
  let html = '';
  try { html = screenFns()[key](); } catch (error) { html = ''; }
  Object.assign(state, saved);
  return html;
}
let flowBuilt = false;
function buildFlow() {
  if (flowBuilt) { drawEdges(); return; }
  flowBuilt = true;
  const panel = document.getElementById('tab-flow');
  panel.innerHTML = `<section class="fl"><div class="fl-intro"><h2>Luồng màn MVP</h2><p>Từ danh sách thuyền viên tới bộ giấy đã ký. Bấm một màn để mở bản bấm thử được.</p></div>
    <div class="fl-scroll"><div class="fl-canvas" id="fl-canvas"><svg class="fl-svg" id="fl-svg" aria-hidden="true"></svg>${FLOW.map(([title, sub, keys]) => `<div class="fl-lane"><div class="fl-lane-label"><b>${title}</b><span>${sub}</span></div>${keys.map((key) => key ? `<div class="fl-node" role="link" tabindex="0" aria-label="Mở ${SCREENS[key].label}" data-go="${key}" id="fl-${key}"><div class="fl-thumb ${key === 'ky-online' ? 'fl-thumb--phone' : ''}"><div class="fl-thumb-inner" inert>${thumbHtml(key)}</div></div><span class="fl-cap"><b>${CODES[key]}</b><span>${SCREENS[key].label}</span></span></div>` : '<span></span>').join('')}</div>`).join('')}</div></div>
    <p class="fl-legend"><span><i></i>Đi tiếp</span><span><i class="back"></i>Quay lại</span></p></section>`;
  panel.addEventListener('click', (event) => { const node = event.target.closest('[data-go]'); if (node) goScreen(node.dataset.go); });
  panel.addEventListener('keydown', (event) => { const node = event.target.closest('[data-go]'); if (node && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); goScreen(node.dataset.go); } });
  requestAnimationFrame(drawEdges);
}
function drawEdges() {
  const canvas = document.getElementById('fl-canvas'); const svg = document.getElementById('fl-svg');
  if (!canvas || !canvas.offsetWidth) return;
  const base = canvas.getBoundingClientRect();
  const box = (key) => { const r = document.querySelector(`#fl-${key} .fl-thumb`).getBoundingClientRect(); const n = document.getElementById(`fl-${key}`).getBoundingClientRect(); return { nb: n.bottom - base.top, l: r.left - base.left, r: r.right - base.left, t: r.top - base.top, b: r.bottom - base.top, cx: (r.left + r.right) / 2 - base.left, cy: (r.top + r.bottom) / 2 - base.top }; };
  svg.setAttribute('width', canvas.scrollWidth); svg.setAttribute('height', canvas.scrollHeight);
  svg.innerHTML = '<defs><marker id="fl-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--primary)" stroke="none"/></marker><marker id="fl-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)" stroke="none"/></marker></defs>' + EDGES.map(([from, to, label, kind]) => {
    const a = box(from); const b = box(to); let d; let lx; let ly;
    if (Math.abs(a.cy - b.cy) < 4) {
      if (kind === 'back') { d = `M${a.l + 24} ${a.nb + 2}C${a.l + 24} ${a.nb + 30} ${b.r - 24} ${b.nb + 30} ${b.r - 24} ${b.nb + 4}`; lx = (a.l + b.r) / 2; ly = a.nb + 32; }
      else { d = `M${a.r + 4} ${a.cy}L${b.l - 6} ${b.cy}`; lx = (a.r + b.l) / 2; ly = a.cy - 10; }
    } else if (b.cy > a.cy) {
      const sx = a.cx; const ex = b.cx; const my = (a.nb + b.t) / 2;
      d = `M${sx} ${a.nb + 4}C${sx} ${my + 8} ${ex} ${my - 8} ${ex} ${b.t - 6}`; lx = (sx + ex) / 2; ly = my - 6;
    } else {
      const sx = a.r - 24; const ex = b.r - 24; const my = (b.nb + a.t) / 2;
      d = `M${sx} ${a.t - 4}C${sx} ${my - 8} ${ex} ${my + 8} ${ex} ${b.nb + 6}`; lx = Math.min(sx, ex) - 8; ly = my + 4;
    }
    const anchor = b.cy < a.cy ? 'end' : 'middle';
    return `<path d="${d}" class="${kind || ''}" marker-end="url(#${kind === 'back' ? 'fl-b' : 'fl-a'})"/><text x="${lx}" y="${ly}" text-anchor="${anchor}">${label}</text>`;
  }).join('');
}
let dsLoaded = false;
function loadDs() {
  if (dsLoaded) return; dsLoaded = true;
  const panel = document.getElementById('tab-ds');
  fetch('design-system.html').then((res) => { if (!res.ok) throw new Error(res.status); return res.text(); }).then((html) => {
    const frame = document.createElement('iframe'); frame.className = 'ds-frame'; frame.title = 'MCAH Design System'; frame.srcdoc = html;
    panel.innerHTML = ''; panel.appendChild(frame);
  }).catch(() => { panel.innerHTML = '<p class="ds-wait">Không tải được trang Design system. Tải lại trang để thử lại.</p>'; dsLoaded = false; });
}
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('[data-tab]').forEach((button) => button.setAttribute('aria-selected', String(button.dataset.tab === tab)));
  ['screens', 'flow', 'ds'].forEach((key) => { document.getElementById('tab-' + key).hidden = key !== tab; });
  if (tab === 'flow') buildFlow();
  if (tab === 'ds') loadDs();
  try { history.replaceState(null, '', '#' + (tab === 'screens' ? state.man : tab)); } catch (error) { /* bỏ qua */ }
}
(function initShell() {
  ['flow', 'ds'].forEach((key) => { const panel = document.createElement('div'); panel.id = 'tab-' + key; panel.setAttribute('role', 'tabpanel'); panel.hidden = true; document.body.appendChild(panel); });
  document.querySelector('.sc-tabs').addEventListener('click', (event) => { const button = event.target.closest('[data-tab]'); if (button) showTab(button.dataset.tab); });
  window.addEventListener('resize', () => { if (currentTab === 'flow') drawEdges(); });
  const first = INITIAL_HASH;
  if (first === 'flow' || first === 'ds') showTab(first);
  if (state.man === 'ky-online') state.kho = 'mobile';
  render();
})();

</script>
