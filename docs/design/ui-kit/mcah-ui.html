<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCAH UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Wireframe nhóm A của MCAH (skill ui-ux, nhánh U, bước U3). Một theme sáng có chủ ý, như app.
     Token chép từ frontend/src/theme/tokens.js; component dùng chung class với frontend/src/components/ds/ds.css. */
  :root {
    color-scheme: light;
    --primary: #003366;
    --primary-hover: #1a4775;
    --primary-foreground: #ffffff;
    --primary-light: rgba(0, 51, 102, 0.06);
    --background: #f4f4f6;
    --surface: #ffffff;
    --foreground: #2c2c2c;
    --muted: #707070;
    --border: #e5e6ea;
    --border-strong: #d3d5db;
    --secondary: #e7e8ec;
    --secondary-hover: #dbdce2;
    --item-hover: #f4f4f6;
    --surface-hover: #f8f8fa;
    --button-hover: #f1f1f3;
    --ring-focus: rgba(0, 51, 102, 0.1);
    --border-focus: #003366;
    --neutral: #52525c;
    --neutral-bg: #f4f4f5;
    --success: #007a55;
    --success-bg: #ecfdf5;
    --warning: #bb4d00;
    --warning-bg: #fffbeb;
    --warning-border: #fee685;
    --error-strong: #c10007;
    --error-bg: #fef2f2;
    --error-border: #ffc9c9;
    --error: #fb2c36;
    --error-text: #e7000b;
    --danger: #c70036;
    --danger-bg: rgba(255, 32, 86, 0.1);
    --danger-bg-hover: rgba(255, 32, 86, 0.15);
    --app-font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --elevation-popover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --elevation-modal: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --legacy-none: 0;
  }
  /* Nấc Xám: tắt màu nhấn và màu trạng thái, còn lại giữ nguyên token (U3). */
  :root[data-mau="xam"] {
    --primary: #2c2c2c; --primary-hover: #474747; --primary-light: rgba(44, 44, 44, 0.05);
    --ring-focus: rgba(44, 44, 44, 0.1); --border-focus: #2c2c2c;
    --success: #52525c; --success-bg: #f4f4f5; --warning: #52525c; --warning-bg: #f4f4f5; --warning-border: #e4e4e7;
    --error-strong: #52525c; --error-bg: #f4f4f5; --error-border: #e4e4e7; --error-text: #52525c; --danger: #52525c; --danger-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--app-font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: none; }

  /* Component riêng của MCAH. Dự án không dùng Tailwind: class của skill dịch sang CSS thuần, màu lấy biến
   token (src/theme/tokens.js). Không mã màu nào ngoài biến, trừ lớp phủ theo màu chữ. */

.ds-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.ds-link {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--foreground);
  font: inherit;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ---------- Badge trạng thái (M7) ---------- */
.ds-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.05);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
}
.ds-badge--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-badge--success { background: var(--success-bg); color: var(--success); }
.ds-badge--warning { background: var(--warning-bg); color: var(--warning); }
.ds-badge--error { background: var(--error-bg); color: var(--error-strong); }
.ds-badge__icon { font-size: 13px; }
.ds-badge__dot { flex-shrink: 0; width: 10px; height: 10px; border-radius: 9999px; }
.ds-badge__dot--ring { border: 1.5px solid currentColor; }
.ds-badge__dot--ring-dot { border: 1.5px solid currentColor; background: radial-gradient(currentColor 0 2px, transparent 2.5px); }

/* ---------- Ô trường duyệt ---------- */
.ds-field {
  display: grid;
  gap: 8px;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.ds-field--active { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-field__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.ds-field__label { color: var(--muted); font-size: 12px; font-weight: 500; }
.ds-field__required { margin-left: 2px; color: var(--error-text); }
.ds-field__value { margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-field__value--unknown { color: var(--muted); font-style: italic; font-weight: 400; }
.ds-field__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.ds-field__badges { display: flex; flex-wrap: wrap; gap: 6px; }
.ds-field__actions { display: flex; flex-wrap: wrap; gap: 2px; }
.ds-field__reason { margin: 0; color: var(--muted); font-size: 12px; }

.ds-chip-page {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: var(--foreground);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.ds-chip-page:hover { background: rgb(44 44 44 / 0.1); }

/* ---------- Khung xem tài liệu ---------- */
.ds-viewer {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.ds-viewer__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  min-height: 56px;
  padding: 8px 12px 8px 20px;
  border-bottom: 1px solid var(--border-strong);
}
.ds-viewer__name { flex: 1 1 200px; min-width: 0; margin: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-viewer__tools { display: flex; flex-shrink: 0; align-items: center; gap: 2px; }
.ds-viewer__count { min-width: 44px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.ds-viewer__divider { width: 1px; height: 20px; margin: 0 6px; background: var(--border-strong); }
.ds-viewer__evidence { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--border); background: var(--primary-light); color: var(--foreground); font-size: 12px; }
.ds-viewer__stage { display: grid; place-items: start center; min-height: 320px; padding: 24px; overflow: auto; background: var(--background); }

.ds-sample-page {
  width: 100%;
  min-width: 480px; /* trang tài liệu không co chữ theo màn: hẹp thì cuộn như ảnh */
  max-width: 520px;
  padding: 24px;
  border-radius: 4px;
  background: #fbfaf6; /* giấy sổ, chỉ trong trang mẫu */
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  color: #3b3b3b;
  font-family: 'Courier New', ui-monospace, monospace;
  font-size: 12px;
}
.ds-sample-page__title { margin: 0 0 12px; font-weight: 700; letter-spacing: 0.04em; }
.ds-sample-page table { width: 100%; border-collapse: collapse; }
.ds-sample-page th, .ds-sample-page td { padding: 6px; border: 1px solid #c9c4b5; text-align: left; }
.ds-sample-page td { font-family: 'Segoe Script', 'Brush Script MT', cursive; font-size: 13px; }
.ds-sample-page__stamp { margin: 16px 0 0; color: #5f5a4e; text-align: right; }

/* ---------- Khung kéo thả tệp ---------- */
.ds-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--background) 60%, transparent);
  text-align: center;
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-drop:hover { background: var(--item-hover); }
.ds-drop__title { color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-drop__hint { margin-top: 4px; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-drop__button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin-top: 16px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
}
@media (hover: none) { .ds-drop__title { display: none; } }

.ds-files { margin: 16px 0 0; padding: 0; list-style: none; }
.ds-files__row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.ds-files__row:first-child { border-top: 0; }
.ds-files__icon { flex-shrink: 0; color: var(--muted); font-size: 18px; }
.ds-files__body { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; gap: 6px; min-width: 0; }
.ds-files__line { display: flex; align-items: baseline; gap: 12px; }
.ds-files__name { display: flex; flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-files__head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-files__tail { flex-shrink: 0; white-space: nowrap; }
.ds-files__percent { flex-shrink: 0; margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.ds-files__meta { margin: 0; color: var(--muted); font-size: 12px; }
.ds-files__meta--error { color: var(--error-text); }
.ds-files__meta--warning { color: var(--warning); }

/* ---------- Thanh tiến độ ---------- */
.ds-progress { height: 8px; border-radius: 9999px; background: rgb(44 44 44 / 0.05); overflow: hidden; }
.ds-progress--thin { height: 4px; }
.ds-progress__bar { height: 100%; border-radius: 9999px; background: var(--primary); }
.ds-progress-block { display: grid; gap: 8px; }
.ds-progress-block__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ds-progress-block__label { min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-progress-block__value { flex-shrink: 0; margin: 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- Dòng thời gian audit ---------- */
.ds-timeline { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.ds-timeline__item { position: relative; display: flex; gap: 12px; padding-bottom: 24px; }
.ds-timeline__item:last-child { padding-bottom: 0; }
.ds-timeline__line { position: absolute; top: 40px; bottom: 4px; left: 15px; width: 2px; background: var(--border-strong); }
.ds-timeline__item:last-child .ds-timeline__line { display: none; }
.ds-timeline__icon { display: grid; flex-shrink: 0; place-items: center; width: 32px; height: 32px; border-radius: 9999px; font-size: 14px; }
.ds-timeline__icon--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-timeline__icon--success { background: var(--success-bg); color: var(--success); }
.ds-timeline__icon--warning { background: var(--warning-bg); color: var(--warning); }
.ds-timeline__icon--error { background: var(--error-bg); color: var(--error-strong); }
.ds-timeline__body { min-width: 0; flex: 1; padding-top: 6px; }
.ds-timeline__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.ds-timeline__title { margin: 0; color: var(--foreground); font-weight: 500; }
.ds-timeline__time { flex-shrink: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ds-timeline__change { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.ds-timeline__before { color: var(--muted); text-decoration: line-through; }
.ds-timeline__after { color: var(--foreground); font-weight: 500; }
.ds-timeline__detail { max-width: 55ch; margin: 4px 0 0; color: var(--muted); text-wrap: pretty; }
.ds-timeline__meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- Banner ---------- */
.ds-banner { display: flex; gap: 12px; padding: 16px; border: 1px solid; border-radius: var(--radius-lg); }
.ds-banner--warning { border-color: var(--warning-border); background: var(--warning-bg); }
.ds-banner--error { border-color: var(--error-border); background: var(--error-bg); }
.ds-banner--neutral { border-color: var(--border-strong); background: var(--surface); }
.ds-banner__icon { flex-shrink: 0; margin-top: 2px; font-size: 18px; }
.ds-banner--warning .ds-banner__icon, .ds-banner--warning .ds-banner__title { color: var(--warning); }
.ds-banner--error .ds-banner__icon, .ds-banner--error .ds-banner__title { color: var(--error-strong); }
.ds-banner--neutral .ds-banner__icon { color: var(--muted); }
.ds-banner__body { flex: 1; min-width: 0; }
.ds-banner__title { margin: 0; font-size: 14px; font-weight: 500; }
.ds-banner__text { margin: 2px 0 0; color: rgb(44 44 44 / 0.8); font-size: 14px; text-wrap: pretty; }
.ds-banner__body ul { margin: 6px 0 0; padding-left: 18px; color: rgb(44 44 44 / 0.8); font-size: 14px; }
.ds-banner__action { display: flex; flex-shrink: 0; align-items: center; align-self: center; gap: 4px; }

/* ---------- Card chọn ---------- */
.ds-choice { min-width: 0; margin: 0; padding: 0; border: 0; }
.ds-choice__legend { margin-bottom: 12px; padding: 0; font-size: 14px; font-weight: 500; }
.ds-choice__grid { display: grid; grid-template-columns: repeat(var(--ds-choice-columns, 1), minmax(0, 1fr)); gap: 12px; }
@media (max-width: 639px) { .ds-choice__grid { grid-template-columns: minmax(0, 1fr); } }
.ds-choice__card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-choice__card:hover { background: var(--surface-hover); }
.ds-choice__card:has(:checked) { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-choice__card.is-disabled { cursor: not-allowed; opacity: 0.5; }
.ds-choice__radio {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin: 0;
  border: 1.5px solid var(--border-strong);
  border-radius: 9999px;
  background: var(--surface);
  appearance: none;
  outline: none;
  cursor: inherit;
}
.ds-choice__radio:checked { border: 6px solid var(--primary); }
.ds-choice__text { min-width: 0; }
.ds-choice__title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 500; }
.ds-choice__aside { color: var(--muted); font-size: 12px; font-weight: 400; }
.ds-choice__desc { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }

/* ---------- Danh sách mô tả ---------- */
.ds-dl { display: grid; gap: 12px; margin: 0; container-type: inline-size; font-size: 14px; }
.ds-dl__row { display: grid; gap: 4px; }
.ds-dl__label { color: var(--muted); }
.ds-dl__value { min-width: 0; margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-weight: 500; }
.ds-dl__value--empty { color: var(--muted); font-weight: 400; }
@container (min-width: 384px) { .ds-dl__row { grid-template-columns: 7rem minmax(0, 1fr); align-items: baseline; gap: 24px; } }
@container (min-width: 576px) { .ds-dl__row { grid-template-columns: 10rem minmax(0, 1fr); } }

/* ---------- Tab boxed, chip lọc ---------- */
.ds-tabs-boxed { display: flex; gap: 4px; }
.ds-tabs-select { display: none !important; width: max-content; min-width: 200px; }
.ds-tabs-select__prefix { color: var(--muted); }
@media (max-width: 639px) {
  .ds-tabs-boxed { display: none; }
  .ds-tabs-select { display: inline-flex !important; }
}
.ds-tabs-boxed__tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-tabs-boxed__tab:hover { background: rgb(44 44 44 / 0.05); color: var(--foreground); }
.ds-tabs-boxed__tab[aria-selected='true'] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
.ds-tabs-boxed__count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ds-tabs-boxed__tab[aria-selected='true'] .ds-tabs-boxed__count { color: var(--foreground); }

.ds-chips { overflow-x: auto; padding-block: 2px; }
.ds-chips__row { display: flex; gap: 8px; padding-inline: 4px; }
.ds-chip {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  max-width: 192px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-chip:hover { background: rgb(44 44 44 / 0.1); color: var(--foreground); }
.ds-chip[aria-pressed='true'] { background: var(--primary); color: var(--primary-foreground); }
.ds-chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Tự lưu, rỗng, dòng danh sách ---------- */
.ds-save { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.ds-save--failed { color: var(--error-text); }

.ds-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 40px 16px; text-align: center; }
.ds-empty__title { margin: 0; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-empty__title--error { color: var(--error-text); }
.ds-empty__text { max-width: 48ch; margin: 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-empty__action { margin-top: 12px; }

.ds-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md); }
.ds-row:hover { background: var(--item-hover); }
.ds-row__leading { flex-shrink: 0; }
.ds-row__body { flex: 1; min-width: 0; }
.ds-row__title { margin: 0; overflow: hidden; color: var(--foreground); font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-row__meta { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.ds-row__trailing { flex-shrink: 0; }

/* ---------- Panel trượt ---------- */
.ds-panel .ant-drawer-mask { background: rgb(0 0 0 / 0.15); }
.ds-panel .ant-drawer-content-wrapper { box-shadow: var(--elevation-modal); }
.ds-panel.ant-drawer-right .ant-drawer-content-wrapper { transition-duration: 0.5s; transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1); }
.ds-panel .ant-drawer-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.ds-panel .ant-drawer-body { padding: 24px; }
.ds-panel .ant-drawer-footer { padding: 16px 24px; border-top: 1px solid var(--border); }
.ds-panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ds-panel__heading { min-width: 0; }
.ds-panel__title { margin: 0; font-size: 18px; font-weight: 600; line-height: 28px; }
.ds-panel__desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; font-weight: 400; text-wrap: pretty; }
.ds-panel__foot { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- Toast ---------- */
.ds-toast.ant-notification-notice { width: auto; max-width: min(440px, calc(100vw - 32px)); padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elevation-popover); }
.ds-toast .ant-notification-notice-icon { top: 50%; translate: 0 -50%; font-size: 16px; line-height: 1; }
.ds-toast--success .ant-notification-notice-icon { color: var(--success); }
.ds-toast--error .ant-notification-notice-icon { color: var(--error-strong); }
.ds-toast .ant-notification-notice-title, .ds-toast .ant-notification-notice-message { margin: 0 0 0 28px !important; padding: 0 !important; font-size: 14px; }
.ds-toast .ant-notification-notice-description { display: none; }
.ds-toast__row { display: flex; align-items: center; gap: 16px; }
.ds-toast__text { flex: 1; min-width: 0; }
.ds-toast__action { flex-shrink: 0; }

/* ---------- Đầu trang và thanh công cụ danh sách ---------- */
.ds-page { display: grid; gap: 16px; }
.ds-page__head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
.ds-page__title { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; }
.ds-page__desc { margin: 4px 0 0; color: var(--muted); }
.ds-page__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.ds-toolbar__search { flex: 1 1 220px; max-width: 320px; }
.ds-toolbar__end { margin-left: auto; display: flex; gap: 8px; }
.ds-card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.ds-card .ant-table-wrapper .ant-table { background: transparent; }
.ds-table-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); }
.ds-cell2 { display: grid; min-width: 0; }
.ds-cell2__main { overflow: hidden; color: var(--foreground); font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-cell2__sub { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.ds-num { font-variant-numeric: tabular-nums; }
.ds-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.ds-role { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--neutral-bg); color: var(--neutral); font-size: 12px; font-weight: 500; white-space: nowrap; }
.ds-form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
@media (max-width: 639px) { .ds-form-row { grid-template-columns: minmax(0, 1fr); } }

.product-brand {
  display: inline-flex;
  min-width: 0;
  align-items: center;
  gap: 10px;
}

.product-brand__mark {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-foreground);
}

.product-brand__mark svg {
  width: 20px;
  height: 20px;
}

.product-brand__name {
  overflow: hidden;
  font-size: 14px;
  font-weight: 600;
  color: var(--foreground);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-brand--collapsed .product-brand__name {
  display: none;
}

.product-brand--inverted .product-brand__mark {
  background: #ffffff;
  color: #001529; /* nền sidebar tối hiện tại */
}

.product-brand--inverted .product-brand__name {
  color: var(--primary-foreground);
}


  /* ===== Thanh công cụ của wireframe (nằm ngoài bản thiết kế, design-process.md U3) ===== */
  .wf-bar { position: relative; z-index: 50; display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; overflow-x: auto; white-space: nowrap;
    background: #fff; border-bottom: 1px solid #e5e5e5; color: #737373; font: 14px/1 system-ui, -apple-system, sans-serif; }
  .wf-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wf-set { display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding: 3px; border-radius: 10px; background: #f4f4f5; }
  .wf-set button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 30px; padding: 0 10px;
    border: 0; border-radius: 7px; background: none; color: #737373; cursor: pointer; }
  .wf-set button:hover { color: #171717; }
  .wf-set button[aria-pressed="true"] { background: #fff; color: #171717; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px rgb(0 0 0 / .04); }
  .wf-set button[data-recommended]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #003366; }
  .wf-set svg { width: 16px; height: 16px; }
  .wf-switch { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 0; border: 0; background: none; color: #737373; cursor: pointer; }
  .wf-switch i { position: relative; width: 36px; height: 20px; border-radius: 10px; background: #e4e4e7; }
  .wf-switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: translate .15s; }
  .wf-switch[aria-checked="true"] i { background: #171717; }
  .wf-switch[aria-checked="true"] i::after { translate: 16px 0; }
  .wf-menu { position: relative; flex-shrink: 0; }
  .wf-menu > button { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: #737373; cursor: pointer; }
  .wf-menu > button:hover, .wf-menu[data-open] > button { background: #f4f4f5; }
  .wf-menu b { color: #171717; font-weight: 500; }
  .wf-popover { position: fixed; z-index: 60; display: grid; min-width: 168px; padding: 4px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
  .wf-popover button { display: flex; align-items: center; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: #404040; text-align: left; cursor: pointer; }
  .wf-popover button:hover, .wf-popover button[aria-pressed="true"] { background: #f4f4f5; color: #171717; }
  .wf-reason { border-bottom: 1px solid #e5e5e5; background: #fafafa; color: #404040; font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  .wf-reason summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 44px; padding: 8px 16px; cursor: pointer; list-style: none; }
  .wf-reason summary::-webkit-details-marker { display: none; }
  .wf-reason-name { color: #171717; font-weight: 600; white-space: nowrap; }
  .wf-reason-tag { flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 10px; background: #e6edf5; color: #003366; font-size: 12px; font-weight: 500; line-height: 20px; }
  .wf-reason-why { flex: 1; min-width: 0; overflow: hidden; color: #525252; text-overflow: ellipsis; white-space: nowrap; }
  .wf-reason[open] .wf-reason-why { white-space: normal; }
  .wf-reason-toggle { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 28px; margin-left: auto; padding: 0 8px; border-radius: 6px; color: #171717; font-weight: 500; }
  .wf-reason-toggle svg { width: 14px; height: 14px; transition: rotate .15s; }
  .wf-reason[open] .wf-reason-toggle svg { rotate: 180deg; }
  .wf-reason-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 4px 16px 16px; }
  .wf-reason-cols { display: grid; max-width: 1120px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px 32px; }
  .wf-reason h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; color: #171717; font-size: 12px; font-weight: 600; }
  .wf-reason h3 i { width: 6px; height: 6px; border-radius: 50%; background: #a3a3a3; }
  .wf-reason h3 i[data-tone="uu"] { background: #16a34a; }
  .wf-reason h3 i[data-tone="nhuoc"] { background: #d97706; }
  .wf-reason ul { display: grid; gap: 2px; margin: 0; padding-left: 16px; }
  .wf-reason p { margin: 0; }
  .wf-reason-tips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #ebebeb; }
  .wf-reason-tips h3 { margin: 0 4px 0 0; }
  .wf-reason-tips button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; color: #262626; white-space: nowrap; cursor: pointer; }
  .wf-reason-tips button:hover { background: #f5f5f5; }
  .wf-reason-tips button[data-copied] { color: #16a34a; }
  @media (max-width: 767px) {
    .wf-reason-why { order: 1; flex-basis: 100%; }
    .wf-reason-toggle span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .wf-reason-tips h3 { flex-basis: 100%; }
  }
  [data-wf-block] { position: relative; }
  [data-wf-block]::before { content: attr(data-wf-block); position: absolute; top: 4px; left: 4px; z-index: 5; display: grid; place-items: center;
    width: 18px; height: 18px; border-radius: 9px; background: #1f1f1f; color: #fff; font: 500 11px/1 system-ui, sans-serif; pointer-events: none; }
  [data-wf-block][data-wf-block-out]::before { top: auto; bottom: 100%; }
  .wf-stage { padding: 0; }
  .wf-phone-wrap { display: grid; place-items: center; padding: 24px 16px; }
  .wf-phone { position: relative; width: 375px; max-width: 100%; height: 812px; overflow: auto; border: 1px solid #ddd; border-radius: 24px; background: var(--background); }

  /* ===== Bản thiết kế: khung app ===== */
  .app { container: app / inline-size; position: relative; display: flex; min-height: calc(100vh - 100px); background: var(--background); }
  .wf-phone .app { min-height: 100%; }
  @media (max-width: 439px) { .wf-phone-wrap { padding: 0; } .wf-phone { width: 100%; height: auto; min-height: 812px; border: 0; border-radius: 0; } }
  .sider { position: sticky; top: 0; display: flex; flex-direction: column; flex-shrink: 0; width: 240px; height: 100vh; max-height: 100%; overflow: hidden; background: var(--surface); transition: width .2s; }
  .sider--collapsed { width: 64px; }
  .sider__head { display: flex; align-items: center; height: 64px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .sider__nav { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
  .nav-item { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; color: rgb(44 44 44 / .7); text-decoration: none; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .nav-item svg { flex-shrink: 0; font-size: 16px; }
  .nav-item:hover { background: var(--item-hover); color: var(--foreground); }
  .nav-item[aria-current="page"] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
  .sider--collapsed .nav-item span, .sider--collapsed .product-brand__name { display: none; }
  .main { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .topbar__title { min-width: 0; margin: 0; overflow: hidden; font-size: 16px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .topbar__crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 14px; }
  .topbar__crumb a { display: inline-flex; align-items: center; min-height: 32px; color: var(--muted); text-decoration: none; }
  .topbar__crumb a:hover { color: var(--foreground); }
  .topbar__right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .user-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 4px; border: 0; border-radius: 12px; background: none; cursor: pointer; }
  .user-btn:hover, .user-btn[aria-expanded="true"] { background: rgb(44 44 44 / .05); }
  .avatar { display: grid; flex-shrink: 0; place-items: center; width: 32px; height: 32px; border-radius: 9999px; background: #e6edf5; color: #1a4775; font-size: 12px; font-weight: 600; }
  .user-btn__name { font-size: 14px; font-weight: 500; }
  .user-btn svg { color: var(--muted); font-size: 12px; }
  .menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; display: grid; min-width: 220px; max-width: calc(100cqw - 24px); padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--elevation-popover); }
  .menu__meta { padding: 8px 12px; color: var(--muted); font-size: 12px; }
  .menu__item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--foreground); text-align: left; cursor: pointer; }
  .menu__item:hover { background: var(--item-hover); }
  .menu__item--danger { color: var(--danger); }
  .menu__sep { height: 1px; margin: 4px 0; background: var(--border); }
  .btn.burger { display: none; }
  .content { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px; padding: 16px; }
  @container app (min-width: 640px) { .content { padding: 24px; } }
  @container app (max-width: 639px) {
    .sider { display: none; }
    .btn.burger { display: inline-flex; }
    .topbar { padding-left: 8px; }
    .user-btn__name { display: none; }
  }
  /* Tab trạng thái thành nút "Trạng thái:" dưới 640 (luật chốt #7), đo theo khung app thay vì viewport. */
  .btn.ds-tabs-mobile { display: none; gap: 6px; }
  @container app (max-width: 639px) { .ds-tabs-boxed { display: none; } .btn.ds-tabs-mobile { display: inline-flex; } .btn.sider-toggle { display: none; } }
  @container app (min-width: 640px) { .ds-tabs-boxed { display: flex; } }
  .drawer-scrim { position: absolute; inset: 0; z-index: 40; background: rgb(0 0 0 / .3); }
  .drawer { position: absolute; inset: 0 auto 0 0; z-index: 41; width: 280px; max-width: 85%; background: var(--surface); box-shadow: var(--elevation-modal); }
  .bottombar { position: sticky; bottom: 0; z-index: 20; display: none; grid-template-columns: repeat(4, 1fr); height: 64px; border-top: 1px solid var(--border); background: var(--surface); }
  .bottombar a { display: grid; place-content: center; justify-items: center; gap: 2px; color: rgb(44 44 44 / .7); font-size: 11px; text-decoration: none; }
  .bottombar a svg { font-size: 18px; }
  .bottombar a[aria-current="page"] { color: var(--foreground); font-weight: 600; }
  @container app (max-width: 639px) { .app[data-nav="duoi"] .bottombar { display: grid; } .app[data-nav="duoi"] .btn.burger { display: none; } }

  /* ===== Control theo theme Ant Design của dự án ===== */
  .btn { white-space: nowrap; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--border-strong);
    border-radius: 12px; background: var(--surface); color: var(--foreground); font-weight: 500; line-height: 1.2; text-align: center; cursor: pointer; transition: background-color .15s; }
  .btn:hover { background: var(--button-hover); }
  /* Nút viền đặt trên nền trang hay nền banner: nền rê lấy secondary, #f1f1f3 tan vào #f4f4f6. */
  .err-block .btn:not(.btn--primary):hover, .ds-banner .btn:hover, .toolbar > .btn:not(.btn--primary):hover, .ds-empty .btn:not(.btn--primary):hover { background: var(--secondary); }
  .btn svg { font-size: 16px; }
  .btn--primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
  .btn--primary:hover { background: var(--primary-hover); }
  .btn--secondary { border-color: transparent; background: var(--secondary); }
  .btn--secondary:hover { background: var(--secondary-hover); }
  .btn--ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn--ghost:hover { background: rgb(44 44 44 / .05); color: var(--foreground); }
  .btn--sm { min-height: 32px; padding: 0 12px; border-radius: 8px; }
  .btn--icon { width: 40px; padding: 0; }
  .btn--icon.btn--sm { width: 32px; }
  .btn[aria-disabled="true"] { cursor: not-allowed; opacity: .5; }
  .btn--lg { min-height: 48px; }
  .btn--block { width: 100%; }
  .search { position: relative; display: flex; align-items: center; min-width: 0; }
  .search svg { position: absolute; left: 14px; color: var(--muted); font-size: 16px; pointer-events: none; }
  .input { width: 100%; height: 40px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
  .input::placeholder { color: var(--muted); }
  .input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
  .search .input { padding-left: 40px; }
  .input--lg { height: 48px; }
  .input--error { border-color: var(--error); }
  .field-label { display: block; width: fit-content; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
  .field-hint { min-height: 16px; margin: 6px 0 0; color: var(--error-text); font-size: 12px; }

  .panel { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  .panel__title { margin: 0; font-size: 16px; font-weight: 600; }
  .panel__body { padding: 16px 20px 20px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .warn-text { color: var(--warning); }
  .sk { display: block; height: 12px; border-radius: 6px; background: rgb(44 44 44 / .07); }

  /* ===== Bảng tài liệu ===== */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .toolbar__search { flex: 1 1 220px; max-width: 320px; margin-left: auto; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { height: 44px; padding: 0 16px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; white-space: nowrap; }
  .tbl td { height: 64px; padding: 8px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  .tbl tbody tr:hover { background: var(--surface-hover); }
  .tbl .right { text-align: right; }
  .cell2 { display: grid; min-width: 0; }
  .cell2__main { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
  .cell2__sub { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .tbl-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); }
  .doc-list { display: none; margin: 0; padding: 4px 8px; list-style: none; }
  .doc-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 8px; border-top: 1px solid var(--border); }
  .doc-list li:first-child { border-top: 0; }
  @container app (max-width: 639px) { .tbl-wrap { display: none; } .doc-list { display: block; } .toolbar__search { max-width: none; margin-left: 0; } }
  @container app (max-width: 1023px) { .col-lg { display: none; } }

  /* ===== Màn duyệt ===== */
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
  .page-head__text { flex: 1 1 280px; min-width: 0; }
  .page-head__title { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
  .page-head__desc { max-width: 55ch; margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .page-head__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .publish-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; text-align: right; }
  .review { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @container app (min-width: 1024px) { .review { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .review .ds-viewer { position: sticky; top: 88px; } }
  .review .ds-viewer__stage { min-height: 520px; }
  .switch-view { display: none; }
  @container app (max-width: 1023px) { .switch-view { display: flex; } .review[data-view="fields"] .ds-viewer { display: none; } .review[data-view="doc"] .fields-col { display: none; } }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgb(44 44 44 / .05); }
  .seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: rgb(44 44 44 / .7); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--foreground); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px rgb(0 0 0 / .04); }
  .fields-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .group { display: grid; gap: 12px; }
  .group__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0; }
  .group__title { margin: 0; font-size: 16px; font-weight: 600; }
  .group__count { color: var(--muted); font-size: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .contract { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .contract__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .contract__title { margin: 0; font-size: 14px; font-weight: 600; }
  /* Bảng thuyền viên: dòng mở ra (B), danh sách trái + chi tiết phải (C) */
  .tbl-sub > td { padding: 0 16px 12px 56px !important; background: var(--surface-hover); }
  .subdocs { margin: 0; }
  .subdocs .ds-files__row { gap: 12px; }
  .subdocs__foot { padding-top: 4px; }
  .md { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @container app (min-width: 1024px) { .md { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); } }
  .md-list ul { margin: 0; padding: 4px; list-style: none; }
  .md-list button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; }
  .md-list button:hover { background: var(--item-hover); }

  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .tpl-card { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: inherit; text-decoration: none; cursor: pointer; }
  .tpl-card:hover { border-color: var(--border-strong); }
  .tpl-card__thumb { display: block; height: 160px; overflow: hidden; border-radius: 8px; background: var(--background); }
  .tpl-card__thumb .a4 { transform: scale(.8); transform-origin: top center; }
  .tpl-edit { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @container app (min-width: 1024px) { .tpl-edit { grid-template-columns: minmax(0, 1fr) 340px; } }
  .xgrid { display: grid; min-width: 640px; border-left: 1px solid #d4d4d8; border-top: 1px solid #d4d4d8; font-size: 12px; }
  .xgrid__row { display: grid; grid-template-columns: 36px repeat(8, minmax(0, 1fr)); }
  .xgrid__row > * { min-height: 36px; padding: 4px 6px; border-right: 1px solid #d4d4d8; border-bottom: 1px solid #d4d4d8; }
  .xgrid__row--head > *, .xgrid__rh { display: grid; place-items: center; background: #f4f4f5; color: #52525c; }
  .xgrid__cell { border-top: 0; border-left: 0; background: #fff; color: #52525c; font: inherit; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default; }
  .xgrid__cell[data-cell] { cursor: pointer; font-weight: 500; }
  .xgrid__cell--profile { background: var(--success-bg); color: var(--success); }
  .xgrid__cell--export, .xgrid__cell--hand { background: var(--neutral-bg); color: var(--neutral); }
  .xgrid__cell--none { background: var(--error-bg); color: var(--error-strong); }
  .xgrid__cell--on { box-shadow: inset 0 0 0 2px var(--primary); }
  .select-like { justify-content: space-between; width: 100%; }
  .map-row { display: inline-flex; gap: 10px; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
  .rs { min-height: 100%; background: var(--background); }
  .rs-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); font-size: 12px; }
  .rs-main { display: grid; gap: 16px; max-width: 440px; margin: 0 auto; padding: 20px 16px 32px; }
  .rs-step { margin: 0; color: var(--muted); font-size: 12px; }
  .rs-title { margin: -8px 0 0; font-size: 20px; font-weight: 600; }
  .rs-doc { max-height: 320px; overflow: auto; border-radius: 12px; }
  .rs-pad { position: relative; display: grid; place-items: center; height: 160px; border: 1px dashed var(--border-strong); border-radius: 16px; background: var(--surface); }
  .rs-pad__hint { color: var(--muted); }
  .rs-pad__line { position: absolute; left: 24px; right: 24px; bottom: 40px; border-bottom: 1px solid var(--border-strong); }
  .rs-pad .btn { position: absolute; top: 8px; right: 8px; }
  .a4__signs { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
  .map-row { min-height: 32px; align-items: center; }
  .thumb { display: grid; align-content: start; gap: 8px; height: 100%; margin: 0 auto; max-width: 140px; padding: 14px 16px; background: #fff; box-shadow: inset 0 0 0 1px var(--border-strong); }
  .thumb__title { justify-self: center; width: 60%; height: 8px; border-radius: 2px; background: #a1a1aa; }
  .thumb__line { height: 4px; border-radius: 2px; background: #e4e4e7; }
  .thumb__signs { display: flex; justify-content: space-around; gap: 6px; margin-top: 6px; }
  .thumb__signs span { width: 28px; height: 12px; border-radius: 2px; background: #f4f4f5; }
  .quick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .doc-picks-wrap { display: grid; gap: 8px; }
  .doc-picks__count { margin: 0; color: var(--muted); }
  .doc-picks__count b { color: var(--foreground); }
  .doc-picks__group { margin: 8px 0 0; color: var(--muted); font-size: 12px; font-weight: 500; }
  .quick .btn:not(.btn--primary):hover { background: var(--secondary); }
  .stack { display: grid; gap: 12px; }
  .focus-card > .ds-badge { justify-self: start; }
  .okrow { display: grid; grid-template-columns: 8rem minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; border-top: 1px solid var(--border); font-size: 14px; }
  .okrow:first-child { border-top: 0; }
  .okrow__label { color: var(--muted); font-size: 12px; }
  .okrow__value { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
  @container app (max-width: 639px) {
    .okrow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 2px; }
    .okrow__label { grid-column: 1; grid-row: 1; }
    .okrow__value { grid-column: 1; grid-row: 2; white-space: normal; }
    .okrow > .ds-field__extra { grid-column: 2; grid-row: 1 / 3; }
    .okrow > .ds-field__extra:has(.ds-badge) { grid-column: 1 / -1; grid-row: 3; }
  }
  .collapse { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .collapse > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 20px; cursor: pointer; list-style: none; }
  .collapse > summary::-webkit-details-marker { display: none; }
  .collapse > summary svg { color: var(--muted); transition: rotate .2s; }
  .collapse[open] > summary svg { rotate: 180deg; }
  .collapse__body { padding: 0 8px 8px; }
  .problem { display: grid; gap: 8px; }
  .ds-field__extra { display: flex; flex-wrap: wrap; gap: 4px; }
  .focus-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .focus-card { display: grid; gap: 16px; padding: 24px; border: 1px solid var(--border-focus); border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 2px var(--ring-focus); }
  .focus-card__value { margin: 0; font-size: 20px; font-weight: 600; }
  .kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--background); color: var(--muted); font: 500 11px/1 ui-monospace, monospace; }
  .focus-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field-dots { display: flex; flex-wrap: wrap; gap: 6px; }
  .field-dots span { width: 10px; height: 10px; border-radius: 9999px; background: var(--secondary); }
  .field-dots span[data-tone="success"] { background: var(--success); }
  .field-dots span[data-tone="warning"] { background: var(--warning); }
  .field-dots span[data-tone="error"] { background: var(--error-strong); }
  .field-dots span[aria-current="true"] { outline: 2px solid var(--border-focus); outline-offset: 2px; }

  /* ===== Đăng nhập, trang lỗi ===== */
  .auth { display: grid; place-items: start center; min-height: 100%; padding: 64px 16px; background: var(--background); }
  @container auth (min-width: 640px) { .auth { padding-top: 120px; } }
  .auth-wrap { container: auth / inline-size; min-height: calc(100vh - 100px); }
  .wf-phone .auth-wrap { min-height: 100%; }
  .auth-card { display: grid; gap: 20px; width: 100%; max-width: 448px; padding: 32px; border-radius: 16px; background: var(--surface); }
  @container auth (max-width: 639px) { .auth-card { padding: 24px; } }
  .auth-card h1 { margin: 12px 0 0; font-size: 20px; font-weight: 600; }
  .pw { position: relative; }
  .pw .input { padding-right: 48px; }
  .pw button { position: absolute; inset: 0 4px 0 auto; display: grid; place-items: center; width: 40px; margin: auto 0; height: 40px; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
  .err-block { max-width: 448px; margin: 0 auto; padding: 64px 0; text-align: center; }
  @container app (min-width: 640px) { .err-block { padding-top: 96px; } }
  .err-block__code { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  .err-block__title { margin: 4px 0 0; font-size: 20px; font-weight: 600; text-wrap: balance; }
  .err-block__desc { margin: 8px 0 0; color: var(--muted); text-wrap: pretty; }
  .err-block__desc b { color: var(--foreground); font-weight: 500; }
  .err-block__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 24px; }
  @container app (max-width: 639px) { .err-block__actions { flex-direction: column; } }
  .err-block__foot { margin: 24px 0 0; color: var(--muted); font-size: 12px; }
  .err-block__code-line { display: inline-flex; align-items: center; gap: 6px; font-family: ui-monospace, monospace; }
  /* ===== Vỏ UI Kit: 3 tab (Màn hình · Luồng màn · Design system). Màu lấy token của dự án, chỉ giao diện sáng ===== */
  :root { color-scheme: light; --sc-head: 56px; --sc-rail: 232px; }
  html, body { background: var(--background); }
  [data-wf-block]::before { display: none !important; }
  [hidden] { display: none !important; }
  .sc-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 70; display: flex; align-items: center; gap: 24px; height: var(--sc-head); padding: 0 16px;
    background: var(--primary); color: #fff; }
  .sc-brand { display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .01em; }
  .sc-brand small { color: rgb(255 255 255 / .65); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  .sc-tabs { display: flex; align-self: stretch; gap: 4px; overflow-x: auto; }
  .sc-tabs button { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: none; color: rgb(255 255 255 / .7); font: 500 14px/1 var(--app-font); white-space: nowrap; cursor: pointer; }
  .sc-tabs button:hover { color: #fff; }
  .sc-tabs button[aria-selected="true"] { color: #fff; }
  .sc-tabs button[aria-selected="true"]::after { content: ""; position: absolute; right: 12px; bottom: 0; left: 12px; height: 3px; border-radius: 3px 3px 0 0; background: #fff; }
  .sc-tabs button:focus-visible, .sc-rail button:focus-visible, .fl-node:focus-visible { outline: 2px solid var(--primary-light, #9db4cc); outline-offset: 2px; }
  .sc-tabs svg { width: 16px; height: 16px; }

  .sc-layout { display: grid; grid-template-columns: var(--sc-rail) minmax(0, 1fr); min-height: calc(100vh - var(--sc-head)); }
  .sc-rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--sc-head)); align-self: start; height: calc(100vh - var(--sc-head)); overflow-y: auto; padding: 16px 12px 24px; border-right: 1px solid var(--border); background: var(--surface); }
  .sc-rail h3 { margin: 16px 8px 6px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .sc-rail h3:first-child { margin-top: 0; }
  .sc-rail button { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 6px; width: 100%; min-height: 36px; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--foreground); font: 14px/1.3 var(--app-font); text-align: left; cursor: pointer; }
  .sc-rail button:hover { background: var(--item-hover, #f4f4f5); }
  .sc-rail button[aria-current="true"] { background: var(--primary-light, #e6edf5); color: var(--primary); font-weight: 600; }
  .sc-rail b { color: var(--muted); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sc-rail button[aria-current="true"] b { color: var(--primary); }
  .sc-main { min-width: 0; }
  .sc-main .wf-stage { overflow-x: auto; }
  .sc-main .wf-stage > .app { min-width: 1280px; }
  .fl-thumb { contain: paint; }
  .sc-main .wf-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--sc-head)); gap: 16px; }
  .sc-title { margin: 0 8px 0 0; color: var(--foreground); font: 600 15px/1 var(--app-font); white-space: nowrap; }
  .sc-title b { margin-right: 6px; color: var(--primary); }
  .sc-var:has(button:only-child) { display: none; }
  .app { min-height: calc(100vh - var(--sc-head) - 56px); }
  @media (max-width: 900px) {
    .sc-layout { grid-template-columns: minmax(0, 1fr); }
    .sc-rail { position: static; display: flex; gap: 4px; height: auto; overflow-x: auto; padding: 8px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
    .sc-rail h3 { display: none; }
    .sc-rail button { grid-template-columns: auto auto; width: auto; white-space: nowrap; }
    .sc-head { gap: 12px; }
    .sc-brand small { display: none; }
  }

  /* ----- Luồng màn ----- */
  .fl { padding-block: 24px 48px; padding-inline: 24px; }
  .fl-intro { max-width: 760px; margin: 0 0 24px; }
  .fl-intro h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; text-wrap: balance; }
  .fl-intro p { margin: 0; color: var(--muted); }
  .fl-scroll { overflow-x: auto; padding-bottom: 8px; }
  .fl-canvas { position: relative; display: grid; gap: 72px; width: max-content; padding: 8px; }
  .fl-lane { display: grid; grid-template-columns: 112px repeat(4, 240px); align-items: start; gap: 0 76px; }
  .fl-lane-label { padding-top: 52px; }
  .fl-lane-label b { display: block; color: var(--foreground); font-size: 13px; font-weight: 600; }
  .fl-lane-label span { color: var(--muted); font-size: 12px; }
  .fl-node { position: relative; z-index: 1; display: grid; gap: 8px; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .fl-thumb { position: relative; width: 240px; height: 150px; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--background); transition: border-color .15s, box-shadow .15s; }
  .fl-node:hover .fl-thumb { border-color: var(--primary); box-shadow: 0 6px 20px rgb(0 51 102 / .12); }
  .fl-thumb-inner { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; overflow: hidden; transform: scale(.16667); transform-origin: 0 0; pointer-events: none; }
  .fl-thumb-inner .app { min-height: 900px; }
  .fl-thumb--phone { width: 240px; background: var(--item-hover, #f4f4f5); }
  .fl-thumb--phone .fl-thumb-inner { left: 85px; width: 375px; height: 812px; transform: scale(.1847); border-radius: 0; }
  .fl-cap { display: flex; align-items: baseline; gap: 8px; }
  .fl-cap b { color: var(--primary); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fl-cap span { font-size: 14px; font-weight: 600; }
  .fl-cap em { margin-left: auto; color: var(--muted); font-size: 12px; font-style: normal; }
  .fl-svg { position: absolute; inset: 0; z-index: 0; overflow: visible; pointer-events: none; }
  .fl-svg path { fill: none; stroke: var(--primary); stroke-width: 1.5; }
  .fl-svg path.back { stroke-dasharray: 5 4; stroke: var(--muted); }
  .fl-svg text { fill: var(--foreground); font: 500 11px var(--app-font); paint-order: stroke; stroke: var(--background); stroke-width: 4px; stroke-linejoin: round; }
  .fl-legend { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 24px; color: var(--muted); font-size: 12px; }
  .fl-legend i { display: inline-block; width: 28px; margin-right: 8px; border-top: 1.5px solid var(--primary); vertical-align: middle; }
  .fl-legend i.back { border-top-style: dashed; border-color: var(--muted); }

  /* ----- Design system ----- */
  .ds-frame { display: block; width: 100%; height: calc(100vh - var(--sc-head)); border: 0; background: #fff; }
  .ds-wait { padding: 48px 24px; color: var(--muted); }

/* ===== Nhóm D: AI tách và đọc giấy tờ (T1–T5). Chỉ token và class ds-* có sẵn, phần riêng dưới tiền tố d-. ===== */
.wf-set a { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 30px; padding: 0 10px; border-radius: 7px; color: #737373; text-decoration: none; }
.wf-set a:hover { color: #171717; }
.wf-set a[aria-current="page"] { background: #fff; color: #171717; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px rgb(0 0 0 / .04); }
.wf-set a[data-recommended]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #003366; }
.wf-set svg { width: 16px; height: 16px; }
a.wf-switch { text-decoration: none; }
.wf-label { color: #737373; }
.wf-popover a { display: flex; align-items: center; min-height: 34px; padding: 0 10px; border-radius: 6px; color: #404040; text-decoration: none; white-space: nowrap; }
.wf-popover a:hover, .wf-popover a[aria-current="page"] { background: #f4f4f5; color: #171717; }
.wf-popover a[aria-current="page"] { font-weight: 500; }
.wf-popover { max-height: 70vh; overflow: auto; }
.wf-reason h3 i { flex-shrink: 0; }
.wf-reason-name { white-space: normal; }
.wf-reason p { max-width: 62ch; }
.wf-bar .wf-menu > button { height: 36px; }

/* ----- chung ----- */
.d-only-narrow { display: none !important; }
@container app (max-width: 639px) { .d-only-wide { display: none !important; } .d-only-narrow { display: block !important; } }
.d-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.d-grow { flex: 1 1 120px; min-width: 0; }
.d-stack { display: grid; gap: 12px; min-width: 0; }
.d-small { font-size: 12px; }
.d-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; font-weight: 500; letter-spacing: .06em; font-variant-numeric: slashed-zero tabular-nums; overflow-wrap: anywhere; }
.d-ctx { pointer-events: none; }
.d-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-h { margin: 0; font-size: 14px; font-weight: 600; }
.d-note { margin: 0; color: var(--muted); font-size: 12px; text-wrap: pretty; }
.d-link { color: var(--foreground); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.d-pf { color: var(--primary); }
.btn--warn-ghost { border-color: transparent; background: transparent; color: var(--warning); }
.d-sep { height: 1px; margin: 0; border: 0; background: var(--border); }
.d-count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.d-check { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; cursor: pointer; }
.d-check i { display: grid; flex-shrink: 0; place-items: center; width: 18px; height: 18px; border: 1.5px solid var(--border-strong); border-radius: 5px; background: var(--surface); color: var(--primary-foreground); font-size: 12px; }
.d-check[aria-checked="true"] i { border-color: var(--primary); background: var(--primary); }
.d-check[aria-disabled="true"] { cursor: not-allowed; opacity: .5; }
.d-select { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; max-width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font-weight: 500; }
.d-select span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-select svg { flex-shrink: 0; color: var(--muted); font-size: 12px; }
.d-select--warn { border-color: var(--warning-border); background: var(--warning-bg); }
.d-spin svg { animation: d-spin 1s linear infinite; }
@keyframes d-spin { to { rotate: 360deg; } }
@media (prefers-reduced-motion: reduce) { .d-spin svg { animation: none; } }

/* ----- ảnh giấy tờ: khối xám đúng tỉ lệ ----- */
.d-img { position: relative; display: block; width: 100%; aspect-ratio: var(--r, .707); overflow: hidden; border-radius: 6px; background: var(--secondary); box-shadow: inset 0 0 0 1px var(--border-strong); }
.d-img--land { --r: 1.42; }
.d-img--port { --r: .707; }
.d-img--photo { --r: .75; }
.d-img--spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: rgb(44 44 44 / .15); }
.d-img__bars { position: absolute; inset: 14% 8% auto; display: grid; gap: 9px; }
.d-img__bars i { display: block; height: 5px; border-radius: 3px; background: rgb(44 44 44 / .1); }
.d-img__tag { position: absolute; left: 8px; bottom: 6px; z-index: 1; padding: 1px 6px; border-radius: 4px; background: rgb(255 255 255 / .8); color: var(--muted); font-size: 12px; }
.d-img--sm .d-img__bars, .d-img--sm .d-img__tag { display: none; }
.d-img--err { background: var(--error-bg); box-shadow: inset 0 0 0 1px var(--error-border); }
.d-img--err .d-img__tag { color: var(--error-text); }
.d-thumb { flex-shrink: 0; width: 44px; }
.d-thumb--md { width: 64px; }

/* ----- khung trang duyệt ----- */
.d-pub { position: sticky; top: 64px; z-index: 9; display: grid; gap: 8px; padding: 12px 16px; border: 1px solid var(--border-strong); border-radius: 16px; background: var(--surface); }
.d-pub__row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.d-pub__meters { display: flex; flex: 1 1 320px; flex-wrap: wrap; gap: 8px 24px; min-width: 0; }
.d-meter { display: grid; gap: 4px; min-width: 108px; flex: 1 1 108px; max-width: 200px; font-size: 12px; }
.d-meter b { color: var(--foreground); font-weight: 500; font-variant-numeric: tabular-nums; }
.d-meter span { color: var(--muted); }
.d-pub__why { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; color: var(--warning); font-size: 12px; }
.d-pub__why li { display: inline-flex; align-items: center; gap: 6px; }
.d-pub__why--ok { color: var(--muted); }
.d-pub__act { display: grid; justify-items: end; gap: 4px; margin-left: auto; }
.d-sec { min-width: 0; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }

.d-files { margin: 0; padding: 4px 16px; list-style: none; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }

.d-file__meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

.d-ctbl { width: 100%; border-collapse: collapse; }

/* ----- T5: hồ sơ ----- */
.d-sv-tbl { width: 100%; border-collapse: collapse; }
.d-sv-tbl th { height: 44px; padding: 0 12px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; white-space: nowrap; }
.d-sv-tbl td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.d-sv-tbl tbody tr:hover { background: var(--surface-hover); }

.d-sv-tbl td.r, .d-sv-tbl th.r { text-align: right; }
.d-cell { display: grid; min-width: 0; gap: 2px; }
.d-cell__main { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }

.d-src { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.d-card-list { display: grid; margin: 0; padding: 0; list-style: none; }

.d-bar { display: flex; height: 6px; overflow: hidden; border-radius: 9999px; background: rgb(44 44 44 / .05); }

const matchMark = (value) => (value === true ? `<span class="m m--ok">${icon('check')}Khớp</span>` : value === 'gan' ? `<span class="m m--near">${icon('question-circle')}Gần giống</span>` : `<span class="m m--no">${icon('close')}Khác</span>`);

function manualEvidence(open) {
  return `<details class="collapse" ${open ? 'open' : ''} data-wf-block="6"><summary><span><b>Không thấy tàu đúng?</b> <span class="muted">Đính bằng chứng thủ công</span></span>${icon('down')}</summary>
    <div class="collapse__body" style="display:grid;gap:12px;padding:12px 16px 16px">
      <div class="grid-2"><div><label class="field-label">Tên tàu <span class="ds-field__required">*</span></label><input class="input" value="MV Halong Spirit" /></div><div><label class="field-label">IMO</label><input class="input" placeholder="7 chữ số, để trống nếu không có" /></div></div>
      <label class="ds-drop"><span class="ds-drop__title">Thả ảnh giấy chứng nhận đăng ký tàu hoặc trang tra cứu</span><span class="ds-drop__hint">PDF, JPG hoặc PNG. Tối đa 25 MB</span><span class="ds-drop__button">${icon('upload')}Chọn tệp</span></label>
      <div><label class="field-label">Ghi chú <span class="ds-field__required">*</span></label><input class="input" placeholder="Ví dụ: tra trên trang đăng kiểm ngày 06/10/2026" /></div>
    </div></details>`;
}

function vesselPanel() {
  const v = state.v;
  const loading = state.tt === 'dang-tai';
  const empty = state.tt === 'rong';
  const badImo = state.tt === 'imo-sai';
  const source = `<div class="vp-source" data-wf-block="4"><p class="vp-source__label">Trên giấy · Sổ thuyền viên trang 4</p><p class="vp-source__value">${PAPER.name} · ${PAPER.gt} GT · cờ ${PAPER.flag}</p><p class="muted" style="margin:2px 0 0">IMO ${badImo ? '<b class="err-text">9194946</b> sai số kiểm tra: chữ số cuối phải là 5' : 'không có trên sổ'}</p></div>`;
  const search = `<label class="search">${icon('search')}<input class="input" value="${badImo ? '9194946' : 'Halong Spirit'}" aria-label="Tìm theo IMO hoặc tên tàu" /></label><p class="muted" style="margin:-4px 0 0;font-size:12px">Tìm theo IMO trước; tên chỉ để gợi ý.</p>`;
  let body;
  if (loading) body = Array.from({ length: 2 }, () => '<div class="vp-card"><span class="sk" style="width:50%"></span><span class="sk" style="width:80%;margin-top:10px"></span><span class="sk" style="width:60%;margin-top:10px"></span></div>').join('');
  else if (empty) body = `<div class="ds-empty" style="padding:24px 8px"><p class="ds-empty__title">Không tìm thấy tàu nào</p><p class="ds-empty__text">Danh mục và nguồn tra cứu chưa có tàu tên "Halong Spirit". Đính bằng chứng thủ công bên dưới.</p></div>${manualEvidence(true)}`;
  else if (badImo) body = `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">IMO trên giấy sai số kiểm tra</p><p class="ds-banner__text">Có thể AI đọc nhầm một chữ số. Sửa IMO ở bản số hoá, hoặc tìm theo tên tàu.</p></div><div class="ds-banner__action">${btn('Tìm theo tên')}</div></div>${manualEvidence(false)}`;
  else if (v === 'b') {
    const rows = [['Tên tàu', 'name'], ['IMO', 'imo'], ['Loại tàu', 'type'], ['Tổng dung tích (GT)', 'gt'], ['Cờ', 'flag'], ['Chủ tàu', 'owner']];
    body = `<div class="tbl-wrap tbl-wrap--always" data-wf-block="5"><table class="tbl vp-cmp"><thead><tr><th>Trường</th><th>Trên giấy</th>${CANDIDATES.map((c, i) => `<th><label class="vp-pick"><input type="radio" name="vp" ${i === 0 ? 'checked' : ''} />Ứng viên ${i + 1}</label></th>`).join('')}</tr></thead><tbody>
      ${rows.map(([label, key]) => `<tr><td class="muted">${label}</td><td>${PAPER[key]}</td>${CANDIDATES.map((c) => `<td><span class="cell2"><span>${c[key]}</span>${c.match[key] !== undefined ? matchMark(c.match[key]) : ''}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>${manualEvidence(false)}`;
  } else if (v === 'c') {
    const tab = state.vtab || 'tim';
    body = `<div class="seg" role="tablist" data-wf-block="5"><button type="button" data-vtab="tim" aria-pressed="${tab === 'tim'}">Tìm trong danh mục</button><button type="button" data-vtab="tay" aria-pressed="${tab === 'tay'}">Bằng chứng thủ công</button></div>
      ${tab === 'tim' ? CANDIDATES.map((c, i) => candidateCard(c, i, true)).join('') : manualEvidence(true).replace('<details class="collapse"', '<details class="collapse collapse--flat"')}`;
  } else body = `<div style="display:grid;gap:12px" data-wf-block="5"><p class="vp-count">2 ứng viên</p>${CANDIDATES.map((c, i) => candidateCard(c, i)).join('')}</div>${manualEvidence(false)}`;
  const confirm = empty ? btn('Lưu bằng chứng', { variant: 'primary' }) : btn('Chọn tàu này', { variant: 'primary', attrs: loading || badImo ? 'aria-disabled="true"' : '' });
  return `<div class="sheet-scrim"></div><aside class="sheet" role="dialog" aria-label="Đối chiếu tàu"><header class="sheet__head"><div><h2 class="sheet__title">Đối chiếu tàu</h2><p class="muted" style="margin:2px 0 0">Dòng đi tàu 2 · Trần Minh Khôi</p></div>${btn('', { variant: 'ghost', iconName: 'close', attrs: 'aria-label="Đóng"' }).replace('btn--ghost', 'btn--ghost btn--icon')}</header>
    <div class="sheet__body">${source}${search}${body}</div>
    <footer class="sheet__foot">${btn('Huỷ')}${confirm}</footer></aside>`;
}

  const list = `<ul class="pack-docs" data-wf-block="4">${docs.map((d) => { const signs = signsFor(d); const done = Object.values(signs).filter((s) => s === 'done').length; return `<li><button type="button" data-pickdoc="${d[0]}" aria-current="${d[0] === picked}"><span class="cell2"><span class="cell2__main" style="font-weight:400">${d[1]}</span><span class="cell2__sub">${d[3].length ? `Đã ký ${done}/${d[3].length}` : 'Không cần ký'}</span></span></button></li>`; }).join('')}</ul>`;
  const d = doc12(picked);
  const signers = section('Chữ ký', `<ul class="signers">${d[3].map((who) => { const st = signsFor(d)[who]; return `<li><span class="cell2"><span class="cell2__main" style="font-weight:400">${who}</span><span class="cell2__sub">${who === 'Thuyền viên' ? 'Ký online qua link gửi SMS 0900 000 123' : 'Ký trong app'}</span></span>${signBadge(st)}${phase === 'dang-ky' && st === 'wait' && who === 'Thuyền viên' ? btn('Gửi lại link', { size: 'sm', variant: 'ghost' }) : ''}</li>`; }).join('')}<li><span class="cell2"><span class="cell2__main" style="font-weight:400">Ô ngày tháng, điểm</span><span class="cell2__sub">Để trống, điền tay khi in</span></span>${signBadge('hand')}</li></ul>${phase === 'dang-ky' ? `<div style="margin-top:12px">${btn('Ký với tư cách Giám đốc', { variant: 'primary', iconName: 'edit' })}</div>` : ''}`, '', '6');
  const preview = `<section class="panel pack-preview" data-wf-block="5"><div class="panel__head"><h2 class="panel__title">${d[1]}</h2>${btn('Tải', { size: 'sm', variant: 'ghost', iconName: 'down' })}</div><div class="panel__body" style="background:var(--background)">${a4(picked, { signs: signsFor(d) })}</div></section>`;
  const bar = `<div class="pack-progress"><div class="ds-progress-block"><div class="ds-progress-block__head"><p class="ds-progress-block__label">Chữ ký đã có</p><p class="ds-progress-block__value">${progress} / 5</p></div><div class="ds-progress"><div class="ds-progress__bar" style="width:${progress * 20}%"></div></div></div></div>`;
  if (v === 'b') {
    // Theo người ký: mỗi người một hàng, các giấy họ cần ký
    const people = ['Giám đốc', 'Thuyền viên'];
    const rows = people.map((who) => { const mine = docs.filter((doc) => doc[3].includes(who)); return section(who, `<ul class="signers">${mine.map((doc) => `<li><span>${doc[1]}</span>${signBadge(signsFor(doc)[who])}</li>`).join('')}</ul>`, who === 'Thuyền viên' ? '<span class="muted">Link ký gửi qua SMS</span>' : btn('Ký tất cả 3 giấy', { size: 'sm', variant: 'primary', iconName: 'edit' })); }).join('');
    return shell({ crumb: 'Bản xuất', current: 'exports', content: `${head}${bar}<div class="two-col">${rows}</div>${preview}` });
  }
  return shell({ crumb: 'Bản xuất', current: 'exports', content: `${head}${bar}<div class="pack-sign">${list}${preview}<aside class="side-col">${signers}</aside></div>` });
}

function badge(group, value) {
  const [label, tone, mark] = STATUS[group][value];
  const head = mark === 'ring' || mark === 'ring-dot' ? `<span class="ds-badge__dot ds-badge__dot--${mark}" aria-hidden="true"></span>` : icon(mark, 'ds-badge__icon');
  return `<span class="ds-badge ds-badge--${tone}">${head}${label}</span>`;
}

}

function fileRow(file) {
  const s = file.st;
  let status = '';
  let acts = '';
  if (s === 'run') status = `<span class="d-file__state d-spin">${icon('loading')}Đang xử lý</span>`;
  else if (s === 'done') {
    status = file.other ? `<span class="d-file__state">${pill('neutral', 'Khác', '')}<span class="d-note">${file.summary} · lưu kèm hồ sơ</span></span>`
      : `<span class="d-file__state">${pill('success', 'Xong', 'check-circle')}<span class="d-note">${file.summary}</span></span>`;
    acts = file.other ? '' : btn('Duyệt', { size: 'sm', iconName: 'right' });
  } else if (s === 'error') { status = `<span class="d-file__state d-file__line--err">${icon('close-circle')}${esc(file.err)}</span>`; acts = `${btn('Thử lại', { size: 'sm', iconName: 'reload' })}${btn('Bỏ tệp', { size: 'sm', variant: 'ghost' })}`; }
  else if (s === 'stuck') { status = `<span class="d-file__state d-file__line--warn">${icon('clock-circle')}Quá 5 phút chưa xong, có thể bị kẹt</span>`; acts = `${btn('Thử lại', { size: 'sm', iconName: 'reload' })}${btn('Bỏ tệp', { size: 'sm', variant: 'ghost' })}`; }
  else if (s === 'badformat') { status = '<span class="d-file__state d-file__line--err">Chỉ nhận PDF, JPG, PNG</span>'; acts = btn('Bỏ khỏi danh sách', { size: 'sm', variant: 'ghost' }); }
  else if (s === 'toobig') { status = `<span class="d-file__state d-file__line--err">Tệp ${file.size}, quá 25 MB. Chọn bản nhỏ hơn</span>`; acts = btn('Bỏ khỏi danh sách', { size: 'sm', variant: 'ghost' }); }
  else if (s === 'duplicate') { status = `<span class="d-file__state d-file__line--warn">${icon('exclamation-circle')}Đã có trong hồ sơ (tải ngày ${file.dupAt})</span>`; acts = `${btn('Xem tệp đã có', { size: 'sm' })}${btn('Bỏ', { size: 'sm', variant: 'ghost' })}`; }
  else if (s === 'saved') { status = '<span class="d-file__state"><span class="d-note">Đã lưu kèm hồ sơ, chưa đọc</span></span>'; acts = btn('Đọc lại', { size: 'sm', iconName: 'reload', attrs: 'aria-disabled="true"' }); }
  else if (s === 'unsent') { status = '<span class="d-file__state d-file__line--err">Chưa gửi được</span>'; acts = btn('Gửi lại', { size: 'sm', iconName: 'reload' }); }
  return `<li class="d-file d-file--simple">${rowIcon(file)}<span class="d-file__name d-grow" title="${esc(file.name)}">${esc(file.name)}</span>${status}<span class="d-file__act">${acts}</span></li>`;
}
function t1Summary(files, tt) {
  const run = files.filter((file) => file.st === 'run').length;
  const attn = files.filter((file) => ['error', 'stuck', 'badformat', 'toobig', 'duplicate', 'unsent'].includes(file.st)).length;
  let title; let cta = '';
  if (tt === 'toan-khac') title = 'Xong. Giấy "Khác" chỉ lưu kèm hồ sơ, không cần duyệt.';
  else if (tt === 'chua-cau-hinh') title = 'Tệp đã lưu. AI chưa đọc được vì chưa cấu hình.';
  else if (run) title = `Đang xử lý ${run} tệp. Bạn có thể làm việc khác, trang tự cập nhật.`;
  else if (attn && tt === 'can-xu-ly') title = `${attn} tệp cần bạn xử lý`;
  else if (tt === 'mat-ket-noi') title = '2 tệp chưa gửi được';
  else { title = `Xong: ${TOTAL_SUMMARY.replace(' · cần duyệt 6', '')}`; cta = btn('Duyệt 6 giấy', { variant: 'primary', iconName: 'right' }); }
  const sub = run && files.some((file) => file.st === 'done' && !file.other) ? ' Xong đến đâu duyệt được đến đó.' : '';
  return `<div class="d-up__head" aria-live="polite"><p class="d-h d-grow">${title}${sub ? `<span class="d-note">${sub}</span>` : ''}</p>${cta}</div>`;
}

function docFieldsFor(id) {
  const meta = DOCMETA[id];
  if (meta.kind === 'info' || meta.kind === 'duty') {
    const trip = tripsForState().find((item) => item.id === id);
    const fields = JSON.parse(JSON.stringify(trip.fields));
    if (state.tt === 'khac-nguoi' && id === 'info') { const n = fields.find((f) => f.key === 'name'); n.raw = 'TRẦN VĂN KHÔI'; n.val = 'TRẦN VĂN KHÔI'; }
    return { fields, vessel: trip.vessel };
  }
  if (meta.kind === 'cert') {
    const c = CERTS.find((item) => item.id === id);
    const bad = state.tt === 'chung-chi-loi';
    const noExp = bad || !c.exp;
    return { vessel: null, fields: [
      { key: 'typeCode', label: 'Loại chứng chỉ', raw: c.raw, val: bad ? '' : c.name, st: bad ? 'UNKNOWN' : 'PROPOSED', to: 'pf', req: true, hint: bad ? `Không khớp danh mục. Đã lưu tên trên giấy: "${c.raw}". Chọn loại.` : '' },
      { key: 'valid', label: 'Có giá trị đến', raw: noExp ? '' : c.exp.replace(/\//g, '.'), val: noExp ? '' : c.exp, st: noExp ? 'UNKNOWN' : 'PROPOSED', to: 'pf', req: true, date: true, hint: noExp ? 'Giấy không ghi hạn: nhập ngày, hoặc đánh dấu không thời hạn.' : '' },
      { key: 'no', label: 'Số chứng chỉ', raw: c.no, val: c.no, st: 'PROPOSED', to: 'pf', num: true },
      { key: 'issuedOn', label: 'Cấp ngày', raw: c.issued, val: c.issued.replace(/\./g, '/'), st: 'PROPOSED', to: 'pf', date: true },
      { key: 'issuer', label: 'Nơi cấp', raw: c.by, val: c.by, st: 'PROPOSED', to: 'pf' },
      { key: 'holder', label: 'Tên người trên giấy', raw: c.holder, val: c.holder, st: 'PROPOSED', to: 'cmp' },

function vesselChip(vessel, locked) {
  if (!vessel) return '';

  if (st === 'MATCHED') return `<span class="d-vchip d-vchip--ok" title="${esc(text)}">${icon('check-circle')}Khớp danh mục</span>`;
