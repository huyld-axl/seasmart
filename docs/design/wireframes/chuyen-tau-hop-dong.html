  'hd-chi-tiet': { a: ['Chi tiết hợp đồng có duyệt', 'Nháp sửa được, bấm Xin duyệt. Chờ duyệt và Hiệu lực thì khoá nội dung. Chưa phân quyền nên Chờ duyệt có đủ ba nút: Thôi xin duyệt, Từ chối (bắt ghi lý do), Duyệt (hộp thoại xác nhận; nếu chuyến đang trên tàu thì có công tắc chuyển thuyền viên sang Đang trên tàu). Hiệu lực có nút In hợp đồng, chưa chạy.',
    ['Duyệt muộn vẫn đưa được người sang Đang trên tàu', 'Lý do từ chối hiện ngay đầu trang và trong lịch sử', 'Nút In hợp đồng nằm sẵn để nhớ việc còn thiếu'], ['Chưa có duyệt nhiều cấp', 'In hợp đồng chưa chạy, chờ mẫu MLC'], 'Một người duyệt cho mỗi hợp đồng.', ['Thêm duyệt hai cấp', 'Ẩn nút In hợp đồng tới khi có mẫu']] },
});
REASONS['hop-dong'].a[5] = ['Gộp thành một bảng ba cột: khoản · phải thu · phải chi', 'Thu gọn nhóm Một lần khi các khoản đều trống'];

// ---------- Vẽ ----------
function renderToolbar() {
  const screen = SCREENS[state.man];
  const set = (param, items, labels = {}) => {
    const element = document.querySelector(`[data-wf-param="${param}"]`);
    element.innerHTML = items.map(([value, label, extra = '']) => `<button type="button" data-value="${value}" aria-pressed="${state[param] === value}" ${extra}>${labels[value] || label}</button>`).join('');
  };
  set('man', Object.entries(SCREENS).map(([key, value]) => [key, value.label]));
  set('v', screen.options.map((option) => [option, option.toUpperCase(), option === screen.recommended ? 'data-recommended title="Khuyên dùng"' : '']), OPTION_LABELS[state.man] || {});
  document.querySelector('[data-wf-param="v"]').closest('.wf-group').style.display = screen.options.length > 1 ? '' : 'none';
  set('kho', [['desktop', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Desktop`], ['mobile', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>Mobile`]]);
  set('nav', [['menu', '☰ Menu'], ['duoi', 'Thanh dưới']]);
  document.querySelector('[data-wf-param="nav"]').style.display = state.kho === 'mobile' ? '' : 'none';
  const toggle = document.querySelector('[data-wf-toggle="mau"]');
  toggle.setAttribute('aria-checked', String(state.mau === 'mau'));
  const labels = { ...STATE_LABELS, ...(STATE_LABELS_BY_SCREEN[state.man] || {}) };
  document.getElementById('tt-current').textContent = labels[state.tt];
  document.getElementById('tt-menu').style.display = screen.states.length > 1 ? '' : 'none';

  const [name, why, pros, cons, fit, tips] = REASONS[state.man][state.v];
  document.getElementById('reason-name').textContent = name;
  document.getElementById('reason-tag').hidden = state.v !== screen.recommended || screen.options.length < 2;
  document.getElementById('reason-why').textContent = why;
  document.getElementById('reason-pros').innerHTML = pros.map((line) => `<li>${line}</li>`).join('');
  document.getElementById('reason-cons').innerHTML = cons.map((line) => `<li>${line}</li>`).join('');
  document.getElementById('reason-fit').textContent = fit;
  const tipsEl = document.getElementById('reason-tips');
  tipsEl.querySelectorAll('button').forEach((button) => button.remove());
  tips.forEach((tip) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = tip;
    button.addEventListener('click', async () => { try { await navigator.clipboard.writeText(tip); button.setAttribute('data-copied', ''); setTimeout(() => button.removeAttribute('data-copied'), 1500); } catch (error) { /* bị chặn thì thôi */ } });
    tipsEl.appendChild(button);
  });
}

function renderDesign() {
  const screens = { 'ds-chuyen': voyageListScreen, 'ds-hop-dong': contractListScreen, 'hd-chi-tiet': contractDetailScreen, chuyen: voyageScreen, 'hop-dong': contractScreen, 'di-tau': serviceScreen, 'tao-chuyen': voyageFormScreen, 'hop-thoai': dialogScreen, 'tien-luong': () => payrollScreen(), 'nhan-tien': receiveScreen, 'phieu-luong': slipScreen, 'chu-tau': ownerScreen };
  const html = screens[state.man]();
  document.getElementById('wf-design').innerHTML = state.kho === 'mobile' ? `<div class="wf-phone-wrap"><div class="wf-phone">${html}</div></div>` : html;
  requestAnimationFrame(() => requestAnimationFrame(placeBlockNumbers));
}

function render() {
  normalize();
  document.documentElement.dataset.mau = state.mau;
  renderToolbar();
  renderDesign();
  syncHash();
}

function placeBlockNumbers() {
  const overlap = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  for (const block of document.querySelectorAll('[data-wf-block]')) {
    const rect = block.getBoundingClientRect();
    const numberRect = { left: rect.left + 4, top: rect.top + 4, right: rect.left + 22, bottom: rect.top + 22 };
    const contentRects = [...block.querySelectorAll('svg, img')].map((node) => node.getBoundingClientRect());
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (!node.textContent.trim()) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      contentRects.push(...range.getClientRects());
    }
    block.toggleAttribute('data-wf-block-out', contentRects.some((r) => r.width > 0 && overlap(r, numberRect)));
  }
}

// ---------- Tương tác ----------
document.querySelector('.wf-bar').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  const param = button.closest('[data-wf-param]')?.dataset.wfParam;
  if (param) {
    state[param] = button.dataset.value;
    if (param === 'man' || param === 'v') { state.ptab = null; state.sel = null; state.sider = null; state.menuOpen = false; state.userOpen = false; }
    render();
    return;
  }
  if (button.dataset.wfToggle === 'mau') { state.mau = state.mau === 'mau' ? 'xam' : 'mau'; render(); return; }
  if (button.closest('#tt-menu')) {
    const menu = document.getElementById('tt-menu');
    const existing = document.querySelector('.wf-popover');
    if (existing) { existing.remove(); menu.removeAttribute('data-open'); return; }
    const rect = button.getBoundingClientRect();
    const labels = { ...STATE_LABELS, ...(STATE_LABELS_BY_SCREEN[state.man] || {}) };
    const popover = document.createElement('div');
    popover.className = 'wf-popover';
    popover.style.top = `${rect.bottom + 6}px`;
    popover.style.left = `${Math.min(rect.left, window.innerWidth - 200)}px`;
    popover.innerHTML = SCREENS[state.man].states.map((value) => `<button type="button" data-tt="${value}" aria-pressed="${state.tt === value}">${labels[value]}</button>`).join('');
    popover.addEventListener('click', (popEvent) => { const item = popEvent.target.closest('[data-tt]'); if (!item) return; state.tt = item.dataset.tt; popover.remove(); menu.removeAttribute('data-open'); render(); });
    document.body.appendChild(popover);
    menu.setAttribute('data-open', '');
  }
});
document.addEventListener('click', (event) => {
  if (!event.target.closest('#tt-menu') && !event.target.closest('.wf-popover')) { document.querySelector('.wf-popover')?.remove(); document.getElementById('tt-menu').removeAttribute('data-open'); }
});
document.getElementById('wf-design').addEventListener('click', (event) => {
  const target = event.target.closest('[data-action], [data-ptab], [data-pickrow], .sf-seg button');
  if (!target) return;
  if (target.matches('.sf-seg button')) { target.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === target))); return; }
  if (target.dataset.ptab) { state.ptab = target.dataset.ptab; renderDesign(); return; }
  if (target.dataset.pickrow) { const id = target.dataset.pickrow; const picked = state.sel || ['p1', 'p2', 'p3']; state.sel = picked.includes(id) ? picked.filter((x) => x !== id) : [...picked, id]; renderDesign(); return; }
  const action = target.dataset.action;
  if (action === 'menu') state.menuOpen = !state.menuOpen;
  if (action === 'user') state.userOpen = !state.userOpen;
  if (action === 'sider') {
    const collapsed = document.querySelector('.sider')?.classList.contains('sider--collapsed');
    state.sider = collapsed ? 'open' : 'collapsed';
  }
  renderDesign();
});
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  state.menuOpen = false; state.userOpen = false;
  document.querySelector('.wf-popover')?.remove();
  renderDesign();
});
addEventListener('resize', placeBlockNumbers);
render();

</script>
