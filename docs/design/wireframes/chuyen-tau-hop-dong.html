<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Chuyến tàu và Tiền lương</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  /* Wireframe nhóm A của MCAH (skill ui-ux, nhánh U, bước U3). Một theme sáng có chủ ý, như app.
     Token chép từ frontend/src/theme/tokens.js; component dùng chung class với frontend/src/components/ds/ds.css. */
  :root {
    color-scheme: light;
    --primary: #003366;
    --primary-hover: #1a4775;
    --primary-foreground: #ffffff;
    --primary-light: rgba(0, 51, 102, 0.06);
    --background: #f4f4f6;
    --surface: #ffffff;
    --foreground: #2c2c2c;
    --muted: #707070;
    --border: #e5e6ea;
    --border-strong: #d3d5db;
    --secondary: #e7e8ec;
    --secondary-hover: #dbdce2;
    --item-hover: #f4f4f6;
    --surface-hover: #f8f8fa;
    --button-hover: #f1f1f3;
    --ring-focus: rgba(0, 51, 102, 0.1);
    --border-focus: #003366;
    --neutral: #52525c;
    --neutral-bg: #f4f4f5;
    --success: #007a55;
    --success-bg: #ecfdf5;
    --warning: #bb4d00;
    --warning-bg: #fffbeb;
    --warning-border: #fee685;
    --error-strong: #c10007;
    --error-bg: #fef2f2;
    --error-border: #ffc9c9;
    --error: #fb2c36;
    --error-text: #e7000b;
    --danger: #c70036;
    --danger-bg: rgba(255, 32, 86, 0.1);
    --danger-bg-hover: rgba(255, 32, 86, 0.15);
    --app-font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --elevation-popover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --elevation-modal: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --legacy-none: 0;
  }
  /* Nấc Xám: tắt màu nhấn và màu trạng thái, còn lại giữ nguyên token (U3). */
  :root[data-mau="xam"] {
    --primary: #2c2c2c; --primary-hover: #474747; --primary-light: rgba(44, 44, 44, 0.05);
    --ring-focus: rgba(44, 44, 44, 0.1); --border-focus: #2c2c2c;
    --success: #52525c; --success-bg: #f4f4f5; --warning: #52525c; --warning-bg: #f4f4f5; --warning-border: #e4e4e7;
    --error-strong: #52525c; --error-bg: #f4f4f5; --error-border: #e4e4e7; --error-text: #52525c; --danger: #52525c; --danger-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--app-font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: none; }

  /* Component riêng của MCAH. Dự án không dùng Tailwind: class của skill dịch sang CSS thuần, màu lấy biến
   token (src/theme/tokens.js). Không mã màu nào ngoài biến, trừ lớp phủ theo màu chữ. */

.ds-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.ds-link {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--foreground);
  font: inherit;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ---------- Badge trạng thái (M7) ---------- */
.ds-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.05);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
}
.ds-badge--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-badge--success { background: var(--success-bg); color: var(--success); }
.ds-badge--warning { background: var(--warning-bg); color: var(--warning); }
.ds-badge--error { background: var(--error-bg); color: var(--error-strong); }
.ds-badge__icon { font-size: 13px; }
.ds-badge__dot { flex-shrink: 0; width: 10px; height: 10px; border-radius: 9999px; }
.ds-badge__dot--ring { border: 1.5px solid currentColor; }
.ds-badge__dot--ring-dot { border: 1.5px solid currentColor; background: radial-gradient(currentColor 0 2px, transparent 2.5px); }

/* ---------- Ô trường duyệt ---------- */
.ds-field {
  display: grid;
  gap: 8px;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.ds-field--active { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-field__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.ds-field__label { color: var(--muted); font-size: 12px; font-weight: 500; }
.ds-field__required { margin-left: 2px; color: var(--error-text); }
.ds-field__value { margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-field__value--unknown { color: var(--muted); font-style: italic; font-weight: 400; }
.ds-field__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.ds-field__badges { display: flex; flex-wrap: wrap; gap: 6px; }
.ds-field__actions { display: flex; flex-wrap: wrap; gap: 2px; }
.ds-field__reason { margin: 0; color: var(--muted); font-size: 12px; }

.ds-chip-page {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: var(--foreground);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.ds-chip-page:hover { background: rgb(44 44 44 / 0.1); }

/* ---------- Khung xem tài liệu ---------- */
.ds-viewer {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.ds-viewer__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  min-height: 56px;
  padding: 8px 12px 8px 20px;
  border-bottom: 1px solid var(--border-strong);
}
.ds-viewer__name { flex: 1 1 200px; min-width: 0; margin: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-viewer__tools { display: flex; flex-shrink: 0; align-items: center; gap: 2px; }
.ds-viewer__count { min-width: 44px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.ds-viewer__divider { width: 1px; height: 20px; margin: 0 6px; background: var(--border-strong); }
.ds-viewer__evidence { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--border); background: var(--primary-light); color: var(--foreground); font-size: 12px; }
.ds-viewer__stage { display: grid; place-items: start center; min-height: 320px; padding: 24px; overflow: auto; background: var(--background); }

.ds-sample-page {
  width: 100%;
  min-width: 480px; /* trang tài liệu không co chữ theo màn: hẹp thì cuộn như ảnh */
  max-width: 520px;
  padding: 24px;
  border-radius: 4px;
  background: #fbfaf6; /* giấy sổ, chỉ trong trang mẫu */
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  color: #3b3b3b;
  font-family: 'Courier New', ui-monospace, monospace;
  font-size: 12px;
}
.ds-sample-page__title { margin: 0 0 12px; font-weight: 700; letter-spacing: 0.04em; }
.ds-sample-page table { width: 100%; border-collapse: collapse; }
.ds-sample-page th, .ds-sample-page td { padding: 6px; border: 1px solid #c9c4b5; text-align: left; }
.ds-sample-page td { font-family: 'Segoe Script', 'Brush Script MT', cursive; font-size: 13px; }
.ds-sample-page__stamp { margin: 16px 0 0; color: #5f5a4e; text-align: right; }

/* ---------- Khung kéo thả tệp ---------- */
.ds-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--background) 60%, transparent);
  text-align: center;
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-drop:hover { background: var(--item-hover); }
.ds-drop__title { color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-drop__hint { margin-top: 4px; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-drop__button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin-top: 16px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
}
@media (hover: none) { .ds-drop__title { display: none; } }

.ds-files { margin: 16px 0 0; padding: 0; list-style: none; }
.ds-files__row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.ds-files__row:first-child { border-top: 0; }
.ds-files__icon { flex-shrink: 0; color: var(--muted); font-size: 18px; }
.ds-files__body { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; gap: 6px; min-width: 0; }
.ds-files__line { display: flex; align-items: baseline; gap: 12px; }
.ds-files__name { display: flex; flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-files__head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-files__tail { flex-shrink: 0; white-space: nowrap; }
.ds-files__percent { flex-shrink: 0; margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.ds-files__meta { margin: 0; color: var(--muted); font-size: 12px; }
.ds-files__meta--error { color: var(--error-text); }
.ds-files__meta--warning { color: var(--warning); }

/* ---------- Thanh tiến độ ---------- */
.ds-progress { height: 8px; border-radius: 9999px; background: rgb(44 44 44 / 0.05); overflow: hidden; }
.ds-progress--thin { height: 4px; }
.ds-progress__bar { height: 100%; border-radius: 9999px; background: var(--primary); }
.ds-progress-block { display: grid; gap: 8px; }
.ds-progress-block__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ds-progress-block__label { min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-progress-block__value { flex-shrink: 0; margin: 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- Dòng thời gian audit ---------- */
.ds-timeline { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.ds-timeline__item { position: relative; display: flex; gap: 12px; padding-bottom: 24px; }
.ds-timeline__item:last-child { padding-bottom: 0; }
.ds-timeline__line { position: absolute; top: 40px; bottom: 4px; left: 15px; width: 2px; background: var(--border-strong); }
.ds-timeline__item:last-child .ds-timeline__line { display: none; }
.ds-timeline__icon { display: grid; flex-shrink: 0; place-items: center; width: 32px; height: 32px; border-radius: 9999px; font-size: 14px; }
.ds-timeline__icon--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-timeline__icon--success { background: var(--success-bg); color: var(--success); }
.ds-timeline__icon--warning { background: var(--warning-bg); color: var(--warning); }
.ds-timeline__icon--error { background: var(--error-bg); color: var(--error-strong); }
.ds-timeline__body { min-width: 0; flex: 1; padding-top: 6px; }
.ds-timeline__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.ds-timeline__title { margin: 0; color: var(--foreground); font-weight: 500; }
.ds-timeline__time { flex-shrink: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ds-timeline__change { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.ds-timeline__before { color: var(--muted); text-decoration: line-through; }
.ds-timeline__after { color: var(--foreground); font-weight: 500; }
.ds-timeline__detail { max-width: 55ch; margin: 4px 0 0; color: var(--muted); text-wrap: pretty; }
.ds-timeline__meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- Banner ---------- */
.ds-banner { display: flex; gap: 12px; padding: 16px; border: 1px solid; border-radius: var(--radius-lg); }
.ds-banner--warning { border-color: var(--warning-border); background: var(--warning-bg); }
.ds-banner--error { border-color: var(--error-border); background: var(--error-bg); }
.ds-banner--neutral { border-color: var(--border-strong); background: var(--surface); }
.ds-banner__icon { flex-shrink: 0; margin-top: 2px; font-size: 18px; }
.ds-banner--warning .ds-banner__icon, .ds-banner--warning .ds-banner__title { color: var(--warning); }
.ds-banner--error .ds-banner__icon, .ds-banner--error .ds-banner__title { color: var(--error-strong); }
.ds-banner--neutral .ds-banner__icon { color: var(--muted); }
.ds-banner__body { flex: 1; min-width: 0; }
.ds-banner__title { margin: 0; font-size: 14px; font-weight: 500; }
.ds-banner__text { margin: 2px 0 0; color: rgb(44 44 44 / 0.8); font-size: 14px; text-wrap: pretty; }
.ds-banner__body ul { margin: 6px 0 0; padding-left: 18px; color: rgb(44 44 44 / 0.8); font-size: 14px; }
.ds-banner__action { display: flex; flex-shrink: 0; align-items: center; align-self: center; gap: 4px; }

/* ---------- Card chọn ---------- */
.ds-choice { min-width: 0; margin: 0; padding: 0; border: 0; }
.ds-choice__legend { margin-bottom: 12px; padding: 0; font-size: 14px; font-weight: 500; }
.ds-choice__grid { display: grid; grid-template-columns: repeat(var(--ds-choice-columns, 1), minmax(0, 1fr)); gap: 12px; }
@media (max-width: 639px) { .ds-choice__grid { grid-template-columns: minmax(0, 1fr); } }
.ds-choice__card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-choice__card:hover { background: var(--surface-hover); }
.ds-choice__card:has(:checked) { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-choice__card.is-disabled { cursor: not-allowed; opacity: 0.5; }
.ds-choice__radio {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin: 0;
  border: 1.5px solid var(--border-strong);
  border-radius: 9999px;
  background: var(--surface);
  appearance: none;
  outline: none;
  cursor: inherit;
}
.ds-choice__radio:checked { border: 6px solid var(--primary); }
.ds-choice__text { min-width: 0; }
.ds-choice__title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 500; }
.ds-choice__aside { color: var(--muted); font-size: 12px; font-weight: 400; }
.ds-choice__desc { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }

/* ---------- Danh sách mô tả ---------- */
.ds-dl { display: grid; gap: 12px; margin: 0; container-type: inline-size; font-size: 14px; }
.ds-dl__row { display: grid; gap: 4px; }
.ds-dl__label { color: var(--muted); }
.ds-dl__value { min-width: 0; margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-weight: 500; }
.ds-dl__value--empty { color: var(--muted); font-weight: 400; }
@container (min-width: 384px) { .ds-dl__row { grid-template-columns: 7rem minmax(0, 1fr); align-items: baseline; gap: 24px; } }
@container (min-width: 576px) { .ds-dl__row { grid-template-columns: 10rem minmax(0, 1fr); } }

/* ---------- Tab boxed, chip lọc ---------- */
.ds-tabs-boxed { display: flex; gap: 4px; }
.ds-tabs-select { display: none !important; width: max-content; min-width: 200px; }
.ds-tabs-select__prefix { color: var(--muted); }
@media (max-width: 639px) {
  .ds-tabs-boxed { display: none; }
  .ds-tabs-select { display: inline-flex !important; }
}
.ds-tabs-boxed__tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-tabs-boxed__tab:hover { background: rgb(44 44 44 / 0.05); color: var(--foreground); }
.ds-tabs-boxed__tab[aria-selected='true'] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
.ds-tabs-boxed__count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ds-tabs-boxed__tab[aria-selected='true'] .ds-tabs-boxed__count { color: var(--foreground); }

.ds-chips { overflow-x: auto; padding-block: 2px; }
.ds-chips__row { display: flex; gap: 8px; padding-inline: 4px; }
.ds-chip {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  max-width: 192px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-chip:hover { background: rgb(44 44 44 / 0.1); color: var(--foreground); }
.ds-chip[aria-pressed='true'] { background: var(--primary); color: var(--primary-foreground); }
.ds-chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Tự lưu, rỗng, dòng danh sách ---------- */
.ds-save { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.ds-save--failed { color: var(--error-text); }

.ds-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 40px 16px; text-align: center; }
.ds-empty__title { margin: 0; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-empty__title--error { color: var(--error-text); }
.ds-empty__text { max-width: 48ch; margin: 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-empty__action { margin-top: 12px; }

.ds-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md); }
.ds-row:hover { background: var(--item-hover); }
.ds-row__leading { flex-shrink: 0; }
.ds-row__body { flex: 1; min-width: 0; }
.ds-row__title { margin: 0; overflow: hidden; color: var(--foreground); font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-row__meta { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.ds-row__trailing { flex-shrink: 0; }

/* ---------- Panel trượt ---------- */
.ds-panel .ant-drawer-mask { background: rgb(0 0 0 / 0.15); }
.ds-panel .ant-drawer-content-wrapper { box-shadow: var(--elevation-modal); }
.ds-panel.ant-drawer-right .ant-drawer-content-wrapper { transition-duration: 0.5s; transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1); }
.ds-panel .ant-drawer-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.ds-panel .ant-drawer-body { padding: 24px; }
.ds-panel .ant-drawer-footer { padding: 16px 24px; border-top: 1px solid var(--border); }
.ds-panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ds-panel__heading { min-width: 0; }
.ds-panel__title { margin: 0; font-size: 18px; font-weight: 600; line-height: 28px; }
.ds-panel__desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; font-weight: 400; text-wrap: pretty; }
.ds-panel__foot { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- Toast ---------- */
.ds-toast.ant-notification-notice { width: auto; max-width: min(440px, calc(100vw - 32px)); padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elevation-popover); }
.ds-toast .ant-notification-notice-icon { top: 50%; translate: 0 -50%; font-size: 16px; line-height: 1; }
.ds-toast--success .ant-notification-notice-icon { color: var(--success); }
.ds-toast--error .ant-notification-notice-icon { color: var(--error-strong); }
.ds-toast .ant-notification-notice-title, .ds-toast .ant-notification-notice-message { margin: 0 0 0 28px !important; padding: 0 !important; font-size: 14px; }
.ds-toast .ant-notification-notice-description { display: none; }
.ds-toast__row { display: flex; align-items: center; gap: 16px; }
.ds-toast__text { flex: 1; min-width: 0; }
.ds-toast__action { flex-shrink: 0; }

/* ---------- Đầu trang và thanh công cụ danh sách ---------- */
.ds-page { display: grid; gap: 16px; }
.ds-page__head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
.ds-page__title { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; }
.ds-page__desc { margin: 4px 0 0; color: var(--muted); }
.ds-page__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.ds-toolbar__search { flex: 1 1 220px; max-width: 320px; }
.ds-toolbar__end { margin-left: auto; display: flex; gap: 8px; }
.ds-card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.ds-card .ant-table-wrapper .ant-table { background: transparent; }
.ds-table-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); }
.ds-cell2 { display: grid; min-width: 0; }
.ds-cell2__main { overflow: hidden; color: var(--foreground); font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-cell2__sub { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.ds-num { font-variant-numeric: tabular-nums; }
.ds-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.ds-role { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--neutral-bg); color: var(--neutral); font-size: 12px; font-weight: 500; white-space: nowrap; }
.ds-form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
@media (max-width: 639px) { .ds-form-row { grid-template-columns: minmax(0, 1fr); } }

.product-brand {
  display: inline-flex;
  min-width: 0;
  align-items: center;
  gap: 10px;
}

.product-brand__mark {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-foreground);
}

.product-brand__mark svg {
  width: 20px;
  height: 20px;
}

.product-brand__name {
  overflow: hidden;
  font-size: 14px;
  font-weight: 600;
  color: var(--foreground);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-brand--collapsed .product-brand__name {
  display: none;
}

.product-brand--inverted .product-brand__mark {
  background: #ffffff;
  color: #001529; /* nền sidebar tối hiện tại */
}

.product-brand--inverted .product-brand__name {
  color: var(--primary-foreground);
}


  /* ===== Thanh công cụ của wireframe (nằm ngoài bản thiết kế, design-process.md U3) ===== */
  .wf-bar { position: relative; z-index: 50; display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; overflow-x: auto; white-space: nowrap;
    background: #fff; border-bottom: 1px solid #e5e5e5; color: #737373; font: 14px/1 system-ui, -apple-system, sans-serif; }
  .wf-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wf-set { display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding: 3px; border-radius: 10px; background: #f4f4f5; }
  .wf-set button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 30px; padding: 0 10px;
    border: 0; border-radius: 7px; background: none; color: #737373; cursor: pointer; }
  .wf-set button:hover { color: #171717; }
  .wf-set button[aria-pressed="true"] { background: #fff; color: #171717; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px rgb(0 0 0 / .04); }
  .wf-set button[data-recommended]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #003366; }
  .wf-set svg { width: 16px; height: 16px; }
  .wf-switch { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 0; border: 0; background: none; color: #737373; cursor: pointer; }
  .wf-switch i { position: relative; width: 36px; height: 20px; border-radius: 10px; background: #e4e4e7; }
  .wf-switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: translate .15s; }
  .wf-switch[aria-checked="true"] i { background: #171717; }
  .wf-switch[aria-checked="true"] i::after { translate: 16px 0; }
  .wf-menu { position: relative; flex-shrink: 0; }
  .wf-menu > button { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: #737373; cursor: pointer; }
  .wf-menu > button:hover, .wf-menu[data-open] > button { background: #f4f4f5; }
  .wf-menu b { color: #171717; font-weight: 500; }
  .wf-popover { position: fixed; z-index: 60; display: grid; min-width: 168px; padding: 4px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
  .wf-popover button { display: flex; align-items: center; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: #404040; text-align: left; cursor: pointer; }
  .wf-popover button:hover, .wf-popover button[aria-pressed="true"] { background: #f4f4f5; color: #171717; }
  .wf-reason { border-bottom: 1px solid #e5e5e5; background: #fafafa; color: #404040; font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  .wf-reason summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 44px; padding: 8px 16px; cursor: pointer; list-style: none; }
  .wf-reason summary::-webkit-details-marker { display: none; }
  .wf-reason-name { color: #171717; font-weight: 600; white-space: nowrap; }
  .wf-reason-tag { flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 10px; background: #e6edf5; color: #003366; font-size: 12px; font-weight: 500; line-height: 20px; }
  .wf-reason-why { flex: 1; min-width: 0; overflow: hidden; color: #525252; text-overflow: ellipsis; white-space: nowrap; }
  .wf-reason[open] .wf-reason-why { white-space: normal; }
  .wf-reason-toggle { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 28px; margin-left: auto; padding: 0 8px; border-radius: 6px; color: #171717; font-weight: 500; }
  .wf-reason-toggle svg { width: 14px; height: 14px; transition: rotate .15s; }
  .wf-reason[open] .wf-reason-toggle svg { rotate: 180deg; }
  .wf-reason-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 4px 16px 16px; }
  .wf-reason-cols { display: grid; max-width: 1120px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px 32px; }
  .wf-reason h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; color: #171717; font-size: 12px; font-weight: 600; }
  .wf-reason h3 i { width: 6px; height: 6px; border-radius: 50%; background: #a3a3a3; }
  .wf-reason h3 i[data-tone="uu"] { background: #16a34a; }
  .wf-reason h3 i[data-tone="nhuoc"] { background: #d97706; }
  .wf-reason ul { display: grid; gap: 2px; margin: 0; padding-left: 16px; }
  .wf-reason p { margin: 0; }
  .wf-reason-tips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #ebebeb; }
  .wf-reason-tips h3 { margin: 0 4px 0 0; }
  .wf-reason-tips button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; color: #262626; white-space: nowrap; cursor: pointer; }
  .wf-reason-tips button:hover { background: #f5f5f5; }
  .wf-reason-tips button[data-copied] { color: #16a34a; }
  @media (max-width: 767px) {
    .wf-reason-why { order: 1; flex-basis: 100%; }
    .wf-reason-toggle span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .wf-reason-tips h3 { flex-basis: 100%; }
  }
  [data-wf-block] { position: relative; }
  [data-wf-block]::before { content: attr(data-wf-block); position: absolute; top: 4px; left: 4px; z-index: 5; display: grid; place-items: center;
    width: 18px; height: 18px; border-radius: 9px; background: #1f1f1f; color: #fff; font: 500 11px/1 system-ui, sans-serif; pointer-events: none; }
  [data-wf-block][data-wf-block-out]::before { top: auto; bottom: 100%; }
  .wf-stage { padding: 0; }
  .wf-phone-wrap { display: grid; place-items: center; padding: 24px 16px; }
  .wf-phone { position: relative; width: 375px; max-width: 100%; height: 812px; overflow: auto; border: 1px solid #ddd; border-radius: 24px; background: var(--background); }

  /* ===== Bản thiết kế: khung app ===== */
  .app { container: app / inline-size; position: relative; display: flex; min-height: calc(100vh - 100px); background: var(--background); }
  .wf-phone .app { min-height: 100%; }
  @media (max-width: 439px) { .wf-phone-wrap { padding: 0; } .wf-phone { width: 100%; height: auto; min-height: 812px; border: 0; border-radius: 0; } }
  .sider { position: sticky; top: 0; display: flex; flex-direction: column; flex-shrink: 0; width: 240px; height: 100vh; max-height: 100%; overflow: hidden; background: var(--surface); transition: width .2s; }
  .sider--collapsed { width: 64px; }
  .sider__head { display: flex; align-items: center; height: 64px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .sider__nav { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
  .nav-item { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; color: rgb(44 44 44 / .7); text-decoration: none; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .nav-item svg { flex-shrink: 0; font-size: 16px; }
  .nav-item:hover { background: var(--item-hover); color: var(--foreground); }
  .nav-item[aria-current="page"] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
  .sider--collapsed .nav-item span, .sider--collapsed .product-brand__name { display: none; }
  .main { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .topbar__title { min-width: 0; margin: 0; overflow: hidden; font-size: 16px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .topbar__crumb { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); font-size: 14px; }
  .topbar__crumb a { display: inline-flex; align-items: center; min-height: 32px; color: var(--muted); text-decoration: none; }
  .topbar__crumb a:hover { color: var(--foreground); }
  .topbar__right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .user-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 4px; border: 0; border-radius: 12px; background: none; cursor: pointer; }
  .user-btn:hover, .user-btn[aria-expanded="true"] { background: rgb(44 44 44 / .05); }
  .avatar { display: grid; flex-shrink: 0; place-items: center; width: 32px; height: 32px; border-radius: 9999px; background: #e6edf5; color: #1a4775; font-size: 12px; font-weight: 600; }
  .user-btn__name { font-size: 14px; font-weight: 500; }
  .user-btn svg { color: var(--muted); font-size: 12px; }
  .menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; display: grid; min-width: 220px; max-width: calc(100cqw - 24px); padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--elevation-popover); }
  .menu__meta { padding: 8px 12px; color: var(--muted); font-size: 12px; }
  .menu__item { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--foreground); text-align: left; cursor: pointer; }
  .menu__item:hover { background: var(--item-hover); }
  .menu__item--danger { color: var(--danger); }
  .menu__sep { height: 1px; margin: 4px 0; background: var(--border); }
  .btn.burger { display: none; }
  .content { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 16px; padding: 16px; }
  @container app (min-width: 640px) { .content { padding: 24px; } }
  @container app (max-width: 639px) {
    .sider { display: none; }
    .btn.burger { display: inline-flex; }
    .topbar { padding-left: 8px; }
    .user-btn__name { display: none; }
  }
  /* Tab trạng thái thành nút "Trạng thái:" dưới 640 (luật chốt #7), đo theo khung app thay vì viewport. */
  .btn.ds-tabs-mobile { display: none; gap: 6px; }
  @container app (max-width: 639px) { .ds-tabs-boxed { display: none; } .btn.ds-tabs-mobile { display: inline-flex; } .btn.sider-toggle { display: none; } }
  @container app (min-width: 640px) { .ds-tabs-boxed { display: flex; } }
  .drawer-scrim { position: absolute; inset: 0; z-index: 40; background: rgb(0 0 0 / .3); }
  .drawer { position: absolute; inset: 0 auto 0 0; z-index: 41; width: 280px; max-width: 85%; background: var(--surface); box-shadow: var(--elevation-modal); }
  .bottombar { position: sticky; bottom: 0; z-index: 20; display: none; grid-template-columns: repeat(4, 1fr); height: 64px; border-top: 1px solid var(--border); background: var(--surface); }
  .bottombar a { display: grid; place-content: center; justify-items: center; gap: 2px; color: rgb(44 44 44 / .7); font-size: 11px; text-decoration: none; }
  .bottombar a svg { font-size: 18px; }
  .bottombar a[aria-current="page"] { color: var(--foreground); font-weight: 600; }
  @container app (max-width: 639px) { .app[data-nav="duoi"] .bottombar { display: grid; } .app[data-nav="duoi"] .btn.burger { display: none; } }

  /* ===== Control theo theme Ant Design của dự án ===== */
  .btn { white-space: nowrap; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 1px solid var(--border-strong);
    border-radius: 12px; background: var(--surface); color: var(--foreground); font-weight: 500; line-height: 1.2; text-align: center; cursor: pointer; transition: background-color .15s; }
  .btn:hover { background: var(--button-hover); }
  /* Nút viền đặt trên nền trang hay nền banner: nền rê lấy secondary, #f1f1f3 tan vào #f4f4f6. */
  .err-block .btn:not(.btn--primary):hover, .ds-banner .btn:hover, .toolbar > .btn:not(.btn--primary):hover, .ds-empty .btn:not(.btn--primary):hover { background: var(--secondary); }
  .btn svg { font-size: 16px; }
  .btn--primary { border-color: transparent; background: var(--primary); color: var(--primary-foreground); }
  .btn--primary:hover { background: var(--primary-hover); }
  .btn--secondary { border-color: transparent; background: var(--secondary); }
  .btn--secondary:hover { background: var(--secondary-hover); }
  .btn--ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn--ghost:hover { background: rgb(44 44 44 / .05); color: var(--foreground); }
  .btn--sm { min-height: 32px; padding: 0 12px; border-radius: 8px; }
  .btn--icon { width: 40px; padding: 0; }
  .btn--icon.btn--sm { width: 32px; }
  .btn[aria-disabled="true"] { cursor: not-allowed; opacity: .5; }
  .btn--lg { min-height: 48px; }
  .btn--block { width: 100%; }
  .search { position: relative; display: flex; align-items: center; min-width: 0; }
  .search svg { position: absolute; left: 14px; color: var(--muted); font-size: 16px; pointer-events: none; }
  .input { width: 100%; height: 40px; padding: 0 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
  .input::placeholder { color: var(--muted); }
  .input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
  .search .input { padding-left: 40px; }
  .input--lg { height: 48px; }
  .input--error { border-color: var(--error); }
  .field-label { display: block; width: fit-content; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
  .field-hint { min-height: 16px; margin: 6px 0 0; color: var(--error-text); font-size: 12px; }

  .panel { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
  .panel__title { margin: 0; font-size: 16px; font-weight: 600; }
  .panel__body { padding: 16px 20px 20px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .warn-text { color: var(--warning); }
  .sk { display: block; height: 12px; border-radius: 6px; background: rgb(44 44 44 / .07); }

  /* ===== Bảng tài liệu ===== */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .toolbar__search { flex: 1 1 220px; max-width: 320px; margin-left: auto; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { height: 44px; padding: 0 16px; color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; white-space: nowrap; }
  .tbl td { height: 64px; padding: 8px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
  .tbl tbody tr:hover { background: var(--surface-hover); }
  .tbl .right { text-align: right; }
  .cell2 { display: grid; min-width: 0; }
  .cell2__main { overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
  .cell2__sub { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .tbl-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); }
  .doc-list { display: none; margin: 0; padding: 4px 8px; list-style: none; }
  .doc-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 8px; border-top: 1px solid var(--border); }
  .doc-list li:first-child { border-top: 0; }
  @container app (max-width: 639px) { .tbl-wrap { display: none; } .doc-list { display: block; } .toolbar__search { max-width: none; margin-left: 0; } }
  @container app (max-width: 1023px) { .col-lg { display: none; } }

  /* ===== Màn duyệt ===== */
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 16px; }
  .page-head__text { flex: 1 1 280px; min-width: 0; }
  .page-head__title { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
  .page-head__desc { max-width: 55ch; margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .page-head__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .publish-note { margin: 6px 0 0; color: var(--muted); font-size: 12px; text-align: right; }
  .review { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @container app (min-width: 1024px) { .review { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .review .ds-viewer { position: sticky; top: 88px; } }
  .review .ds-viewer__stage { min-height: 520px; }
  .switch-view { display: none; }
  @container app (max-width: 1023px) { .switch-view { display: flex; } .review[data-view="fields"] .ds-viewer { display: none; } .review[data-view="doc"] .fields-col { display: none; } }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: rgb(44 44 44 / .05); }
  .seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: rgb(44 44 44 / .7); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--foreground); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 0 0 1px rgb(0 0 0 / .04); }
  .fields-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .group { display: grid; gap: 12px; }
  .group__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0; }
  .group__title { margin: 0; font-size: 16px; font-weight: 600; }
  .group__count { color: var(--muted); font-size: 14px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 12px; }
  .contract { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .contract__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .contract__title { margin: 0; font-size: 14px; font-weight: 600; }
  /* Bảng thuyền viên: dòng mở ra (B), danh sách trái + chi tiết phải (C) */
  .tbl-sub > td { padding: 0 16px 12px 56px !important; background: var(--surface-hover); }
  .subdocs { margin: 0; }
  .subdocs .ds-files__row { gap: 12px; }
  .subdocs__foot { padding-top: 4px; }
  .md { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  @container app (min-width: 1024px) { .md { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); } }
  .md-list ul { margin: 0; padding: 4px; list-style: none; }
  .md-list button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; }
  .md-list button:hover { background: var(--item-hover); }

  /* ===== Nhóm E: Chuyến tàu, hợp đồng MLC, tiền lương. Chỉ dùng token và class sẵn có; khối mới ghi rõ dưới đây. ===== */

  /* Thẻ chuyến đang mở */
  .trip-now { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }

  /* Bốn mốc ngày của chuyến */

  .mile::before { content: ""; position: absolute; top: 5px; left: 0; width: 12px; height: 12px; border: 2px solid var(--border-strong); border-radius: 999px; background: var(--surface); box-sizing: border-box; z-index: 1; }

  .mile:last-child::after { display: none; }

  .mile[data-now="true"]::before { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 4px var(--ring-focus); }

  /* Điều khoản tóm tắt: 4 ô cùng hàng */

  @container app (max-width: 479px) { .terms { grid-template-columns: minmax(0, 1fr); } }
  .chip-int { display: inline-flex; align-items: center; height: 18px; margin-left: 6px; padding: 0 6px; border-radius: 6px; background: var(--neutral-bg); color: var(--neutral); font-size: 11px; font-weight: 500; vertical-align: 1px; }

  /* Form trang đầy đủ: chép class sf-* của SeafarerForm.css, bỏ phần AntD */

  @container app (min-width: 1100px) { .sf-layout { grid-template-columns: 280px minmax(0, 1fr); gap: 24px; } .sf-aside { position: sticky; top: 88px; } }
  .sf-aside { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }

  .sf-progress__top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .sf-bar { height: 6px; overflow: hidden; border-radius: 999px; background: var(--secondary); }
  .sf-bar span { display: block; height: 100%; border-radius: 999px; background: var(--primary); }

  .sf-toc__n { display: grid; flex-shrink: 0; place-items: center; width: 22px; height: 22px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--neutral); font-size: 11px; font-weight: 600; }

  }
  .sf-sections { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sf-panel { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .sf-panel__head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; padding: 20px 24px 0; }
  .sf-step { display: grid; flex-shrink: 0; place-items: center; width: 28px; height: 28px; border-radius: 999px; background: var(--secondary); font-size: 12px; font-weight: 600; }
  .sf-panel__title { margin: 2px 0 0; font-size: 16px; font-weight: 600; }
  .sf-panel__desc { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .sf-panel__meta { margin-left: auto; padding-top: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sf-panel__body { padding: 20px 24px 24px; }

  @container app (max-width: 599px) { .sf-grid > .sf-c3, .sf-grid > .sf-c4 { grid-column: 1 / -1; } .sf-panel__head { padding: 16px 16px 0; } .sf-panel__body { padding: 16px; } .sf-panel__desc { display: none; } }
  .sf-sub { display: flex; align-items: center; gap: 12px; margin: 2px 0 -6px; color: var(--neutral); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .sf-sub::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .sf-hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
  .sf-err { margin: 6px 0 0; color: var(--error-text); font-size: 12px; }
  .sf-req { margin-left: 2px; color: var(--error-text); }
  .sf-opt { margin-left: 8px; color: var(--muted); font-size: 12px; font-weight: 400; }
  .sf-chip { display: inline-flex; align-items: center; height: 20px; margin-left: 8px; padding: 0 8px; border-radius: 999px; background: #eef3f8; color: var(--primary); font-size: 11px; font-weight: 500; }
  .sf-changed .input, .sf-changed .select-like { border-color: var(--primary); background: var(--primary-light); }
  .sf-seg { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 2px; padding: 3px; border-radius: 12px; background: rgb(44 44 44 / .05); }

  /* Chép nguyên từ components/ds/ds.css: khung thả tệp mới và chuyến đi tàu trên đường dọc */
/* Khung thả tệp mới: một hàng có biểu tượng; --slim là phần chân của khung tải lên, --big khi chưa có tệp */
.ds-updrop {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 16px;
  padding: 16px;
  border: 1px dashed var(--border-strong);
  border-radius: 12px;
  background: var(--primary-light);
  cursor: pointer;
}
.ds-updrop__icon { display: grid; flex-shrink: 0; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--surface); color: var(--primary); font-size: 20px; }

.ds-updrop__hint { margin-top: 2px; color: var(--neutral); font-size: 14px; text-wrap: pretty; }

.ds-updrop--slim .ds-updrop__icon { width: 32px; height: 32px; font-size: 16px; }
/* Chuyến đi tàu trên đường dọc */
.ds-trips { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.ds-trip { position: relative; display: grid; gap: 8px; margin-left: 20px; padding: 12px 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--surface); }
.ds-trip::before { content: ""; position: absolute; top: 20px; left: -20px; width: 10px; height: 10px; border-radius: 9999px; background: var(--border-strong); box-shadow: 0 0 0 3px var(--background); }
.ds-trip[data-now="true"]::before { background: var(--success); }
.ds-trip::after { content: ""; position: absolute; top: 34px; bottom: -14px; left: -16px; width: 2px; background: var(--border-strong); }
.ds-trip:last-child::after { display: none; }
.ds-trip__head { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; }
.ds-trip__vessel { flex: 1 1 80px; min-width: 0; overflow-wrap: anywhere; }
.ds-trip__sub { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.ds-trip__dates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0; font-size: 13px; }
.ds-trip__date { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: slashed-zero tabular-nums; }
.ds-trip__none { color: var(--muted); font-size: 12px; }
.ds-trip__flags { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.ds-trip__overlap { margin: 0; color: var(--warning); font-size: 12px; text-wrap: pretty; }
.ds-trip__source { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0; color: var(--muted); font-size: 12px; }

(function readState() {
  const params = new URLSearchParams(location.search);
  const hash = location.hash.replace(/^#/, '').split('.');

})();

}

}

function serviceScreen() {

  if (tt === 'loi') return shell({ title: 'Thuyền viên', content: `${profileTop('ONBOARD')}${failed('Không tải được các chuyến đi tàu')}` });
  if (tt === 'dang-tai') return shell({ title: 'Thuyền viên', content: `${profileTop('ONBOARD')}${loading(3)}${loading(5)}` });
  if (tt === 'rong') {
    return shell({ title: 'Thuyền viên', content: `${profileTop('NONE')}<section class="panel" data-wf-block="5"><div class="ds-empty"><p class="ds-empty__title">Chưa có chuyến đi tàu nào</p><p class="ds-empty__text">Tạo chuyến khi đưa thuyền viên lên tàu: một chuyến đi kèm một hợp đồng MLC. Chuyến cũ lấy từ sổ thuyền viên khi tải sổ lên.</p><div class="ds-empty__action" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${btn('Tải sổ thuyền viên', { iconName: 'upload' })}${btn('Tạo chuyến tàu', { variant: 'primary', iconName: 'plus' })}</div></div></section>` });
  }
  if (tt === 'roi-tau') return shell({ title: 'Thuyền viên', content: `${profileTop('ASHORE')}${ashoreCard()}${pastTrips(PAST)}` });
  const t = TRIPS[tt];
  if (state.v === 'a') return shell({ title: 'Thuyền viên', content: `${profileTop(t.where)}${tripNow(t, tt)}${pastTrips(PAST)}` });

  // Phương án B: danh sách chuyến bên trái, chi tiết chuyến đang chọn bên phải
  const all = [{ vessel: t.vessel, on: t.on || `bay ${t.flight}`, off: t.on ? 'nay' : '', now: true, rank: 'Oiler', badgeHtml: badge('trip', t.trip) }, ...PAST.map((p) => ({ vessel: p.vessel, on: p.on, off: p.off, rank: p.rank.replace(/.*\((.*)\)/, '$1'), company: p.company }))];
  const list = `<section class="panel" data-wf-block="5"><div class="panel__head"><h2 class="panel__title">Chuyến <span class="ds-tabs-boxed__count">${all.length}</span></h2>${btn('', { size: 'sm', variant: 'ghost', iconName: 'plus', attrs: 'aria-label="Thêm chuyến cũ" style="width:32px;padding:0"' })}</div>

function receiveScreen() {
  const o = OWNERS[0];

  const rows = o.lines.map(([n, , , m, , w, f]) => { const need = w + f; const take = Math.min(need, Math.max(left, 0)); left -= take; return { n, m, need, take, rest: need - take }; });

  const sheet = `<div class="sheet-scrim"></div><aside class="sheet" role="dialog" aria-modal="true" data-wf-block="8"><div class="sheet__head"><div><h2 class="sheet__title">Nhận tiền</h2><p class="sheet__desc">Tiền chủ tàu chuyển về, trừ dần vào tháng cũ trước.</p></div>${btn('', { variant: 'ghost', size: 'sm', iconName: 'close', attrs: 'aria-label="Đóng" style="width:32px;padding:0"' })}</div>

      <div><p class="field-label" style="margin-bottom:8px">Trừ vào</p>${table}</div>
      <dl class="sumbox"><div><dt>Nhận</dt><dd>${usd(got)}</dd></div><div><dt>Đã trừ</dt><dd>${usd(used)}</dd></div>${short > 0 ? `<div data-tone="warn"><dt>Còn thiếu</dt><dd>${usd(short)}</dd></div>` : `<div><dt>Chờ trừ</dt><dd>${usd(spare)}</dd></div>`}</dl>

// ===== Mô hình 19/10: Chuyến tàu = một đợt đưa người lên một tàu, nhiều vị trí dự kiến, mỗi vị trí một budget.
// Từ mỗi vị trí tạo một hợp đồng; hợp đồng gộp hai thỏa thuận: chủ tàu ↔ môi giới (phải thu) và môi giới ↔ thuyền viên (phải chi).
ICONS.copy2 = ICONS.copy;
Object.assign(STATUS, { voy: { RECRUIT: ['Đang tuyển 4/7', 'warning', 'ellipsis'], EMPTY: ['Chưa có vị trí', 'neutral', 'ring'] } });
const VOY = { code: 'CT-2026-018', vessel: 'MV Lotus Pearl', imo: '9312456', owner: 'Lotus Shipping Pte. Ltd.', port: 'Singapore', on: '05/11/2026', off: '05/08/2027', months: 9, note: 'Thay ca 7 người. Chủ tàu cần đủ COC và hộ chiếu còn hạn trước 20/10/2026.' };
const POS = [
  { rank: 'Thuyền trưởng (Master)', budget: 9800 },
  { rank: 'Đại phó (Chief Officer)', budget: 7200, crew: 'Võ Thanh Sơn', st: 'DRAFT', chi: 6200 },
  { rank: 'Máy hai (2/E)', budget: 4400, crew: 'Đào Văn Hùng', st: 'SIGNED', chi: 3900 },
  { rank: 'Thợ máy chính (Oiler)', budget: 1900, crew: 'Trần Minh Khôi', st: 'SIGNED', chi: 1650 },
  { rank: 'Thủy thủ (AB)', budget: 1500 },
  { rank: 'Thủy thủ (AB)', budget: 1500 },
  { rank: 'Bếp (Cook)', budget: 1350, crew: 'Hoàng Thị Mai Trang', st: 'DRAFT', chi: 1100 },
];
const sumBy = (list, f) => list.reduce((s, x) => s + f(x), 0);
const voyCrumb = (last) => `<nav class="crumb-sm" aria-label="Đường dẫn"><a class="muted">Chuyến tàu</a>${icon('right')}${last ? `<a class="muted">${VOY.code}</a>${icon('right')}<span aria-current="page">${last}</span>` : `<span aria-current="page">${VOY.code}</span>`}</nav>`;

// ---------- Chi tiết chuyến: thông tin chung + bảng vị trí, nút Bắt đầu / Kết thúc ----------
function voyageScreen() {
  const tt = state.tt;
  if (tt === 'dang-tai') return shell({ title: 'Chuyến tàu', current: 'trips', content: `${voyCrumb()}${loading(3)}${loading(6)}` });
  const phase = { 'tre-ngay': 'late', 'bat-dau': 'late', 'tren-tau': 'on', 'ket-thuc': 'on', 'da-ket-thuc': 'end' }[tt] || 'pre';
  const started = phase === 'on' || phase === 'end';
  const V = phase === 'pre' ? VOY : VOY_LATE;
  const list = phase === 'pre' ? POS : POS_FULL;
  const crewSt = (p) => (phase === 'on' && p.st === 'ACTIVE' ? 'ONBOARD' : 'ASHORE');
  const filled = list.filter((p) => p.crew);
  const skip = filled.filter((p) => p.st !== 'ACTIVE');
  const thu = sumBy(filled, (p) => p.budget), chi = sumBy(filled, (p) => p.chi);
  const more = btn('', { iconName: 'more', attrs: 'aria-label="Thao tác khác" style="width:40px;padding:0"' });
  const actions = {
    pre: `${more}${btn('Sửa chuyến', { iconName: 'edit' })}${btn('Bắt đầu chuyến', { variant: 'primary', iconName: 'anchor' })}`,
    late: `${more}${btn('Sửa chuyến', { iconName: 'edit' })}${btn('Bắt đầu chuyến', { variant: 'primary', iconName: 'anchor', attrs: 'data-wf-hot' })}`,
    on: `${more}${btn('Sửa chuyến', { iconName: 'edit' })}${btn('Kết thúc chuyến', { variant: 'primary', iconName: 'check' })}`,
    end: `${more}${btn('Sửa chuyến', { iconName: 'edit' })}`,
  }[phase];
  const vBadge = tt === 'rong' ? badge('voy', 'EMPTY') : badge('voy', { pre: 'RECRUITING', late: 'FULL', on: 'ONBOARD', end: 'ENDED' }[phase]);
  const head = `${voyCrumb()}<div class="page-head" data-wf-block="3"><div class="person" style="gap:16px"><span class="stat__icon" style="width:48px;height:48px;font-size:22px;border-radius:12px">${icon('ship')}</span><div class="page-head__text"><h1 class="page-head__title">${V.vessel} · ${V.code}</h1><p class="page-head__desc">${V.owner} · ${V.port} → ${V.portOff}</p><div class="head-badges">${vBadge}${phase === 'late' ? dueTag('late', 'Quá ngày xuống tàu dự kiến 4 ngày') : ''}</div></div></div>
    <div class="page-head__actions">${actions}</div></div>`;
  let alert = '';
  if (phase === 'late') alert = bannerBox('warning', 'clock-circle', 'Quá ngày xuống tàu dự kiến 4 ngày', `<p class="ds-banner__text">Dự kiến xuống tàu ${V.on} nhưng chuyến chưa bắt đầu. Thuyền viên đã lên tàu thì bấm Bắt đầu chuyến để ghi ngày và nơi xuống tàu thực tế.</p>`);
  if (phase === 'on' && skip.length) alert = bannerBox('warning', 'exclamation-circle', `${skip.length} hợp đồng chưa hiệu lực`, `<p class="ds-banner__text">${skip.map((p) => p.crew).join(', ')} vẫn ở trạng thái Ở bờ. Khi duyệt hợp đồng, hộp thoại sẽ hỏi có chuyển người đó sang Đang trên tàu không.</p>`);
  const dt = (label, main, sub) => `<div><dt>${label}</dt><dd>${main}<span>${sub}</span></dd></div>`;
  const info = `<section class="panel" data-wf-block="4"><div class="panel__body"><dl class="terms" style="border-top:0;padding-top:0">
    ${dt('Xuống tàu', started ? V.actualOn : V.on, started ? `Thực tế · dự kiến ${V.on}` : phase === 'late' ? '<span class="err-text">Dự kiến · đã quá 4 ngày</span>' : 'Dự kiến')}
    ${dt('Nơi xuống tàu', V.port, started ? 'Thực tế' : 'Dự kiến')}
    ${dt('Rời tàu', phase === 'end' ? V.actualOff : V.off, phase === 'end' ? `Thực tế · dự kiến ${V.off}` : `Dự kiến · ${V.months} tháng`)}
    ${dt('Nơi rời tàu', V.portOff, phase === 'end' ? 'Thực tế' : 'Dự kiến')}</dl>
    <p class="voy-note"><span>Chủ tàu · ghi chú</span>${V.owner} (IMO ${V.imo}). ${V.note}</p></div></section>`;
  if (tt === 'rong') {
    return shell({ title: 'Chuyến tàu', current: 'trips', content: `${head}${info}<section class="panel" data-wf-block="6"><div class="ds-empty"><p class="ds-empty__title">Chuyến chưa có vị trí nào</p><p class="ds-empty__text">Thêm các vị trí cần người cho tàu, mỗi vị trí một budget dự kiến. Sau đó tạo hợp đồng cho từng vị trí.</p><div class="ds-empty__action">${btn('Thêm vị trí', { variant: 'primary', iconName: 'plus' })}</div></div></section>` });
  }
  const n = (st) => filled.filter((p) => p.st === st).length;
  const blank = list.length - filled.length;
  const stats = `<div class="stats" data-wf-block="5">
    <div class="stat"><span class="stat__icon">${icon('wallet')}</span><span class="stat__label">Budget dự kiến</span><p class="stat__value">${usd0(sumBy(list, (p) => p.budget) * V.months)} <small>USD</small></p><span class="stat__sub">${usd0(sumBy(list, (p) => p.budget))} USD/tháng · ${list.length} vị trí · ${V.months} tháng</span></div>
    <div class="stat"><span class="stat__icon">${icon('file-text')}</span><span class="stat__label">Hợp đồng</span><p class="stat__value">${filled.length}<small> / ${list.length}</small></p><span class="stat__sub">${n('ACTIVE')} hiệu lực · ${n('PENDING')} chờ duyệt · ${n('DRAFT') + n('REJECTED')} cần sửa${blank ? ` · <span class="warn-text">${blank} trống</span>` : ''}</span></div>
    <div class="stat"><span class="stat__icon">${icon('banknote')}</span><span class="stat__label">Chênh lệch dự kiến</span><p class="stat__value">${usd0(thu - chi)} <small>USD/tháng</small></p><span class="stat__sub">${usd0((thu - chi) * V.months)} USD cả chuyến · từ ${filled.length} hợp đồng</span></div></div>`;
  const rows = list.map((p, i) => {
    const diff = p.crew ? p.budget - p.chi : null;
    return `<tr><td class="num muted" style="width:44px">${i + 1}</td><td><span class="cell2"><span class="cell2__main">${p.rank}</span></span></td><td class="right num">${usd0(p.budget * V.months)}</td><td class="right num muted">${usd0(p.budget)}</td>
      <td>${p.crew ? `<span class="cell2"><span class="cell2__main" style="font-weight:400">${p.crew}</span><span class="cell2__sub">${tinyBadge('contract', p.st)}</span></span>` : '<span class="muted">Chưa có người</span>'}</td>
      <td>${p.crew ? tinyBadge('crew', crewSt(p)) : ''}</td>
      <td class="right num">${p.crew ? usd0(p.chi) : '—'}</td><td class="right num">${diff !== null ? `<b>+${usd0(diff)}</b><span class="cell2__sub" style="display:block">${Math.round((diff / p.budget) * 100)}%</span>` : '—'}</td>
      <td class="right">${p.crew ? btn('Mở hợp đồng', { size: 'sm', variant: 'ghost' }) : btn('Tạo hợp đồng', { size: 'sm', iconName: 'plus', attrs: i === 0 ? 'data-wf-hot' : '' })}</td></tr>`;
  }).join('');
  const table = `<section class="ds-card" data-wf-block="6" style="border-radius:16px"><div class="ds-toolbar"><h2 class="panel__title" style="margin-right:auto">Vị trí dự kiến <span class="ds-tabs-boxed__count">${list.length}</span></h2>${phase === 'end' ? '' : btn('Thêm vị trí', { size: 'sm', variant: 'ghost', iconName: 'plus' })}</div>
    <div class="tbl-scroll"><table class="tbl tbl--compact pos-tbl" style="min-width:1080px"><thead><tr><th rowspan="2">#</th><th rowspan="2">Vị trí</th><th colspan="2" class="right th-group">Budget dự kiến (USD)</th><th rowspan="2">Thuyền viên · hợp đồng</th><th rowspan="2">Trạng thái</th><th rowspan="2" class="right">Phải chi (USD/tháng)</th><th rowspan="2" class="right">Chênh lệch</th><th rowspan="2"></th></tr><tr><th class="right th-sub">Tổng chuyến</th><th class="right th-sub">Mỗi tháng</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="ds-table-foot"><span>Trạng thái thuyền viên đổi khi bấm Bắt đầu chuyến và Kết thúc chuyến, chỉ với người có hợp đồng Hiệu lực.</span><span class="num">Phải thu ${usd0(thu)} · phải chi ${usd0(chi)} · chênh lệch ${usd0(thu - chi)} USD/tháng</span></div></section>`;
  const overlay = tt === 'bat-dau' ? voyModal('start', V, filled) : tt === 'ket-thuc' ? voyModal('end', V, filled) : '';
  return shell({ title: 'Chuyến tàu', current: 'trips', content: `${head}${alert}${info}${stats}${table}`, overlay });
}

// Hộp thoại Bắt đầu / Kết thúc: ngày + nơi (bắt buộc), danh sách người sẽ đổi trạng thái, cảnh báo hợp đồng chưa hiệu lực.
function voyModal(kind, V, filled) {
  const start = kind === 'start';
  const official = filled.filter((p) => p.st === 'ACTIVE');
  const skip = filled.filter((p) => p.st !== 'ACTIVE');
  const fields = start
    ? `${fld('Ngày xuống tàu thực tế', date(V.on), { c: 'sf-c6', req: true, hint: 'Mặc định: ngày dự kiến' })}${fld('Nơi xuống tàu', sel(V.port), { c: 'sf-c6', req: true, hint: 'Mặc định: nơi đã nhập ở chuyến' })}`
    : `${fld('Ngày rời tàu thực tế', date(''), { c: 'sf-c6', req: true, hint: `Dự kiến ${V.off}` })}${fld('Nơi rời tàu', sel(V.portOff), { c: 'sf-c6', req: true, hint: 'Mặc định: nơi đã nhập ở chuyến' })}`;
  const to = start ? 'ONBOARD' : 'ASHORE';
  const people = `<div class="mlist"><p class="mlist__head">${start ? 'Chuyển sang Đang trên tàu' : 'Chuyển sang Ở bờ'}<span class="ds-tabs-boxed__count">${official.length}</span></p>${official.map((p) => `<div class="mlist__row"><span class="mlist__who"><b>${p.crew}</b><small>${short(p.rank)} · hợp đồng hiệu lực</small></span><span class="mlist__to">${tinyBadge('crew', start ? 'ASHORE' : 'ONBOARD')}${icon('right')}${tinyBadge('crew', to)}</span></div>`).join('')}</div>`;
  const warn = skip.length ? bannerBox('warning', 'exclamation-circle', `${skip.length} người có hợp đồng chưa hiệu lực, giữ nguyên trạng thái`, `<ul>${skip.map((p) => `<li>${p.crew} · ${short(p.rank)} · ${STATUS.contract[p.st][0]}</li>`).join('')}</ul>`) : '';
  return `<div class="modal-scrim"><div class="modal modal--wide" role="dialog" aria-modal="true" data-wf-block="8"><div class="modal__head"><div><h2 class="modal__title">${start ? 'Bắt đầu' : 'Kết thúc'} chuyến ${V.code}?</h2><p class="modal__desc">${start ? 'Ghi ngày và nơi xuống tàu thực tế. Chuyến chuyển sang Đang trên tàu.' : 'Ghi ngày và nơi rời tàu thực tế. Chuyến chuyển sang Đã kết thúc.'}</p></div>${btn('', { variant: 'ghost', size: 'sm', iconName: 'close', attrs: 'aria-label="Đóng" style="width:32px;padding:0"' })}</div>
    <div class="modal__body"><div class="sf-grid">${fields}</div>${people}${warn}</div>
    <div class="modal__foot">${btn('Huỷ')}${btn(start ? 'Bắt đầu chuyến' : 'Kết thúc chuyến', { variant: 'primary' })}</div></div></div>`;
}

  const aside = `<aside class="sf-aside" data-wf-block="4"><div class="sf-who"><span class="photo" style="width:56px;height:56px;align-items:center;font-size:24px;color:#1a4775">${icon('ship')}</span><div class="sf-who__text"><p class="sf-who__name">${empty || errs ? 'Chuyến tàu mới' : V.vessel}</p><p class="sf-who__sub">${empty || errs ? 'Chưa chọn tàu' : edit ? `${V.code} · đang trên tàu` : V.owner}</p></div></div>

  const c = edit ? 'sf-c4' : 'sf-c6';
  const p1 = `<section class="sf-panel" data-wf-block="5"><div class="sf-panel__head"><span class="sf-step">1</span><div><h2 class="sf-panel__title">Thông tin chung</h2><p class="sf-panel__desc">${edit ? 'Ngày thực tế được ghi khi bấm Bắt đầu chuyến và Kết thúc chuyến. Sửa ở đây khi nhập sai.' : 'Dùng chung cho mọi vị trí của chuyến. Hợp đồng lấy ngày ở đây làm mặc định.'}</p></div></div><div class="sf-panel__body"><div class="sf-grid">
    ${fld('Tàu', sel(v(`${V.vessel} · IMO ${V.imo}`), { ph: 'Tìm tên tàu hoặc số IMO', err: errs }), { c: 'sf-c6', req: true, err: errs ? 'Chọn tàu' : '' })}
    ${fld('Chủ tàu', sel(v(V.owner), { ph: 'Tự điền khi chọn tàu' }), { c: 'sf-c6', hint: 'Lấy theo tàu' })}
    ${fld('Ngày xuống tàu dự kiến', date(v(V.on), { err: errs }), { c, req: true, err: errs ? 'Nhập ngày xuống tàu dự kiến' : '' })}
    ${edit ? fld('Ngày xuống tàu thực tế', date(V.actualOn), { c, hint: 'Ghi khi bấm Bắt đầu chuyến' }) : ''}
    ${fld('Nơi xuống tàu', sel(v(V.port), { ph: 'Chọn cảng' }), { c })}
    ${fld('Ngày rời tàu dự kiến', date(v(V.off)), { c, req: true, hint: empty || errs ? '' : `${V.months} tháng` })}
    ${edit ? fld('Ngày rời tàu thực tế', date(''), { c, hint: 'Ghi khi bấm Kết thúc chuyến' }) : ''}
    ${fld('Nơi rời tàu', sel(v(V.portOff), { ph: 'Chọn cảng' }), { c })}
    ${fld('Ghi chú', `<textarea class="input" style="height:72px;padding-top:10px;resize:vertical" placeholder="Yêu cầu của chủ tàu, lịch bay…">${v(V.note)}</textarea>`, { c: 'sf-c12' })}</div></div></section>`;
  const editRows = rows.map((r, i) => `<tr><td class="num muted" style="width:40px;padding-left:20px">${i + 1}</td><td>${sel(r.rank, { ph: 'Chọn chức danh', err: errs && i === 0 })}${errs && i === 0 ? '<p class="sf-err">Chọn chức danh</p>' : ''}</td><td style="width:200px"><div class="input-wrap"><input class="input num ${errs && i === 0 ? 'input--error' : ''}" value="${r.total}" placeholder="0" /><span class="input-wrap__suffix">USD</span></div></td><td style="width:180px;padding-right:16px"><div class="input-wrap"><input class="input num" value="${r.month}" placeholder="0" aria-label="Budget mỗi tháng" /><span class="input-wrap__suffix">USD</span></div></td>
    <td style="width:96px;padding-right:12px;white-space:nowrap">${btn('', { variant: 'ghost', size: 'sm', iconName: 'copy', attrs: 'aria-label="Nhân đôi dòng" title="Nhân đôi" style="width:32px;padding:0"' })}${btn('', { variant: 'ghost', size: 'sm', iconName: 'close', attrs: 'aria-label="Xoá dòng" title="Xoá" style="width:32px;padding:0"' })}</td></tr>`).join('');
  const total = empty || errs ? 0 : sumBy(edit ? POS_FULL : POS, (p) => p.budget);
  const p2 = `<section class="sf-panel" data-wf-block="6"><div class="sf-panel__head"><span class="sf-step">2</span><div style="flex:1 1 220px;min-width:0"><h2 class="sf-panel__title">Vị trí dự kiến</h2><p class="sf-panel__desc">Budget dự kiến là số chủ tàu sẵn sàng trả cho mỗi chỗ. Nhập tổng chuyến hoặc mỗi tháng, ô kia tự tính theo số tháng của chuyến. Cần 2 AB thì thêm 2 dòng.</p></div><span class="sf-panel__meta">${rows.length} vị trí</span></div>
    <div class="sf-panel__body" style="padding-left:0;padding-right:0"><div class="tbl-scroll"><table class="pos-edit"><thead><tr><th rowspan="2" style="padding-left:20px">#</th><th rowspan="2">Chức danh<span class="sf-req">*</span></th><th colspan="2" class="th-group">Budget dự kiến (USD)<span class="sf-req">*</span></th><th rowspan="2"></th></tr><tr><th class="th-sub">Tổng chuyến</th><th class="th-sub" style="padding-right:16px">Mỗi tháng</th></tr></thead><tbody>${editRows}</tbody></table></div>
    <div style="display:grid;gap:12px;padding:12px 24px 0"><button type="button" class="sf-add">${icon('plus')}Thêm vị trí</button><div class="total-row"><span>${rows.length} vị trí · budget dự kiến${empty || errs ? '' : ` · ${V.months} tháng`}</span><b>${usd0(total * V.months)} USD · ${usd0(total)} USD/tháng</b></div></div></div></section>`;
  const msg = errs ? 'Còn 3 ô bắt buộc chưa điền: Tàu, Ngày xuống tàu dự kiến, Chức danh dòng 1.' : edit ? 'Chưa có thay đổi.' : 'Lưu xong sang trang chuyến để tạo hợp đồng cho từng vị trí.';
  const buttons = edit ? `${btn('Huỷ')}${btn('Lưu thay đổi', { variant: 'primary', attrs: 'disabled' })}` : `${btn('Huỷ')}${btn('Lưu & tạo chuyến khác')}${btn('Tạo chuyến tàu', { variant: 'primary' })}`;
  const bar = `<div class="sf-savebar" data-wf-block="7"><p class="sf-savebar__msg ${errs ? 'sf-savebar__msg--err' : ''}">${icon('exclamation-circle')}${msg}</p><div class="sf-savebar__actions">${buttons}</div></div>`;
  const head = edit
    ? `<div data-wf-block="3">${voyCrumb('Sửa chuyến')}<h1 class="sf-head__title">Sửa chuyến tàu</h1><p class="sf-head__desc">${V.vessel} · ${V.code} · đang trên tàu từ ${V.actualOn}</p></div>`
    : `<div data-wf-block="3"><nav class="crumb-sm"><a class="muted">Chuyến tàu</a>${icon('right')}<span aria-current="page">Tạo chuyến tàu</span></nav><h1 class="sf-head__title">Tạo chuyến tàu</h1><p class="sf-head__desc">Thông tin chung của chuyến và các vị trí cần người. Hợp đồng tạo sau, từ từng vị trí.</p></div>`;
  return shell({ title: 'Chuyến tàu', current: 'trips', content: `${head}<div class="sf-layout">${aside}<div class="sf-sections">${p1}${p2}${bar}</div></div>` });
}

// ---------- Tạo hợp đồng: thông tin chung trên, hai bên dưới ----------
function contractScreen() {
  const tt = state.tt;
  const loss = tt === 'am', errs = tt === 'loi-nhap';
  const pos = POS[3];
  const leftM = [['Lương cơ bản', 1150], ['Làm thêm cố định', 345], ['Lương phép', 230], ['Phụ cấp', 75], ['Phí dịch vụ', 100]];
  const rightM = [['Lương cơ bản', loss ? 1400 : 1050], ['Làm thêm cố định', 315], ['Lương phép', 210], ['Phụ cấp', 75]];
  const leftO = [['Vé máy bay đi', 650], ['Vé máy bay về', 0], ['Phí visa', 120], ['Khám sức khoẻ', 80]];
  const rightO = [['Thưởng hoàn thành hợp đồng', 300]];
  const thu = sumBy(leftM, (r) => r[1]), chi = sumBy(rightM, (r) => r[1]), diff = thu - chi;
  const onceThu = sumBy(leftO, (r) => r[1]), onceChi = sumBy(rightO, (r) => r[1]);
  const amt = (k, v) => `<input class="input num" value="${v ? usd(v) : ''}" placeholder="0,00" aria-label="Số tiền ${k}" />`;
  const fixedRows = (list) => list.map(([k, v]) => `<tr><td class="deal__label">${k}</td><td style="width:160px">${amt(k, v)}</td></tr>`).join('');
  const part = (title, unit, rowsHtml, addLabel, emptyText) => `<div class="deal__part"><div class="deal__part-head"><span>${title}</span><span>${unit}</span></div>
    <table class="deal__tbl"><tbody>${rowsHtml || `<tr><td colspan="2" class="deal__empty">${emptyText}</td></tr>`}</tbody></table>
    <div style="padding:8px 16px 14px"><button type="button" class="sf-add">${icon('plus')}${addLabel}</button></div></div>`;
  const side = (kind, title, sub, mRows, oRows, foot, block, oEmpty) => `<section class="deal__side" data-wf-block="${block}"><div class="deal__head"><div style="min-width:0"><span class="deal__tag deal__tag--${kind}">${kind === 'in' ? 'Phải thu' : 'Phải chi'}</span><h2 class="deal__title">${title}</h2><p class="deal__sub">${sub}</p></div></div>
    ${part('Hằng tháng', 'USD/tháng', fixedRows(mRows), 'Thêm khoản hằng tháng', '')}
    ${part('Một lần', 'USD', fixedRows(oRows), 'Thêm khoản một lần', oEmpty)}
    <div class="deal__foot">${foot}</div></section>`;
  const gapThu = thu - pos.budget, roomChi = pos.budget - chi;
  const strip = `<section class="bstrip" data-wf-block="8" aria-label="Cân đối với budget dự kiến"><div class="bstrip__head"><b>Cân đối với budget dự kiến</b><span>${pos.rank} · dòng 4 của chuyến ${VOY.code}</span></div><div class="bstrip__items">
    <div class="bstrip__item"><span>Budget dự kiến</span><b>${usd(pos.budget)}<small> USD/tháng</small></b><small>${usd0(pos.budget * VOY.months)} USD tổng chuyến</small></div>
    <div class="bstrip__item"><span>Phải thu</span><b>${usd(thu)}<small> USD/tháng</small></b><small class="${gapThu === 0 ? 'ok-text' : 'warn-text'}">${gapThu === 0 ? `${icon('check-circle')} Bằng budget dự kiến` : gapThu > 0 ? `Cao hơn budget ${usd(gapThu)}` : `Thấp hơn budget ${usd(-gapThu)}`}</small></div>
    <div class="bstrip__item"><span>Phải chi</span><b>${usd(chi)}<small> USD/tháng</small></b><small class="${roomChi >= 0 ? '' : 'err-text'}">${roomChi >= 0 ? `Dùng ${Math.round((chi / pos.budget) * 100)}% budget, còn ${usd(roomChi)}` : `Vượt budget ${usd(-roomChi)}`}</small></div>
  </div></section>`;
  const leftFoot = `<div class="deal__total"><span>Phải thu mỗi tháng</span><b>${usd(thu)}</b></div><div class="deal__total deal__total--sub"><span>Phải thu một lần</span><b>${usd(onceThu)}</b></div><div class="deal__note"><span></span><span>Nội bộ, không in lên hợp đồng</span></div>`;
  const rightFoot = `<div class="deal__total"><span>Phải chi mỗi tháng</span><b>${usd(chi)}</b></div><div class="deal__total deal__total--sub"><span>Phải chi một lần</span><b>${usd(onceChi)}</b></div><div class="deal__note"><span></span><span>Hằng tháng in lên hợp đồng MLC</span></div>`;
  const general = `<section class="sf-panel" data-wf-block="4"><div class="sf-panel__head"><div><h2 class="sf-panel__title">Thông tin chung</h2><p class="sf-panel__desc">${VOY.vessel} · ${VOY.owner} · chuyến ${VOY.code}</p></div></div><div class="sf-panel__body"><div class="sf-grid">
    ${fld('Thuyền viên', sel(errs ? '' : `${CREW.name} · ${CREW.code}`, { ph: 'Tìm tên, mã hoặc số hộ chiếu', err: errs }), { c: 'sf-c6', req: true, err: errs ? 'Chọn thuyền viên' : '', hint: errs ? '' : 'Ở bờ từ 02/03/2026 · giấy tờ còn hạn tới hết hợp đồng' })}
    ${fld('Vị trí', sel(pos.rank), { c: 'sf-c6', req: true, hint: 'Dòng 4 của chuyến' })}
    ${fld('Ngày bắt đầu', date(VOY.on), { c: 'sf-c3', req: true, hint: 'Mặc định: xuống tàu dự kiến' })}
    ${fld('Ngày kết thúc', date(errs ? '' : VOY.off, { err: errs }), { c: 'sf-c3', req: true, err: errs ? 'Nhập ngày kết thúc' : '', hint: errs ? '' : `${VOY.months} tháng` })}
    ${fld('Ghi chú', `<textarea class="input" style="height:40px;padding-top:9px;resize:vertical" placeholder="Ghi chú cho hợp đồng này"></textarea>`, { c: 'sf-c6' })}</div></div></section>`;
  const mKeys = ['Lương cơ bản', 'Làm thêm cố định', 'Lương phép', 'Phụ cấp', 'Thưởng', 'Phí dịch vụ'];
  const oKeys = ['Vé máy bay đi', 'Vé máy bay về', 'Phí visa', 'Khám sức khoẻ', 'Huấn luyện/chứng chỉ', 'Thưởng hoàn thành hợp đồng'];
  const offRight = new Set(['Phí dịch vụ']);
  const val = (list, k) => (list.find((r) => r[0] === k) || [k, 0])[1];
  const cell = (v, label, off) => `<td class="dg__cell">${off ? `<input class="input" disabled placeholder="Không áp dụng" aria-label="${label}" />` : `<input class="input num" value="${v ? usd(v) : ''}" placeholder="0,00" aria-label="${label}" />`}</td>`;
  const group = (title, unit, keys, L, R, addLabel) => `<tr class="dg__group"><th scope="rowgroup" colspan="3">${title}<span>${unit}</span></th></tr>${keys.map((k) => `<tr><th scope="row" class="dg__label">${k}</th>${cell(val(L, k), `Phải thu: ${k}`)}${cell(val(R, k), `Phải chi: ${k}`)}</tr>`).join('')}<tr><td class="dg__addrow" colspan="3"><button type="button" class="dg__add">${icon('plus')}${addLabel}</button></td></tr>`;
  const deal = `<section class="dg" data-wf-block="5"><div class="tbl-scroll"><table class="dg__tbl"><colgroup><col style="width:24%" /><col style="width:38%" /><col style="width:38%" /></colgroup>
    <thead><tr><th class="dg__corner">Khoản</th><th><span class="dg__head"><span class="deal__tag deal__tag--in">Phải thu</span><b>${VOY.owner}</b></span></th><th><span class="dg__head"><span class="deal__tag deal__tag--out">Phải chi</span><b>${errs ? 'Thuyền viên' : CREW.name}</b></span></th></tr></thead>
    <tbody>${group('Hằng tháng', 'USD/tháng', mKeys, leftM, rightM, 'Thêm khoản hằng tháng')}${group('Một lần', 'USD', oKeys, leftO, rightO, 'Thêm khoản một lần')}</tbody>
    <tfoot><tr class="dg__total"><th scope="row">Tổng mỗi tháng</th><td>${usd(thu)}</td><td>${usd(chi)}</td></tr><tr class="dg__total dg__total--sub"><th scope="row">Tổng một lần</th><td>${usd(onceThu)}</td><td>${usd(onceChi)}</td></tr></tfoot></table></div></section>`;
  const mark = (ok, tone) => (ok ? `<span class="cbar__mark cbar__mark--ok" title="Không vượt budget dự kiến">${icon('check-circle')}</span>` : `<span class="cbar__mark cbar__mark--${tone}" title="Vượt budget dự kiến">${icon('exclamation-circle')}</span>`);
  const DAYS = ['Ngày 1', 'Ngày 5', 'Ngày 10', 'Ngày 15', 'Ngày 20', 'Ngày 25', 'Cuối tháng'];
  const payMenu = `<div class="dd" role="listbox" aria-label="Ngày thanh toán">${[['Tháng sau', 'tháng sau'], ['Sau 2 tháng', 'sau 2 tháng'], ['Sau 3 tháng', 'sau 3 tháng']].map(([g, suffix]) => `<p class="dd__group">${g}</p>${DAYS.map((d) => { const on = g === 'Tháng sau' && d === 'Ngày 10'; return `<button type="button" class="dd__item" role="option" aria-selected="${on}">${d === 'Cuối tháng' ? (suffix === 'tháng sau' ? 'Cuối tháng sau' : `Cuối tháng, ${suffix}`) : `${d} ${suffix}`}${on ? icon('check') : ''}</button>`; }).join('')}`).join('')}</div>`;
  const pickCell = (value, menu = '') => `<td class="dg__cell"><div style="position:relative">${sel(value)}${menu}</div></td>`;
  const termRow = (label, l, r, menu = '') => `<tr><th scope="row" class="dg__label">${label}</th>${pickCell(l, menu)}${pickCell(r)}</tr>`;
  const pay = `<section class="dg dg--terms" data-wf-block="6"><div class="tbl-scroll" style="overflow:visible"><table class="dg__tbl"><colgroup><col style="width:24%" /><col style="width:38%" /><col style="width:38%" /></colgroup>
    <thead><tr><th class="dg__corner">Mục</th><th><span class="dg__head"><span class="deal__tag deal__tag--in">Phải thu</span><b>${VOY.owner}</b></span></th><th><span class="dg__head"><span class="deal__tag deal__tag--out">Phải chi</span><b>${errs ? 'Thuyền viên' : CREW.name}</b></span></th></tr></thead>
    <tbody><tr class="dg__group"><th scope="rowgroup" colspan="3">Kỳ thanh toán<span>chốt sổ, ngày trả tiền</span></th></tr>

  const fig = (label, value, ok, tone, hint) => `<div class="cbar__fig" title="${hint}"><span class="cbar__label">${label}</span><b class="cbar__value ${ok ? '' : tone}">${mark(ok, tone)}${value} <small>USD</small></b></div>`;
  const bar = `<div class="cbar" data-wf-block="7"><div class="cbar__budget" title="${usd0(pos.budget * VOY.months)} USD cả chuyến"><span class="cbar__label">Budget dự kiến/tháng</span><b>${usd0(pos.budget)} <small>USD</small></b></div>
    <div class="cbar__figs">
    ${fig('Phải thu/tháng', usd0(thu), thu <= pos.budget, 'warn', gapThu === 0 ? 'Bằng budget' : gapThu < 0 ? `Thấp hơn budget ${usd0(-gapThu)}` : `Cao hơn budget ${usd0(gapThu)}`)}
    ${fig('Phải chi/tháng', usd0(chi), chi <= pos.budget, 'neg', chi <= pos.budget ? `${Math.round((chi / pos.budget) * 100)}% budget` : `Vượt budget ${usd0(chi - pos.budget)}`)}
