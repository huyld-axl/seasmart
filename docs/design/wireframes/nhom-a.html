<style>
  /* Wireframe nhóm A của MCAH (skill ui-ux, nhánh U, bước U3). Một theme sáng có chủ ý, như app.
     Token chép từ frontend/src/theme/tokens.js; component dùng chung class với frontend/src/components/ds/ds.css. */
  :root {
    color-scheme: light;
    --primary: #003366;
    --primary-hover: #1a4775;
    --primary-foreground: #ffffff;
    --primary-light: rgba(0, 51, 102, 0.06);
    --background: #f4f4f6;
    --surface: #ffffff;
    --foreground: #2c2c2c;
    --muted: #707070;
    --border: #f7f7f8;
    --border-strong: #eaeaea;
    --secondary: #e7e8ec;
    --secondary-hover: #dbdce2;
    --item-hover: #f4f4f6;
    --surface-hover: #f8f8fa;
    --button-hover: #f1f1f3;
    --ring-focus: rgba(0, 51, 102, 0.1);
    --border-focus: #003366;
    --neutral: #52525c;
    --neutral-bg: #f4f4f5;
    --success: #007a55;
    --success-bg: #ecfdf5;
    --warning: #bb4d00;
    --warning-bg: #fffbeb;
    --warning-border: #fee685;
    --error-strong: #c10007;
    --error-bg: #fef2f2;
    --error-border: #ffc9c9;
    --error: #fb2c36;
    --error-text: #e7000b;
    --danger: #c70036;
    --danger-bg: rgba(255, 32, 86, 0.1);
    --danger-bg-hover: rgba(255, 32, 86, 0.15);
    --app-font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --elevation-popover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --elevation-modal: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --legacy-none: 0;
  }
  /* Nấc Xám: tắt màu nhấn và màu trạng thái, còn lại giữ nguyên token (U3). */
  :root[data-mau="xam"] {
    --primary: #2c2c2c; --primary-hover: #474747; --primary-light: rgba(44, 44, 44, 0.05);
    --ring-focus: rgba(44, 44, 44, 0.1); --border-focus: #2c2c2c;
    --success: #52525c; --success-bg: #f4f4f5; --warning: #52525c; --warning-bg: #f4f4f5; --warning-border: #e4e4e7;
    --error-strong: #52525c; --error-bg: #f4f4f5; --error-border: #e4e4e7; --error-text: #52525c; --danger: #52525c; --danger-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--app-font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: none; }

  /* Component riêng của MCAH. Dự án không dùng Tailwind: class của skill dịch sang CSS thuần, màu lấy biến
   token (src/theme/tokens.js). Không mã màu nào ngoài biến, trừ lớp phủ theo màu chữ. */

.ds-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.ds-link {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--foreground);
  font: inherit;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ---------- Badge trạng thái (M7) ---------- */
.ds-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.05);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
}
.ds-badge--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-badge--success { background: var(--success-bg); color: var(--success); }
.ds-badge--warning { background: var(--warning-bg); color: var(--warning); }
.ds-badge--error { background: var(--error-bg); color: var(--error-strong); }
.ds-badge__icon { font-size: 13px; }
.ds-badge__dot { flex-shrink: 0; width: 10px; height: 10px; border-radius: 9999px; }
.ds-badge__dot--ring { border: 1.5px solid currentColor; }
.ds-badge__dot--ring-dot { border: 1.5px solid currentColor; background: radial-gradient(currentColor 0 2px, transparent 2.5px); }

/* ---------- Ô trường duyệt ---------- */
.ds-field {
  display: grid;
  gap: 8px;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.ds-field--active { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-field__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.ds-field__label { color: var(--muted); font-size: 12px; font-weight: 500; }
.ds-field__required { margin-left: 2px; color: var(--error-text); }
.ds-field__value { margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-field__value--unknown { color: var(--muted); font-style: italic; font-weight: 400; }
.ds-field__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.ds-field__badges { display: flex; flex-wrap: wrap; gap: 6px; }
.ds-field__actions { display: flex; flex-wrap: wrap; gap: 2px; }
.ds-field__reason { margin: 0; color: var(--muted); font-size: 12px; }

.ds-chip-page {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: var(--foreground);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.ds-chip-page:hover { background: rgb(44 44 44 / 0.1); }

/* ---------- Khung xem tài liệu ---------- */
.ds-viewer {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.ds-viewer__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  min-height: 56px;
  padding: 8px 12px 8px 20px;
  border-bottom: 1px solid var(--border-strong);
}
.ds-viewer__name { flex: 1 1 200px; min-width: 0; margin: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-viewer__tools { display: flex; flex-shrink: 0; align-items: center; gap: 2px; }
.ds-viewer__count { min-width: 44px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.ds-viewer__divider { width: 1px; height: 20px; margin: 0 6px; background: var(--border-strong); }
.ds-viewer__evidence { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--border); background: var(--primary-light); color: var(--foreground); font-size: 12px; }
.ds-viewer__stage { display: grid; place-items: start center; min-height: 320px; padding: 24px; overflow: auto; background: var(--background); }

.ds-sample-page {
  width: 100%;
  min-width: 480px; /* trang tài liệu không co chữ theo màn: hẹp thì cuộn như ảnh */
  max-width: 520px;
  padding: 24px;
  border-radius: 4px;
  background: #fbfaf6; /* giấy sổ, chỉ trong trang mẫu */
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  color: #3b3b3b;
  font-family: 'Courier New', ui-monospace, monospace;
  font-size: 12px;
}
.ds-sample-page__title { margin: 0 0 12px; font-weight: 700; letter-spacing: 0.04em; }
.ds-sample-page table { width: 100%; border-collapse: collapse; }
.ds-sample-page th, .ds-sample-page td { padding: 6px; border: 1px solid #c9c4b5; text-align: left; }
.ds-sample-page td { font-family: 'Segoe Script', 'Brush Script MT', cursive; font-size: 13px; }
.ds-sample-page__stamp { margin: 16px 0 0; color: #5f5a4e; text-align: right; }

/* ---------- Khung kéo thả tệp ---------- */
.ds-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--background) 60%, transparent);
  text-align: center;
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-drop:hover { background: var(--item-hover); }
.ds-drop__title { color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-drop__hint { margin-top: 4px; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-drop__button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin-top: 16px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
}
@media (hover: none) { .ds-drop__title { display: none; } }

.ds-files { margin: 16px 0 0; padding: 0; list-style: none; }
.ds-files__row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.ds-files__row:first-child { border-top: 0; }
.ds-files__icon { flex-shrink: 0; color: var(--muted); font-size: 18px; }
.ds-files__body { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; gap: 6px; min-width: 0; }
.ds-files__line { display: flex; align-items: baseline; gap: 12px; }
.ds-files__name { display: flex; flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-files__head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-files__tail { flex-shrink: 0; white-space: nowrap; }
.ds-files__percent { flex-shrink: 0; margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.ds-files__meta { margin: 0; color: var(--muted); font-size: 12px; }
.ds-files__meta--error { color: var(--error-text); }
.ds-files__meta--warning { color: var(--warning); }

/* ---------- Thanh tiến độ ---------- */
.ds-progress { height: 8px; border-radius: 9999px; background: rgb(44 44 44 / 0.05); overflow: hidden; }
.ds-progress--thin { height: 4px; }
.ds-progress__bar { height: 100%; border-radius: 9999px; background: var(--primary); }
.ds-progress-block { display: grid; gap: 8px; }
.ds-progress-block__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ds-progress-block__label { min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-progress-block__value { flex-shrink: 0; margin: 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- Dòng thời gian audit ---------- */
.ds-timeline { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.ds-timeline__item { position: relative; display: flex; gap: 12px; padding-bottom: 24px; }
.ds-timeline__item:last-child { padding-bottom: 0; }
.ds-timeline__line { position: absolute; top: 40px; bottom: 4px; left: 15px; width: 2px; background: var(--border-strong); }
.ds-timeline__item:last-child .ds-timeline__line { display: none; }
.ds-timeline__icon { display: grid; flex-shrink: 0; place-items: center; width: 32px; height: 32px; border-radius: 9999px; font-size: 14px; }
.ds-timeline__icon--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-timeline__icon--success { background: var(--success-bg); color: var(--success); }
.ds-timeline__icon--warning { background: var(--warning-bg); color: var(--warning); }
.ds-timeline__icon--error { background: var(--error-bg); color: var(--error-strong); }
.ds-timeline__body { min-width: 0; flex: 1; padding-top: 6px; }
.ds-timeline__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.ds-timeline__title { margin: 0; color: var(--foreground); font-weight: 500; }
.ds-timeline__time { flex-shrink: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ds-timeline__change { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.ds-timeline__before { color: var(--muted); text-decoration: line-through; }
.ds-timeline__after { color: var(--foreground); font-weight: 500; }
.ds-timeline__detail { max-width: 55ch; margin: 4px 0 0; color: var(--muted); text-wrap: pretty; }
.ds-timeline__meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- Banner ---------- */
.ds-banner { display: flex; gap: 12px; padding: 16px; border: 1px solid; border-radius: var(--radius-lg); }
.ds-banner--warning { border-color: var(--warning-border); background: var(--warning-bg); }
.ds-banner--error { border-color: var(--error-border); background: var(--error-bg); }
.ds-banner--neutral { border-color: var(--border-strong); background: var(--surface); }
.ds-banner__icon { flex-shrink: 0; margin-top: 2px; font-size: 18px; }
.ds-banner--warning .ds-banner__icon, .ds-banner--warning .ds-banner__title { color: var(--warning); }
.ds-banner--error .ds-banner__icon, .ds-banner--error .ds-banner__title { color: var(--error-strong); }
.ds-banner--neutral .ds-banner__icon { color: var(--muted); }
.ds-banner__body { flex: 1; min-width: 0; }
.ds-banner__title { margin: 0; font-size: 14px; font-weight: 500; }
.ds-banner__text { margin: 2px 0 0; color: rgb(44 44 44 / 0.8); font-size: 14px; text-wrap: pretty; }
.ds-banner__body ul { margin: 6px 0 0; padding-left: 18px; color: rgb(44 44 44 / 0.8); font-size: 14px; }
.ds-banner__action { display: flex; flex-shrink: 0; align-items: center; align-self: center; gap: 4px; }

/* ---------- Card chọn ---------- */
.ds-choice { min-width: 0; margin: 0; padding: 0; border: 0; }
.ds-choice__legend { margin-bottom: 12px; padding: 0; font-size: 14px; font-weight: 500; }
.ds-choice__grid { display: grid; grid-template-columns: repeat(var(--ds-choice-columns, 1), minmax(0, 1fr)); gap: 12px; }
@media (max-width: 639px) { .ds-choice__grid { grid-template-columns: minmax(0, 1fr); } }
.ds-choice__card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-choice__card:hover { background: var(--surface-hover); }
.ds-choice__card:has(:checked) { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-choice__card.is-disabled { cursor: not-allowed; opacity: 0.5; }
.ds-choice__radio {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin: 0;
  border: 1.5px solid var(--border-strong);
  border-radius: 9999px;
  background: var(--surface);
  appearance: none;
  outline: none;
  cursor: inherit;
}
.ds-choice__radio:checked { border: 6px solid var(--primary); }
.ds-choice__text { min-width: 0; }
.ds-choice__title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 500; }
.ds-choice__aside { color: var(--muted); font-size: 12px; font-weight: 400; }
.ds-choice__desc { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }

/* ---------- Danh sách mô tả ---------- */
.ds-dl { display: grid; gap: 12px; margin: 0; container-type: inline-size; font-size: 14px; }
.ds-dl__row { display: grid; gap: 4px; }
.ds-dl__label { color: var(--muted); }
.ds-dl__value { min-width: 0; margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-weight: 500; }
.ds-dl__value--empty { color: var(--muted); font-weight: 400; }
@container (min-width: 384px) { .ds-dl__row { grid-template-columns: 7rem minmax(0, 1fr); align-items: baseline; gap: 24px; } }
@container (min-width: 576px) { .ds-dl__row { grid-template-columns: 10rem minmax(0, 1fr); } }

/* ---------- Tab boxed, chip lọc ---------- */
.ds-tabs-boxed { display: flex; gap: 4px; }
.ds-tabs-select { display: none !important; width: max-content; min-width: 200px; }
.ds-tabs-select__prefix { color: var(--muted); }
@media (max-width: 639px) {
  .ds-tabs-boxed { display: none; }
  .ds-tabs-select { display: inline-flex !important; }
}
.ds-tabs-boxed__tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-tabs-boxed__tab:hover { background: rgb(44 44 44 / 0.05); color: var(--foreground); }
.ds-tabs-boxed__tab[aria-selected='true'] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
.ds-tabs-boxed__count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ds-tabs-boxed__tab[aria-selected='true'] .ds-tabs-boxed__count { color: var(--foreground); }

.ds-chips { overflow-x: auto; padding-block: 2px; }
.ds-chips__row { display: flex; gap: 8px; padding-inline: 4px; }
.ds-chip {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  max-width: 192px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-chip:hover { background: rgb(44 44 44 / 0.1); color: var(--foreground); }
.ds-chip[aria-pressed='true'] { background: var(--primary); color: var(--primary-foreground); }
.ds-chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Tự lưu, rỗng, dòng danh sách ---------- */
.ds-save { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.ds-save--failed { color: var(--error-text); }

.ds-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 40px 16px; text-align: center; }
.ds-empty__title { margin: 0; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-empty__title--error { color: var(--error-text); }
.ds-empty__text { max-width: 48ch; margin: 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-empty__action { margin-top: 12px; }

.ds-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md); }
.ds-row:hover { background: var(--item-hover); }
.ds-row__leading { flex-shrink: 0; }
.ds-row__body { flex: 1; min-width: 0; }
.ds-row__title { margin: 0; overflow: hidden; color: var(--foreground); font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-row__meta { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.ds-row__trailing { flex-shrink: 0; }

.product-brand {
  display: inline-flex;
  min-width: 0;
  align-items: center;
  gap: 10px;
}

.product-brand__mark {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-foreground);
}

.product-brand__mark svg {
  width: 20px;
  height: 20px;
}

.product-brand__name {
  overflow: hidden;
  font-size: 14px;
  font-weight: 600;
  color: var(--foreground);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-brand--collapsed .product-brand__name {
  display: none;
}

.product-brand--inverted .product-brand__mark {
  background: #ffffff;
  color: #001529; /* nền sidebar tối hiện tại */
}

.product-brand--inverted .product-brand__name {
  color: var(--primary-foreground);
}


  /* ===== Thanh công cụ của wireframe (nằm ngoài bản thiết kế, design-process.md U3) ===== */
  .wf-bar { position: relative; z-index: 50; display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; overflow-x: auto; white-space: nowrap;
    background: #fff; border-bottom: 1px solid #e5e5e5; color: #737373; font: 14px/1 system-ui, -apple-system, sans-serif; }
  .wf-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wf-set { display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding: 3px; border-radius: 10px; background: #f4f4f5; }
  .wf-set button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 30px; padding: 0 10px;
    border: 0; border-radius: 7px; background: none; color: #737373; cursor: pointer; }
  .wf-set button:hover { color: #171717; }
  .wf-set button[aria-pressed="true"] { background: #fff; color: #171717; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px rgb(0 0 0 / .04); }
  .wf-set button[data-recommended]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #003366; }
  .wf-set svg { width: 16px; height: 16px; }
  .wf-switch { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 0; border: 0; background: none; color: #737373; cursor: pointer; }
  .wf-switch i { position: relative; width: 36px; height: 20px; border-radius: 10px; background: #e4e4e7; }
  .wf-switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: translate .15s; }
  .wf-switch[aria-checked="true"] i { background: #171717; }
  .wf-switch[aria-checked="true"] i::after { translate: 16px 0; }
  .wf-menu { position: relative; flex-shrink: 0; }
  .wf-menu > button { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: #737373; cursor: pointer; }
  .wf-menu > button:hover, .wf-menu[data-open] > button { background: #f4f4f5; }
  .wf-menu b { color: #171717; font-weight: 500; }
  .wf-popover { position: fixed; z-index: 60; display: grid; min-width: 168px; padding: 4px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
  .wf-popover button { display: flex; align-items: center; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: #404040; text-align: left; cursor: pointer; }
  .wf-popover button:hover, .wf-popover button[aria-pressed="true"] { background: #f4f4f5; color: #171717; }
  .wf-reason { border-bottom: 1px solid #e5e5e5; background: #fafafa; color: #404040; font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  .wf-reason summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 44px; padding: 8px 16px; cursor: pointer; list-style: none; }
  .wf-reason summary::-webkit-details-marker { display: none; }
  .wf-reason-name { color: #171717; font-weight: 600; white-space: nowrap; }
  .wf-reason-tag { flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 10px; background: #e6edf5; color: #003366; font-size: 12px; font-weight: 500; line-height: 20px; }
  .wf-reason-why { flex: 1; min-width: 0; overflow: hidden; color: #525252; text-overflow: ellipsis; white-space: nowrap; }
  .wf-reason[open] .wf-reason-why { white-space: normal; }
  .wf-reason-toggle { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 28px; margin-left: auto; padding: 0 8px; border-radius: 6px; color: #171717; font-weight: 500; }
  .wf-reason-toggle svg { width: 14px; height: 14px; transition: rotate .15s; }
  .wf-reason[open] .wf-reason-toggle svg { rotate: 180deg; }
  .wf-reason-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 4px 16px 16px; }
  .wf-reason-cols { display: grid; max-width: 1120px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px 32px; }
  .wf-reason h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; color: #171717; font-size: 12px; font-weight: 600; }
  .wf-reason h3 i { width: 6px; height: 6px; border-radius: 50%; background: #a3a3a3; }
  .wf-reason h3 i[data-tone="uu"] { background: #16a34a; }
  .wf-reason h3 i[data-tone="nhuoc"] { background: #d97706; }
  .wf-reason ul { display: grid; gap: 2px; margin: 0; padding-left: 16px; }
  .wf-reason p { margin: 0; }
  .wf-reason-tips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #ebebeb; }
  .wf-reason-tips h3 { margin: 0 4px 0 0; }
  .wf-reason-tips button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; color: #262626; white-space: nowrap; cursor: pointer; }
  .wf-reason-tips button:hover { background: #f5f5f5; }
  .wf-reason-tips button[data-copied] { color: #16a34a; }
  @media (max-width: 767px) {
    .wf-reason-why { order: 1; flex-basis: 100%; }
    .wf-reason-toggle span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .wf-reason-tips h3 { flex-basis: 100%; }
  }
  [data-wf-block] { position: relative; }
  [data-wf-block]::before { content: attr(data-wf-block); position: absolute; top: 4px; left: 4px; z-index: 5; display: grid; place-items: center;
    width: 18px; height: 18px; border-radius: 9px; background: #1f1f1f; color: #fff; font: 500 11px/1 system-ui, sans-serif; pointer-events: none; }
  [data-wf-block][data-wf-block-out]::before { top: auto; bottom: 100%; }
  .wf-stage { padding: 0; }
  .wf-phone-wrap { display: grid; place-items: center; padding: 24px 16px; }
  .wf-phone { position: relative; width: 375px; max-width: 100%; height: 812px; overflow: auto; border: 1px solid #ddd; border-radius: 24px; background: var(--background); }

  /* ===== Bản thiết kế: khung app ===== */
  .app { container: app / inline-size; position: relative; display: flex; min-height: calc(100vh - 100px); background: var(--background); }
  .wf-phone .app { min-height: 100%; }
  @media (max-width: 439px) { .wf-phone-wrap { padding: 0; } .wf-phone { width: 100%; height: auto; min-height: 812px; border: 0; border-radius: 0; } }
  .sider { position: sticky; top: 0; display: flex; flex-direction: column; flex-shrink: 0; width: 240px; height: 100vh; max-height: 100%; overflow: hidden; background: var(--surface); transition: width .2s; }
  .sider--collapsed { width: 64px; }

const OPTION_LABELS = { loi: { a: '403', b: '404', c: '500' } };
const KEYS = ['man', 'v', 'mau', 'kho', 'nav', 'tt'];
const state = { man: 'duyet', v: '', mau: 'xam', kho: 'desktop', nav: 'menu', tt: 'du-lieu', menuOpen: false, userOpen: false, sider: null, view: 'fields', tab: null };
(function readState() {
  const params = new URLSearchParams(location.search);
  const hash = location.hash.replace(/^#/, '').split('.');
  KEYS.forEach((key, index) => { state[key] = params.get(key) || (hash.length === KEYS.length ? hash[index] : '') || state[key]; });
  if (!SCREENS[state.man]) state.man = 'duyet';
})();
function normalize() {
  const screen = SCREENS[state.man];
  if (!screen.options.includes(state.v)) state.v = screen.recommended || screen.options[0];
  if (!screen.states.includes(state.tt)) state.tt = 'du-lieu';
}
function syncHash() {
  try { history.replaceState(null, '', `#${KEYS.map((key) => state[key]).join('.')}`); } catch (error) { /* trang xem trước có thể chặn */ }
}

        </div>

const docBadge = (doc) => badge('document', doc.status);
const waitCell = (doc) => doc.status === 'COMPLETED' ? '<span class="muted">—</span>' : `<span class="num ${doc.slow ? 'warn-text' : 'muted'}" style="white-space:nowrap">${doc.wait}</span>`;
const needCell = (doc) => (doc.need == null ? '<span class="muted">—</span>' : doc.need === 0 ? '<span class="muted">0</span>' : `<span class="num" style="white-space:nowrap">${doc.need} trường</span>`);
const actionCell = (doc) => (doc.action ? btn(doc.action, { size: 'sm', variant: doc.action === 'Mở' ? 'ghost' : '' }) : '');

function statusTabs(selected) {
  const current = TABS.find(([value]) => value === selected);
  return `<div class="ds-tabs-boxed" role="tablist">${TABS.map(([value, label, count]) =>
    `<button type="button" role="tab" class="ds-tabs-boxed__tab" data-tab="${value}" aria-selected="${value === selected}">${label}<span class="ds-tabs-boxed__count">${state.tt === 'dang-tai' ? '' : state.tt === 'rong' ? 0 : count}</span></button>`).join('')}</div>
    <button type="button" class="btn ds-tabs-mobile"><span class="muted">Trạng thái:</span> ${current[1]} · ${state.tt === 'rong' ? 0 : current[2]} ${icon('down')}</button>`;
}

function docTable({ columns, rows }) {
  const head = columns.map((column) => `<th class="${column.cls || ''}">${column.title}</th>`).join('');
  if (state.tt === 'dang-tai') {
    const skeletonRows = Array.from({ length: 5 }, () => `<tr>${columns.map((column, index) => `<td class="${column.cls || ''}">${index === 0 ? '<span class="sk" style="width:70%"></span><span class="sk" style="width:40%;margin-top:8px"></span>' : '<span class="sk" style="width:60%"></span>'}</td>`).join('')}</tr>`).join('');
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${skeletonRows}</tbody></table></div>
      <ul class="doc-list">${Array.from({ length: 4 }, () => '<li><span class="sk" style="width:80%"></span><span class="sk" style="width:60px"></span><span class="sk" style="width:50%"></span></li>').join('')}</ul>`;
  }
  if (state.tt === 'rong') {
    return `<div class="ds-empty"><p class="ds-empty__title">Chưa có tài liệu nào</p><p class="ds-empty__text">Tải sổ thuyền viên lên, AI sẽ đọc và đề xuất dữ liệu để bạn duyệt.</p><div class="ds-empty__action">${btn('Tải tài liệu lên', { iconName: 'upload' })}</div></div>`;
  }
  if (state.tt === 'loi') {
    return `<div class="ds-empty" role="alert"><p class="ds-empty__title ds-empty__title--error">Không tải được danh sách tài liệu</p><p class="ds-empty__text">Mất kết nối tới máy chủ.</p><div class="ds-empty__action">${btn('Thử lại', { iconName: 'reload' })}</div></div>`;
  }
  const body = rows.map((doc) => `<tr>${columns.map((column) => `<td class="${column.cls || ''}">${column.render(doc)}</td>`).join('')}</tr>`).join('');
  const list = rows.map((doc) => `<li>
      <span class="cell2"><span class="cell2__main">${esc(doc.crew)}</span><span class="cell2__sub">${esc(doc.name)}</span></span>
      <span>${docBadge(doc)}</span>
      <span class="cell2__sub">${doc.slow ? `<span class="warn-text">Chờ ${doc.wait}</span>` : doc.status === 'COMPLETED' ? doc.wait : `Chờ ${doc.wait}`}${doc.need ? ` · ${doc.need} trường cần xem` : ''}</span>
      <span>${actionCell(doc)}</span></li>`).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><ul class="doc-list">${list}</ul>
    <div class="tbl-foot"><span>${rows.length} tài liệu</span></div>`;
}

function documentsScreen() {
  const v = state.v;
  const selectedTab = state.tab || (v === 'e' ? 'review' : 'all');
  const rows = selectedTab === 'all' ? DOCS : DOCS.filter((doc) => ({ processing: ['PROCESSING', 'SLOW'], review: ['REVIEW_REQUIRED'], failed: ['FAILED'], done: ['COMPLETED'] }[selectedTab]).includes(doc.status));
  const uploadButton = btn('Tải tài liệu lên', { variant: 'primary', iconName: 'upload' });
  const search = `<label class="search toolbar__search">${icon('search')}<input class="input" placeholder="Tìm theo tên tệp, thuyền viên" aria-label="Tìm tài liệu" /></label>`;
  const duplicateBanner = state.tt === 'du-lieu' ? `<div data-wf-block="3"><div role="status" class="ds-banner ds-banner--warning">${icon('exclamation-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">1 tệp không được tải lên vì trùng</p><p class="ds-banner__text">so-thuyen-vien-tran-minh-khoi-ban-chup-lai.pdf giống hệt tài liệu đã tải lúc 09:12 · 03/10/2026.</p></div><div class="ds-banner__action">${btn('Mở tài liệu đó')}</div></div></div>` : '';

  if (v === 'c') {

    const running = DOCS.filter((doc) => ['PROCESSING', 'SLOW'].includes(doc.status));
    const done = DOCS.filter((doc) => doc.status === 'COMPLETED');
    const body = state.tt !== 'du-lieu' ? `<div class="panel">${docTable({ columns: [COL.doc, COL.status], rows: [] })}</div>` : `
      <section class="panel" data-wf-block="5"><div class="panel__head"><h2 class="panel__title">Cần bạn xử lý · ${todo.length}</h2></div>
        <ul class="ds-files" style="margin:4px 0 0;padding:0 20px 8px">${todo.map((doc) => `<li class="ds-files__row">${icon(doc.status === 'FAILED' ? 'close-circle' : 'file-text', 'ds-files__icon')}<div class="ds-files__body"><p class="ds-files__name"><span class="ds-files__head">${esc(doc.crew === 'Chưa đọc được' ? doc.name : doc.crew)}</span></p><p class="ds-files__meta ${doc.status === 'FAILED' ? 'ds-files__meta--error' : ''}">${doc.status === 'FAILED' ? doc.note : `Chờ ${doc.wait} · ${doc.need ? `${doc.need} trường cần xem` : 'không có trường nào cần xem'}`}</p></div>${btn(doc.action, { size: 'sm', variant: doc.status === 'REVIEW_REQUIRED' ? 'primary' : '' })}</li>`).join('')}</ul></section>
      <section class="panel" data-wf-block="7"><div class="panel__head"><h2 class="panel__title">Đang trích xuất · ${running.length}</h2></div>
        <ul class="ds-files" style="margin:4px 0 0;padding:0 20px 8px">${running.map((doc) => `<li class="ds-files__row">${icon('file-text', 'ds-files__icon')}<div class="ds-files__body"><div class="ds-files__line"><p class="ds-files__name"><span class="ds-files__head">${esc(doc.name)}</span></p><p class="ds-files__percent ${doc.slow ? 'warn-text' : ''}">${doc.slow ? 'Chậm · ' : ''}${doc.wait}</p></div><div class="ds-progress ds-progress--thin"><div class="ds-progress__bar" style="width:${Math.round(doc.progress[0] / doc.progress[1] * 100)}%"></div></div><p class="ds-files__meta">Đã đọc ${doc.progress[0]} / ${doc.progress[1]} trang</p></div></li>`).join('')}</ul></section>
      <details class="collapse" data-wf-block="8"><summary><span><b>Đã xong · ${done.length}</b> <span class="muted">· mới nhất 09:12 · 05/10</span></span>${icon('down')}</summary></details>`;
    return shell({ title: 'Tài liệu', content: `${duplicateBanner}<div class="toolbar" data-wf-block="4"><span class="muted">${state.tt === 'du-lieu' ? '4 việc cần làm' : ''}</span><span style="margin-left:auto">${uploadButton}</span></div>${body}` });
  }

  let columns = [COL.doc, COL.status, COL.need, COL.wait, COL.by, COL.action];
  if (v === 'd') columns = [COL.docD, COL.statusD, COL.action];
  if (v === 'e') columns = selectedTab === 'all' ? columns : [COL.doc, COL.need, COL.wait, COL.by, COL.action];
  const toolbar = `<div class="toolbar" data-wf-block="4">${statusTabs(selectedTab)}${search}${v === 'b' ? '' : uploadButton}</div>`;
  const dropzone = v === 'b' ? `<div class="panel panel__body" data-wf-block="6">

        <li class="ds-files__row">${icon('file-text', 'ds-files__icon')}<div class="ds-files__body"><p class="ds-files__name"><span class="ds-files__head">so-thuyen-vien-tran-minh-khoi-ban-</span><span class="ds-files__tail">chup-lai.pdf</span></p><p class="ds-files__meta ds-files__meta--warning">Trùng với tài liệu đã tải lúc 09:12 · 03/10/2026 · <button type="button" class="ds-link">Mở tài liệu đó</button></p></div></li>
      </ul>` : ''}</div>` : '';
  return shell({ title: 'Tài liệu', content: `${v === 'b' ? '' : duplicateBanner}${dropzone}${toolbar}<div class="panel" data-wf-block="5">${docTable({ columns, rows })}</div>` });
}

  return `<div class="okrow"><span class="okrow__label">${label}${critical ? '<span class="ds-field__required">*</span>' : ''}</span>

}

function reviewScreen() {

    <div><div class="page-head__actions">${loading ? '' : '<span role="status" class="ds-save">' + icon('check') + ' Đã lưu</span>'}${btn('Công bố hồ sơ', { variant: 'primary', attrs: 'aria-disabled="true"' })}</div>

    c: ['500 · trong khung app', 'Lỗi của một trang, khung vẫn chạy: tải lại là việc chính, mã lỗi để gửi quản trị.', ['Người dùng biết không phải lỗi của họ', 'Mã lỗi chép được'], ['—'], 'Một API trả lỗi, các trang khác vẫn dùng được.', ['Thêm giờ xảy ra lỗi']],
  },
};

// ---------- Vẽ ----------
function renderToolbar() {
  const screen = SCREENS[state.man];
  const set = (param, items, labels = {}) => {
    const element = document.querySelector(`[data-wf-param="${param}"]`);
    element.innerHTML = items.map(([value, label, extra = '']) => `<button type="button" data-value="${value}" aria-pressed="${state[param] === value}" ${extra}>${labels[value] || label}</button>`).join('');
  };
  set('man', Object.entries(SCREENS).map(([key, value]) => [key, value.label]));
  set('v', screen.options.map((option) => [option, option.toUpperCase(), option === screen.recommended ? 'data-recommended title="Khuyên dùng"' : '']), OPTION_LABELS[state.man] || {});
  set('kho', [['desktop', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Desktop`], ['mobile', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>Mobile`]]);
  set('nav', [['menu', '☰ Menu'], ['duoi', 'Thanh dưới']]);
  document.querySelector('[data-wf-param="nav"]').style.display = state.kho === 'mobile' && state.man !== 'dang-nhap' ? '' : 'none';
  const toggle = document.querySelector('[data-wf-toggle="mau"]');
  toggle.setAttribute('aria-checked', String(state.mau === 'mau'));
  const labels = { ...STATE_LABELS, ...(STATE_LABELS_BY_SCREEN[state.man] || {}) };
  document.getElementById('tt-current').textContent = labels[state.tt];
  document.getElementById('tt-menu').style.display = screen.states.length > 1 ? '' : 'none';

  const [name, why, pros, cons, fit, tips] = REASONS[state.man][state.v];
  document.getElementById('reason-name').textContent = name;
  document.getElementById('reason-tag').hidden = state.v !== screen.recommended;
  document.getElementById('reason-why').textContent = why;
  document.getElementById('reason-pros').innerHTML = pros.map((line) => `<li>${line}</li>`).join('');
  document.getElementById('reason-cons').innerHTML = cons.map((line) => `<li>${line}</li>`).join('');
  document.getElementById('reason-fit').textContent = fit;
  const tipsEl = document.getElementById('reason-tips');
  tipsEl.querySelectorAll('button').forEach((button) => button.remove());
  tips.forEach((tip) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = tip;
    button.addEventListener('click', async () => { try { await navigator.clipboard.writeText(tip); button.setAttribute('data-copied', ''); setTimeout(() => button.removeAttribute('data-copied'), 1500); } catch (error) { /* bị chặn thì thôi */ } });
    tipsEl.appendChild(button);
  });
}

function renderDesign() {
  const screens = { 'tai-lieu': documentsScreen, duyet: reviewScreen, 'dang-nhap': loginScreen, loi: errorScreen };
  const html = screens[state.man]();
  document.getElementById('wf-design').innerHTML = state.kho === 'mobile' ? `<div class="wf-phone-wrap"><div class="wf-phone">${html}</div></div>` : html;
  requestAnimationFrame(() => requestAnimationFrame(placeBlockNumbers));
}

function render() {
  normalize();
  document.documentElement.dataset.mau = state.mau;
  renderToolbar();
  renderDesign();
  syncHash();
}

function placeBlockNumbers() {
  const overlap = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  for (const block of document.querySelectorAll('[data-wf-block]')) {
    const rect = block.getBoundingClientRect();
    const numberRect = { left: rect.left + 4, top: rect.top + 4, right: rect.left + 22, bottom: rect.top + 22 };
    const contentRects = [...block.querySelectorAll('svg, img')].map((node) => node.getBoundingClientRect());
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (!node.textContent.trim()) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      contentRects.push(...range.getClientRects());
    }
    block.toggleAttribute('data-wf-block-out', contentRects.some((r) => r.width > 0 && overlap(r, numberRect)));
  }
}

// ---------- Tương tác ----------
document.querySelector('.wf-bar').addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  const param = button.closest('[data-wf-param]')?.dataset.wfParam;
  if (param) {
    state[param] = button.dataset.value;
    if (param === 'man' || param === 'v') { state.tab = null; state.sider = null; state.menuOpen = false; state.userOpen = false; }
    render();
    return;
  }
  if (button.dataset.wfToggle === 'mau') { state.mau = state.mau === 'mau' ? 'xam' : 'mau'; render(); return; }
  if (button.closest('#tt-menu')) {
    const menu = document.getElementById('tt-menu');
    const existing = document.querySelector('.wf-popover');
    if (existing) { existing.remove(); menu.removeAttribute('data-open'); return; }
    const rect = button.getBoundingClientRect();
    const labels = { ...STATE_LABELS, ...(STATE_LABELS_BY_SCREEN[state.man] || {}) };
    const popover = document.createElement('div');
    popover.className = 'wf-popover';
    popover.style.top = `${rect.bottom + 6}px`;
    popover.style.left = `${Math.min(rect.left, window.innerWidth - 180)}px`;
    popover.innerHTML = SCREENS[state.man].states.map((value) => `<button type="button" data-tt="${value}" aria-pressed="${state.tt === value}">${labels[value]}</button>`).join('');
    popover.addEventListener('click', (popEvent) => { const item = popEvent.target.closest('[data-tt]'); if (!item) return; state.tt = item.dataset.tt; popover.remove(); menu.removeAttribute('data-open'); render(); });
    document.body.appendChild(popover);
    menu.setAttribute('data-open', '');
  }
});
document.addEventListener('click', (event) => {
  if (!event.target.closest('#tt-menu') && !event.target.closest('.wf-popover')) { document.querySelector('.wf-popover')?.remove(); document.getElementById('tt-menu').removeAttribute('data-open'); }
});
document.getElementById('wf-design').addEventListener('click', (event) => {
  const target = event.target.closest('[data-action], [data-tab], [data-view]');
  if (!target) return;
  if (target.dataset.tab) { state.tab = target.dataset.tab; renderDesign(); return; }
  if (target.dataset.view) { state.view = target.dataset.view; renderDesign(); return; }
  const action = target.dataset.action;
  if (action === 'menu') state.menuOpen = !state.menuOpen;
  if (action === 'user') state.userOpen = !state.userOpen;
  if (action === 'sider') {
    const collapsed = document.querySelector('.sider')?.classList.contains('sider--collapsed');
    state.sider = collapsed ? 'open' : 'collapsed';
  }
  renderDesign();
});
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  state.menuOpen = false; state.userOpen = false;
  document.querySelector('.wf-popover')?.remove();
  renderDesign();
});
addEventListener('resize', placeBlockNumbers);
render();

</script>
