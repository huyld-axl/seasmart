<style>
/* Wireframe nhóm A của MCAH (skill ui-ux, nhánh U, bước U3). Một theme sáng có chủ ý, như app.
     Token chép từ frontend/src/theme/tokens.js; component dùng chung class với frontend/src/components/ds/ds.css. */
  :root {
    color-scheme: light;
    --primary: #003366;
    --primary-hover: #1a4775;
    --primary-foreground: #ffffff;
    --primary-light: rgba(0, 51, 102, 0.06);
    --background: #f4f4f6;
    --surface: #ffffff;
    --foreground: #2c2c2c;
    --muted: #707070;
    --border: #f7f7f8;
    --border-strong: #eaeaea;
    --secondary: #e7e8ec;
    --secondary-hover: #dbdce2;
    --item-hover: #f4f4f6;
    --surface-hover: #f8f8fa;
    --button-hover: #f1f1f3;
    --ring-focus: rgba(0, 51, 102, 0.1);
    --border-focus: #003366;
    --neutral: #52525c;
    --neutral-bg: #f4f4f5;
    --success: #007a55;
    --success-bg: #ecfdf5;
    --warning: #bb4d00;
    --warning-bg: #fffbeb;
    --warning-border: #fee685;
    --error-strong: #c10007;
    --error-bg: #fef2f2;
    --error-border: #ffc9c9;
    --error: #fb2c36;
    --error-text: #e7000b;
    --danger: #c70036;
    --danger-bg: rgba(255, 32, 86, 0.1);
    --danger-bg-hover: rgba(255, 32, 86, 0.15);
    --app-font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 9999px;
    --elevation-popover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --elevation-modal: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --legacy-none: 0;
  }
  /* Nấc Xám: tắt màu nhấn và màu trạng thái, còn lại giữ nguyên token (U3). */
  :root[data-mau="xam"] {
    --primary: #2c2c2c; --primary-hover: #474747; --primary-light: rgba(44, 44, 44, 0.05);
    --ring-focus: rgba(44, 44, 44, 0.1); --border-focus: #2c2c2c;
    --success: #52525c; --success-bg: #f4f4f5; --warning: #52525c; --warning-bg: #f4f4f5; --warning-border: #e4e4e7;
    --error-strong: #52525c; --error-bg: #f4f4f5; --error-border: #e4e4e7; --error-text: #52525c; --danger: #52525c; --danger-bg: #f4f4f5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--app-font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: none; }
/* Component riêng của MCAH. Dự án không dùng Tailwind: class của skill dịch sang CSS thuần, màu lấy biến
   token (src/theme/tokens.js). Không mã màu nào ngoài biến, trừ lớp phủ theo màu chữ. */

.ds-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.ds-link {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--foreground);
  font: inherit;
  font-weight: 500;
  text-decoration: underline;
  text-underline-offset: 3px;
  cursor: pointer;
}

/* ---------- Badge trạng thái (M7) ---------- */
.ds-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 9999px;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.05);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
}
.ds-badge--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-badge--success { background: var(--success-bg); color: var(--success); }
.ds-badge--warning { background: var(--warning-bg); color: var(--warning); }
.ds-badge--error { background: var(--error-bg); color: var(--error-strong); }
.ds-badge__icon { font-size: 13px; }
.ds-badge__dot { flex-shrink: 0; width: 10px; height: 10px; border-radius: 9999px; }
.ds-badge__dot--ring { border: 1.5px solid currentColor; }
.ds-badge__dot--ring-dot { border: 1.5px solid currentColor; background: radial-gradient(currentColor 0 2px, transparent 2.5px); }

/* ---------- Ô trường duyệt ---------- */
.ds-field {
  display: grid;
  gap: 8px;
  padding: 12px 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.ds-field--active { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-field__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.ds-field__label { color: var(--muted); font-size: 12px; font-weight: 500; }
.ds-field__required { margin-left: 2px; color: var(--error-text); }
.ds-field__value { margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-field__value--unknown { color: var(--muted); font-style: italic; font-weight: 400; }
.ds-field__foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.ds-field__badges { display: flex; flex-wrap: wrap; gap: 6px; }
.ds-field__actions { display: flex; flex-wrap: wrap; gap: 2px; }
.ds-field__reason { margin: 0; color: var(--muted); font-size: 12px; }

.ds-chip-page {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: var(--foreground);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.ds-chip-page:hover { background: rgb(44 44 44 / 0.1); }

/* ---------- Khung xem tài liệu ---------- */
.ds-viewer {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.ds-viewer__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  min-height: 56px;
  padding: 8px 12px 8px 20px;
  border-bottom: 1px solid var(--border-strong);
}
.ds-viewer__name { flex: 1 1 200px; min-width: 0; margin: 0; overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-viewer__tools { display: flex; flex-shrink: 0; align-items: center; gap: 2px; }
.ds-viewer__count { min-width: 44px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.ds-viewer__divider { width: 1px; height: 20px; margin: 0 6px; background: var(--border-strong); }
.ds-viewer__evidence { margin: 0; padding: 8px 20px; border-bottom: 1px solid var(--border); background: var(--primary-light); color: var(--foreground); font-size: 12px; }
.ds-viewer__stage { display: grid; place-items: start center; min-height: 320px; padding: 24px; overflow: auto; background: var(--background); }

.ds-sample-page {
  width: 100%;
  min-width: 480px; /* trang tài liệu không co chữ theo màn: hẹp thì cuộn như ảnh */
  max-width: 520px;
  padding: 24px;
  border-radius: 4px;
  background: #fbfaf6; /* giấy sổ, chỉ trong trang mẫu */
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
  color: #3b3b3b;
  font-family: 'Courier New', ui-monospace, monospace;
  font-size: 12px;
}
.ds-sample-page__title { margin: 0 0 12px; font-weight: 700; letter-spacing: 0.04em; }
.ds-sample-page table { width: 100%; border-collapse: collapse; }
.ds-sample-page th, .ds-sample-page td { padding: 6px; border: 1px solid #c9c4b5; text-align: left; }
.ds-sample-page td { font-family: 'Segoe Script', 'Brush Script MT', cursive; font-size: 13px; }
.ds-sample-page__stamp { margin: 16px 0 0; color: #5f5a4e; text-align: right; }

/* ---------- Khung kéo thả tệp ---------- */
.ds-drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--background) 60%, transparent);
  text-align: center;
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-drop:hover { background: var(--item-hover); }
.ds-drop__title { color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-drop__hint { margin-top: 4px; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-drop__button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  margin-top: 16px;
  padding: 0 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
}
@media (hover: none) { .ds-drop__title { display: none; } }

.ds-files { margin: 16px 0 0; padding: 0; list-style: none; }
.ds-files__row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.ds-files__row:first-child { border-top: 0; }
.ds-files__icon { flex-shrink: 0; color: var(--muted); font-size: 18px; }
.ds-files__body { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; gap: 6px; min-width: 0; }
.ds-files__line { display: flex; align-items: baseline; gap: 12px; }
.ds-files__name { display: flex; flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-files__head { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds-files__tail { flex-shrink: 0; white-space: nowrap; }
.ds-files__percent { flex-shrink: 0; margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.ds-files__meta { margin: 0; color: var(--muted); font-size: 12px; }
.ds-files__meta--error { color: var(--error-text); }
.ds-files__meta--warning { color: var(--warning); }

/* ---------- Thanh tiến độ ---------- */
.ds-progress { height: 8px; border-radius: 9999px; background: rgb(44 44 44 / 0.05); overflow: hidden; }
.ds-progress--thin { height: 4px; }
.ds-progress__bar { height: 100%; border-radius: 9999px; background: var(--primary); }
.ds-progress-block { display: grid; gap: 8px; }
.ds-progress-block__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ds-progress-block__label { min-width: 0; margin: 0; font-size: 14px; font-weight: 500; }
.ds-progress-block__value { flex-shrink: 0; margin: 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- Dòng thời gian audit ---------- */
.ds-timeline { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.ds-timeline__item { position: relative; display: flex; gap: 12px; padding-bottom: 24px; }
.ds-timeline__item:last-child { padding-bottom: 0; }
.ds-timeline__line { position: absolute; top: 40px; bottom: 4px; left: 15px; width: 2px; background: var(--border-strong); }
.ds-timeline__item:last-child .ds-timeline__line { display: none; }
.ds-timeline__icon { display: grid; flex-shrink: 0; place-items: center; width: 32px; height: 32px; border-radius: 9999px; font-size: 14px; }
.ds-timeline__icon--neutral { background: var(--neutral-bg); color: var(--neutral); }
.ds-timeline__icon--success { background: var(--success-bg); color: var(--success); }
.ds-timeline__icon--warning { background: var(--warning-bg); color: var(--warning); }
.ds-timeline__icon--error { background: var(--error-bg); color: var(--error-strong); }
.ds-timeline__body { min-width: 0; flex: 1; padding-top: 6px; }
.ds-timeline__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; }
.ds-timeline__title { margin: 0; color: var(--foreground); font-weight: 500; }
.ds-timeline__time { flex-shrink: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ds-timeline__change { margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.ds-timeline__before { color: var(--muted); text-decoration: line-through; }
.ds-timeline__after { color: var(--foreground); font-weight: 500; }
.ds-timeline__detail { max-width: 55ch; margin: 4px 0 0; color: var(--muted); text-wrap: pretty; }
.ds-timeline__meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

/* ---------- Banner ---------- */
.ds-banner { display: flex; gap: 12px; padding: 16px; border: 1px solid; border-radius: var(--radius-lg); }
.ds-banner--warning { border-color: var(--warning-border); background: var(--warning-bg); }
.ds-banner--error { border-color: var(--error-border); background: var(--error-bg); }
.ds-banner--neutral { border-color: var(--border-strong); background: var(--surface); }
.ds-banner__icon { flex-shrink: 0; margin-top: 2px; font-size: 18px; }
.ds-banner--warning .ds-banner__icon, .ds-banner--warning .ds-banner__title { color: var(--warning); }
.ds-banner--error .ds-banner__icon, .ds-banner--error .ds-banner__title { color: var(--error-strong); }
.ds-banner--neutral .ds-banner__icon { color: var(--muted); }
.ds-banner__body { flex: 1; min-width: 0; }
.ds-banner__title { margin: 0; font-size: 14px; font-weight: 500; }
.ds-banner__text { margin: 2px 0 0; color: rgb(44 44 44 / 0.8); font-size: 14px; text-wrap: pretty; }
.ds-banner__body ul { margin: 6px 0 0; padding-left: 18px; color: rgb(44 44 44 / 0.8); font-size: 14px; }
.ds-banner__action { display: flex; flex-shrink: 0; align-items: center; align-self: center; gap: 4px; }

/* ---------- Card chọn ---------- */
.ds-choice { min-width: 0; margin: 0; padding: 0; border: 0; }
.ds-choice__legend { margin-bottom: 12px; padding: 0; font-size: 14px; font-weight: 500; }
.ds-choice__grid { display: grid; grid-template-columns: repeat(var(--ds-choice-columns, 1), minmax(0, 1fr)); gap: 12px; }
@media (max-width: 639px) { .ds-choice__grid { grid-template-columns: minmax(0, 1fr); } }
.ds-choice__card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  background: var(--surface);
  cursor: pointer;
  transition: background-color 0.15s;
}
.ds-choice__card:hover { background: var(--surface-hover); }
.ds-choice__card:has(:checked) { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.ds-choice__card.is-disabled { cursor: not-allowed; opacity: 0.5; }
.ds-choice__radio {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  margin: 0;
  border: 1.5px solid var(--border-strong);
  border-radius: 9999px;
  background: var(--surface);
  appearance: none;
  outline: none;
  cursor: inherit;
}
.ds-choice__radio:checked { border: 6px solid var(--primary); }
.ds-choice__text { min-width: 0; }
.ds-choice__title { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; font-size: 14px; font-weight: 500; }
.ds-choice__aside { color: var(--muted); font-size: 12px; font-weight: 400; }
.ds-choice__desc { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }

/* ---------- Danh sách mô tả ---------- */
.ds-dl { display: grid; gap: 12px; margin: 0; container-type: inline-size; font-size: 14px; }
.ds-dl__row { display: grid; gap: 4px; }
.ds-dl__label { color: var(--muted); }
.ds-dl__value { min-width: 0; margin: 0; overflow-wrap: anywhere; color: var(--foreground); font-weight: 500; }
.ds-dl__value--empty { color: var(--muted); font-weight: 400; }
@container (min-width: 384px) { .ds-dl__row { grid-template-columns: 7rem minmax(0, 1fr); align-items: baseline; gap: 24px; } }
@container (min-width: 576px) { .ds-dl__row { grid-template-columns: 10rem minmax(0, 1fr); } }

/* ---------- Tab boxed, chip lọc ---------- */
.ds-tabs-boxed { display: flex; gap: 4px; }
.ds-tabs-select { display: none !important; width: max-content; min-width: 200px; }
.ds-tabs-select__prefix { color: var(--muted); }
@media (max-width: 639px) {
  .ds-tabs-boxed { display: none; }
  .ds-tabs-select { display: inline-flex !important; }
}
.ds-tabs-boxed__tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-tabs-boxed__tab:hover { background: rgb(44 44 44 / 0.05); color: var(--foreground); }
.ds-tabs-boxed__tab[aria-selected='true'] { background: var(--secondary); color: var(--foreground); font-weight: 500; }
.ds-tabs-boxed__count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.ds-tabs-boxed__tab[aria-selected='true'] .ds-tabs-boxed__count { color: var(--foreground); }

.ds-chips { overflow-x: auto; padding-block: 2px; }
.ds-chips__row { display: flex; gap: 8px; padding-inline: 4px; }
.ds-chip {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  max-width: 192px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 9999px;
  background: rgb(44 44 44 / 0.05);
  color: rgb(44 44 44 / 0.7);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.ds-chip:hover { background: rgb(44 44 44 / 0.1); color: var(--foreground); }
.ds-chip[aria-pressed='true'] { background: var(--primary); color: var(--primary-foreground); }
.ds-chip__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Tự lưu, rỗng, dòng danh sách ---------- */
.ds-save { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.ds-save--failed { color: var(--error-text); }

.ds-empty { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 40px 16px; text-align: center; }
.ds-empty__title { margin: 0; color: var(--foreground); font-size: 14px; font-weight: 500; }
.ds-empty__title--error { color: var(--error-text); }
.ds-empty__text { max-width: 48ch; margin: 0; color: var(--muted); font-size: 14px; text-wrap: pretty; }
.ds-empty__action { margin-top: 12px; }

.ds-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-md); }
.ds-row:hover { background: var(--item-hover); }
.ds-row__leading { flex-shrink: 0; }
.ds-row__body { flex: 1; min-width: 0; }
.ds-row__title { margin: 0; overflow: hidden; color: var(--foreground); font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-row__meta { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.ds-row__trailing { flex-shrink: 0; }

/* ---------- Panel trượt ---------- */
.ds-panel .ant-drawer-mask { background: rgb(0 0 0 / 0.15); }
.ds-panel .ant-drawer-content-wrapper { box-shadow: var(--elevation-modal); }
.ds-panel.ant-drawer-right .ant-drawer-content-wrapper { transition-duration: 0.5s; transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1); }
.ds-panel .ant-drawer-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.ds-panel .ant-drawer-body { padding: 24px; }
.ds-panel .ant-drawer-footer { padding: 16px 24px; border-top: 1px solid var(--border); }
.ds-panel__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ds-panel__heading { min-width: 0; }
.ds-panel__title { margin: 0; font-size: 18px; font-weight: 600; line-height: 28px; }
.ds-panel__desc { margin: 2px 0 0; color: var(--muted); font-size: 14px; font-weight: 400; text-wrap: pretty; }
.ds-panel__foot { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- Toast ---------- */
.ds-toast.ant-notification-notice { width: auto; max-width: min(440px, calc(100vw - 32px)); padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--elevation-popover); }
.ds-toast .ant-notification-notice-icon { top: 50%; translate: 0 -50%; font-size: 16px; line-height: 1; }
.ds-toast--success .ant-notification-notice-icon { color: var(--success); }
.ds-toast--error .ant-notification-notice-icon { color: var(--error-strong); }
.ds-toast .ant-notification-notice-title, .ds-toast .ant-notification-notice-message { margin: 0 0 0 28px !important; padding: 0 !important; font-size: 14px; }
.ds-toast .ant-notification-notice-description { display: none; }
.ds-toast__row { display: flex; align-items: center; gap: 16px; }
.ds-toast__text { flex: 1; min-width: 0; }
.ds-toast__action { flex-shrink: 0; }

/* ---------- Đầu trang và thanh công cụ danh sách ---------- */
.ds-page { display: grid; gap: 16px; }
.ds-page__head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
.ds-page__title { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; }
.ds-page__desc { margin: 4px 0 0; color: var(--muted); }
.ds-page__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ds-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.ds-toolbar__search { flex: 1 1 220px; max-width: 320px; }
.ds-toolbar__end { margin-left: auto; display: flex; gap: 8px; }
.ds-card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; }
.ds-card .ant-table-wrapper .ant-table { background: transparent; }
.ds-table-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); }
.ds-cell2 { display: grid; min-width: 0; }
.ds-cell2__main { overflow: hidden; color: var(--foreground); font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.ds-cell2__sub { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.ds-num { font-variant-numeric: tabular-nums; }
.ds-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.ds-role { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--neutral-bg); color: var(--neutral); font-size: 12px; font-weight: 500; white-space: nowrap; }
.ds-form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
@media (max-width: 639px) { .ds-form-row { grid-template-columns: minmax(0, 1fr); } }

/* ===== Thanh công cụ của wireframe (nằm ngoài bản thiết kế, design-process.md U3) ===== */
  .wf-bar { position: relative; z-index: 50; display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; overflow-x: auto; white-space: nowrap;
    background: #fff; border-bottom: 1px solid #e5e5e5; color: #737373; font: 14px/1 system-ui, -apple-system, sans-serif; }
  .wf-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .wf-set { display: flex; align-items: center; gap: 2px; flex-shrink: 0; padding: 3px; border-radius: 10px; background: #f4f4f5; }
  .wf-set button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 32px; height: 30px; padding: 0 10px;
    border: 0; border-radius: 7px; background: none; color: #737373; cursor: pointer; }
  .wf-set button:hover { color: #171717; }
  .wf-set button[aria-pressed="true"] { background: #fff; color: #171717; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px rgb(0 0 0 / .04); }
  .wf-set button[data-recommended]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #003366; }
  .wf-set svg { width: 16px; height: 16px; }
  .wf-switch { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; padding: 0; border: 0; background: none; color: #737373; cursor: pointer; }
  .wf-switch i { position: relative; width: 36px; height: 20px; border-radius: 10px; background: #e4e4e7; }
  .wf-switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: translate .15s; }
  .wf-switch[aria-checked="true"] i { background: #171717; }
  .wf-switch[aria-checked="true"] i::after { translate: 16px 0; }
  .wf-menu { position: relative; flex-shrink: 0; }
  .wf-menu > button { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: #737373; cursor: pointer; }
  .wf-menu > button:hover, .wf-menu[data-open] > button { background: #f4f4f5; }
  .wf-menu b { color: #171717; font-weight: 500; }
  .wf-popover { position: fixed; z-index: 60; display: grid; min-width: 168px; padding: 4px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .08); }
  .wf-popover button { display: flex; align-items: center; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: none; color: #404040; text-align: left; cursor: pointer; }

  .wf-reason { border-bottom: 1px solid #e5e5e5; background: #fafafa; color: #404040; font: 13px/1.5 system-ui, -apple-system, sans-serif; }
  .wf-reason summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 44px; padding: 8px 16px; cursor: pointer; list-style: none; }
  .wf-reason summary::-webkit-details-marker { display: none; }
  .wf-reason-name { color: #171717; font-weight: 600; white-space: nowrap; }
  .wf-reason-tag { flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 10px; background: #e6edf5; color: #003366; font-size: 12px; font-weight: 500; line-height: 20px; }
  .wf-reason-why { flex: 1; min-width: 0; overflow: hidden; color: #525252; text-overflow: ellipsis; white-space: nowrap; }
  .wf-reason[open] .wf-reason-why { white-space: normal; }
  .wf-reason-toggle { display: inline-flex; flex-shrink: 0; align-items: center; gap: 4px; height: 28px; margin-left: auto; padding: 0 8px; border-radius: 6px; color: #171717; font-weight: 500; }
  .wf-reason-toggle svg { width: 14px; height: 14px; transition: rotate .15s; }
  .wf-reason[open] .wf-reason-toggle svg { rotate: 180deg; }
  .wf-reason-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 4px 16px 16px; }
  .wf-reason-cols { display: grid; max-width: 1120px; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px 32px; }
  .wf-reason h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 4px; color: #171717; font-size: 12px; font-weight: 600; }

  .wf-reason h3 i[data-tone="uu"] { background: #16a34a; }

  .wf-reason-tips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #ebebeb; }
  .wf-reason-tips h3 { margin: 0 4px 0 0; }
  .wf-reason-tips button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; color: #262626; white-space: nowrap; cursor: pointer; }

  @media (max-width: 767px) {

  }
  [data-wf-block] { position: relative; }

    width: 18px; height: 18px; border-radius: 9px; background: #1f1f1f; color: #fff; font: 500 11px/1 system-ui, sans-serif; pointer-events: none; }
  [data-wf-block][data-wf-block-out]::before { top: auto; bottom: 100%; }
  .wf-stage { padding: 0; }

  /* ===== Bản thiết kế: khung app ===== */

  @media (max-width: 439px) { .wf-phone-wrap { padding: 0; } .wf-phone { width: 100%; height: auto; min-height: 812px; border: 0; border-radius: 0; } }
  .sider { position: sticky; top: 0; display: flex; flex-direction: column; flex-shrink: 0; width: 240px; height: 100vh; max-height: 100%; overflow: hidden; background: var(--surface); transition: width .2s; }

  /* ===== Control theo theme Ant Design của dự án ===== */

    border-radius: 12px; background: var(--surface); color: var(--foreground); font-weight: 500; line-height: 1.2; text-align: center; cursor: pointer; transition: background-color .15s; }

/* ===== Nhóm D: AI tách và đọc giấy tờ (T1–T5). Chỉ token và class ds-* có sẵn, phần riêng dưới tiền tố d-. ===== */

/* ----- ảnh giấy tờ: khối xám đúng tỉ lệ ----- */

/* ----- T1: thả tệp ----- */

.d-file__name { min-width: 0; max-width: 100%; overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.d-file__meta { color: var(--muted); font-size: 12px; white-space: nowrap; }

.d-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 0; padding: 0; list-style: none; }
.d-steps li { display: grid; gap: 4px; min-width: 0; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }

@container app (max-width: 639px) { .d-steps li:not([data-s="active"]):not([data-s="fail"]) { text-indent: -9999px; } .d-file { flex-wrap: wrap; } .d-file__act { flex-basis: 100%; padding-left: 32px; } }
.d-batch { display: grid; gap: 8px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
.d-seg { display: flex; gap: 2px; height: 8px; overflow: hidden; border-radius: 9999px; background: rgb(44 44 44 / .05); }

.d-sheet-wrap { position: absolute; inset: 0; z-index: 40; display: flex; justify-content: flex-end; pointer-events: none; }

/* ----- T5: hồ sơ ----- */

.d-cell { display: grid; min-width: 0; gap: 2px; }

.d-bar { display: flex; height: 6px; overflow: hidden; border-radius: 9999px; background: rgb(44 44 44 / .05); }

.d-fr__act { align-items: center; }

.d-split-file__head > b { flex: 1 1 140px; min-width: 120px; }
.d-legend { gap: 4px 12px; }
.d-note, .d-drop__hint, .d-file__line, .wf-reason p, .d-cell__sub, .d-fr__raw, .d-cert__why, .d-reread, .d-field-error, .ds-banner__text, .ds-empty__text { text-wrap: pretty; }
.wf-reason-name, .d-sec__title, .page-head__title { text-wrap: balance; }
.d-ctbl td { white-space: normal; }
.d-ctbl td:nth-child(5) { white-space: nowrap; }
.d-file__line--err, .d-tile__note--err, .d-cert__why--err { color: var(--error-strong); }
.d-cert__name .d-select, .d-ccard .d-select { max-width: 100%; }
.d-ccard .d-row { flex-wrap: wrap; }

.d-drop__hint { color: var(--neutral); }
@container app (max-width: 639px) { .d-file__meta { display: none; } }
.d-split-file__head { min-height: 40px; }
.d-fr__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.d-fr__foot .d-dest { margin-left: auto; }
.d-cert__name { text-wrap: pretty; }

.d-nowrap { white-space: nowrap; }
.d-link { white-space: nowrap; }
.d-demo-tag { height: auto; min-height: 20px; white-space: nowrap; }
.d-md-list button[aria-current="true"] .d-cell__sub { color: var(--neutral); }
.facts .d-mono { line-height: 20px; }
.d-sv-tbl td:nth-child(2), .d-sv-tbl td:nth-child(3), .d-sv-tbl td:nth-child(4) { white-space: nowrap; }
.d-nowrap .d-cell__sub { white-space: nowrap; overflow-wrap: normal; }
.d-sv-tbl .d-src { white-space: nowrap; }


/* ----- T2 mới: duyệt từng giấy ----- */
.d-doc-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
.d-doc-head__type { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-width: 0; }
.d-doc-head__sub { font-weight: 600; font-size: 16px; }
.d-doc-head__nav { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.d-pagerbtns { display: inline-flex; align-items: center; gap: 4px; }
.d-kind { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 9999px; background: var(--secondary); font-weight: 500; white-space: nowrap; }
.d-kind--other { background: var(--neutral-bg); color: var(--neutral); }
.pf--row { width: 100%; margin: 0; padding: 8px 10px; border: 0; border-radius: 10px; background: none; font: inherit; text-align: left; cursor: pointer; }
.pf--row:hover { background: rgb(0 0 0 / .035); }
.d-pfl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; }
.d-map .paper__fields { gap: 4px 12px; }
.d-map.paper { padding: 8px; }
.d-other { padding: 24px 16px; text-align: center; }
.cmp__stage.d-stack { align-content: start; }
@container app (min-width: 1024px) { .cmp__pane--goc .cmp__stage { position: sticky; top: 72px; } }
.page-head__desc, .pf__label span { text-wrap: pretty; }
.field-bar__actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

/* ----- v2: T1 đơn giản, T2 sửa tại chỗ ----- */
.d-file--simple { align-items: center; padding: 10px 0; }
.d-file--simple .d-file__icon { margin-top: 0; }
.d-file__state { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; }
.d-batch--line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.d-batch--line .d-note { display: block; }
.d-top .page-head__actions { align-items: center; }
.d-typehead { gap: 8px 12px; }
.d-typehead__sub { font-weight: 600; }
.d-select--ghost { border-color: transparent; background: transparent; color: var(--muted); }
.d-doc-stage { padding: 12px; }
.d-doc { display: block; width: 100%; height: auto; border-radius: 4px; box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.cmp__pane--so .cmp__stage { background: var(--surface); }
.d-form-stage { gap: 12px; }
@container app (min-width: 1024px) { .cmp__pane--goc { position: sticky; top: 16px; } .cmp__pane--goc .cmp__stage { position: static; } }
.d-ins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.d-in { display: grid; gap: 4px; min-width: 0; grid-column: 1 / -1; }
.d-in--half { grid-column: auto; }
@container app (max-width: 639px) { .d-ins { grid-template-columns: minmax(0, 1fr); } .d-in--half { grid-column: 1 / -1; } }
.d-in__label { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
.d-in__label i { margin-left: auto; font-style: normal; font-weight: 400; }
.d-in__edited { margin-left: auto; color: var(--success); font-weight: 500; }
.d-in__box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.d-in__box .input { flex: 1 1 140px; min-width: 0; }
.d-in--warn .input { border-color: var(--warning-border); background: var(--warning-bg); }
.d-in--edited .input { border-color: var(--success); }
.d-in--focus .input { border-color: var(--border-focus); box-shadow: 0 0 0 2px var(--ring-focus); }
.d-in__hint { color: var(--muted); font-size: 12px; text-wrap: pretty; }
.d-in__hint--warn { color: var(--warning); }
.d-ok { flex-shrink: 0; border-color: var(--warning-border); color: var(--warning); }
.d-in__edited { display: inline-flex; align-items: center; gap: 4px; }
.d-in__edited svg { width: 14px; height: 14px; }
.d-okmark { display: grid; place-items: center; width: 32px; color: var(--success); }
.d-vchip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--foreground); font: inherit; font-size: 12px; white-space: nowrap; cursor: pointer; }
.d-vchip--ok { border-color: transparent; background: var(--success-bg); color: var(--success); cursor: default; }
.d-vchip--warn { border-color: var(--warning-border); background: var(--warning-bg); color: var(--warning); }
.d-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 12px; border-top: 1px solid var(--border); }

.d-in { align-content: start; }
.d-typehead { flex-wrap: nowrap; }
.d-typehead__sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@container app (min-width: 1024px) { .cmp { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); } }
.d-typehead { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; }
.d-typehead .d-grow { display: none; }
.d-typehead__sub { grid-column: 1 / -1; white-space: normal; text-wrap: balance; }
.d-file__line--err, .d-file__line--warn { text-wrap: balance; }
.d-batch--line .d-note { font-weight: 400; }
.d-up { overflow: visible; }
.d-up__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.d-up__head .d-h { margin: 0; font-weight: 600; }
.d-up__head .d-note { display: block; font-weight: 400; }
.d-up .d-files--flat, .d-up__list { padding: 0 16px; }
.d-drop--slim { border: 0; border-top: 1px dashed var(--border-strong); border-radius: 0 0 16px 16px; padding: 10px 16px; }
.paper .pf__label i, .paper .paper__title i, .paper__stamps { font-size: 12px; }
.d-drop--slim .d-drop__icon { width: 32px; height: 32px; font-size: 16px; }
</style>

const icon = (name, cls = '') => (ICONS[name] || '').replace('<svg ', `<svg class="${cls}" `);
const esc = (text) => String(text ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
const initials = (name) => name.split(' ').slice(-2).map((part) => part[0]).join('');
const avatar = (name, size = '') => `<span class="avatar ${size}">${initials(name)}</span>`;
const btn = (label, { variant = '', size = '', iconName = '', attrs = '', cls = '' } = {}) =>
  `<button type="button" class="btn ${variant ? `btn--${variant}` : ''} ${size ? `btn--${size}` : ''} ${cls}" ${attrs}>${iconName ? icon(iconName) : ''}${label}</button>`;
const iconBtn = (name, label, size = 'sm') => `<button type="button" class="btn btn--ghost btn--icon btn--${size}" aria-label="${label}" title="${label}">${icon(name)}</button>`;
function pill(tone, label, mark = '') {
  const head = mark === 'ring' || mark === 'ring-dot' ? `<span class="ds-badge__dot ds-badge__dot--${mark}" aria-hidden="true"></span>` : mark ? icon(mark, 'ds-badge__icon') : '';
  return `<span class="ds-badge ds-badge--${tone}">${head}${label}</span>`;
}
const check = (on, label, { disabled = false, attrs = '' } = {}) =>
  `<span class="d-check" role="checkbox" aria-checked="${on}" ${disabled ? 'aria-disabled="true"' : ''} tabindex="0" ${attrs}><i>${on ? icon('check') : ''}</i>${label ? `<span>${label}</span>` : ''}</span>`;
const select = (label, { warn = false } = {}) => `<span class="d-select ${warn ? 'd-select--warn' : ''}"><span>${label}</span>${icon('down')}</span>`;
const bars = (count = 5) => `<span class="d-img__bars" aria-hidden="true">${Array.from({ length: count }, (_, i) => `<i style="width:${[92, 78, 86, 60, 70, 82, 48][i % 7]}%"></i>`).join('')}</span>`;
// Ảnh giấy tờ: khối xám có tỉ lệ thật. kind: land (hai trang mở ra), port (giấy dọc), photo (ảnh chụp 3:4).
const img = (kind, { tag = '', sm = false, err = false, spread = false, w = '' } = {}) =>
  `<span class="d-img d-img--${kind} ${sm ? 'd-img--sm' : ''} ${err ? 'd-img--err' : ''} ${spread ? 'd-img--spread' : ''}" ${w ? `style="width:${w}"` : ''}>${err ? '' : bars(kind === 'land' ? 6 : 5)}${tag ? `<span class="d-img__tag">${tag}</span>` : ''}</span>`;
const thumb = (kind, { err = false, md = false } = {}) => `<span class="d-thumb ${md ? 'd-thumb--md' : ''}">${img(kind, { sm: true, err })}</span>`;
const skel = (w = '60%', h = 12) => `<span class="sk" style="width:${w};height:${h}px"></span>`;
const rowSkel = (n = 4) => `<div class="d-skel" aria-busy="true">${Array.from({ length: n }, () => `<div class="d-skel-row"><span class="sk" style="width:20px;height:20px"></span><div style="flex:1;display:grid;gap:8px">${skel('45%')}${skel('80%', 8)}</div>${skel('64px', 28)}</div>`).join('')}</div>`;

function fileRow(file) {
  const s = file.st;
  let status = '';

  if (s === 'run') status = `<span class="d-file__state d-spin">${icon('loading')}Đang xử lý</span>`;

    status = file.other ? `<span class="d-file__state">${pill('neutral', 'Khác', '')}<span class="d-note">${file.summary} · lưu kèm hồ sơ</span></span>`

  else if (s === 'stuck') { status = `<span class="d-file__state d-file__line--warn">${icon('clock-circle')}Quá 5 phút chưa xong, có thể bị kẹt</span>`; acts = `${btn('Thử lại', { size: 'sm', iconName: 'reload' })}${btn('Bỏ tệp', { size: 'sm', variant: 'ghost' })}`; }
  else if (s === 'badformat') { status = '<span class="d-file__state d-file__line--err">Chỉ nhận PDF, JPG, PNG</span>'; acts = btn('Bỏ khỏi danh sách', { size: 'sm', variant: 'ghost' }); }

  else if (s === 'duplicate') { status = `<span class="d-file__state d-file__line--warn">${icon('exclamation-circle')}Đã có trong hồ sơ (tải ngày ${file.dupAt})</span>`; acts = `${btn('Xem tệp đã có', { size: 'sm' })}${btn('Bỏ', { size: 'sm', variant: 'ghost' })}`; }

function t1Summary(files, tt) {
  const run = files.filter((file) => file.st === 'run').length;
  const attn = files.filter((file) => ['error', 'stuck', 'badformat', 'toobig', 'duplicate', 'unsent'].includes(file.st)).length;
  let title; let cta = '';
  if (tt === 'toan-khac') title = 'Xong. Giấy "Khác" chỉ lưu kèm hồ sơ, không cần duyệt.';
  else if (tt === 'chua-cau-hinh') title = 'Tệp đã lưu. AI chưa đọc được vì chưa cấu hình.';
  else if (run) title = `Đang xử lý ${run} tệp. Bạn có thể làm việc khác, trang tự cập nhật.`;
  else if (attn && tt === 'can-xu-ly') title = `${attn} tệp cần bạn xử lý`;
  else if (tt === 'mat-ket-noi') title = '2 tệp chưa gửi được';
  else { title = `Xong: ${TOTAL_SUMMARY.replace(' · cần duyệt 6', '')}`; cta = btn('Duyệt 6 giấy', { variant: 'primary', iconName: 'right' }); }
  const sub = run && files.some((file) => file.st === 'done' && !file.other) ? ' Xong đến đâu duyệt được đến đó.' : '';
  return `<div class="d-up__head" aria-live="polite"><p class="d-h d-grow">${title}${sub ? `<span class="d-note">${sub}</span>` : ''}</p>${cta}</div>`;
}

  c2: { kind: 'duty', sub: 'Bố trí chức danh · chuyến 2', file: 'So-thuyen-vien-Khoi.pdf', page: 'tr.3', ratio: 'land' },
  c3: { kind: 'duty', sub: 'Bố trí chức danh · chuyến 3', file: 'So-thuyen-vien-Khoi.pdf', page: 'tr.4', ratio: 'land' },
  c4: { kind: 'duty', sub: 'Bố trí chức danh · chuyến 4', file: 'So-thuyen-vien-Khoi.pdf', page: 'tr.5', ratio: 'land' },
  k1: { kind: 'cert', sub: 'Basic Safety Training', file: 'IMG_2041.jpg', page: '1 ảnh', ratio: 'photo' },
  k4: { kind: 'cert', sub: 'Medical First Aid', file: 'scan-0007.pdf', page: 'tr.2', ratio: 'port' },
  k7: { kind: 'cert', sub: 'Ship Security Officer', file: 'IMG_2043.jpg', page: '1 ảnh', ratio: 'photo' },
  o1: { kind: 'other', sub: 'Giấy tiêm chủng quốc tế', file: 'Tiem-chung-quoc-te.pdf', page: 'tr.1', ratio: 'port' },
};
const T2_DOC_BY_STATE = { 'so-bo-tri': 'c2', 'so-thong-tin': 'info', 'chung-chi': 'k1', 'chung-chi-loi': 'k4', khac: 'o1', 'o-trang-thai': 'c2', 'dang-doc': 'c3', 'giay-loi': 'c4', 'khac-nguoi': 'info', 'da-vao-ho-so': 'c1', 'may-chu-tu-choi': 'c2' };

// ---------- Bản gốc dựng như màn Duyệt của nhom-a: cùng bố cục với các ô bên phải, ô được chọn sáng ở cả hai bên ----------
const EN_LABEL = { typeCode: 'Certificate of', no: 'Certificate No.', valid: 'Valid until', issuedOn: 'Issued on', issuer: 'Issued by', holder: 'Name of holder' };
const PAPER_HEAD = {
  info: ['SỔ THUYỀN VIÊN', "SEAMAN'S BOOK", 'CỤC HÀNG HẢI VIỆT NAM', true],
  duty: ['BỐ TRÍ CHỨC DANH', 'DUTIES ARRANGEMENT', 'THUYỀN TRƯỞNG XÁC NHẬN', false],
  cert: ['GIẤY CHỨNG NHẬN', 'CERTIFICATE', 'DẤU CƠ SỞ ĐÀO TẠO', false],
  other: ['GIẤY TIÊM CHỦNG QUỐC TẾ', 'INTERNATIONAL CERTIFICATE OF VACCINATION', 'DẤU KIỂM DỊCH Y TẾ', false],
};
function paperGoc(id, fields, focusKey) {
  const meta = DOCMETA[id];
  const [t1, t2, stamp, photo] = PAPER_HEAD[meta.kind];
  const list = meta.kind === 'other'
    ? [['', 'Họ tên', 'Name', 'TRAN MINH KHOI', false], ['', 'Bệnh', 'Against', 'YELLOW FEVER', false], ['', 'Nhà sản xuất, số lô', 'Manufacturer, batch no.', 'DEMO PHARMA · L 0000', false], ['', 'Hiệu lực từ', 'Valid from', '01.08.2016', true], ['', 'Đến', 'Until', '01.08.2026', true]]
    : fields.map((f) => [f.key, f.label, f.en || EN_LABEL[f.key] || '', f.raw, !!f.half]);
  const rows = list.map(([key, label, en, raw, half]) => `<div class="pf ${half ? 'pf--half' : ''} ${key && key === focusKey ? 'pf--focus' : ''}" ${key ? `data-field="${key}"` : ''}><span class="pf__label">${esc(label)}<i>${esc(en)}</i></span><span class="pf__value">${raw ? `<span class="ink">${esc(raw)}</span>` : '<span class="ink ink--blank">&nbsp;</span>'}</span></div>`).join('');
  return `<div class="paper paper--goc"><p class="paper__title">${t1}<i>${t2}</i></p>${photo ? '<span class="paper__photo">Ảnh</span>' : ''}<div class="paper__fields">${rows}</div><div class="paper__stamps"><span class="paper__stamp"><span class="seal" aria-hidden="true"></span>${stamp}</span></div></div>`;
}

// ---------- Ô của một giấy ----------
function docFieldsFor(id) {
  const meta = DOCMETA[id];
  if (meta.kind === 'info' || meta.kind === 'duty') {
    const trip = tripsForState().find((item) => item.id === id);
    const fields = JSON.parse(JSON.stringify(trip.fields));
    if (state.tt === 'khac-nguoi' && id === 'info') { const n = fields.find((f) => f.key === 'name'); n.raw = 'TRẦN VĂN KHÔI'; n.val = 'TRẦN VĂN KHÔI'; }
    return { fields, vessel: trip.vessel };
  }
  if (meta.kind === 'cert') {
    const c = CERTS.find((item) => item.id === id);
    const bad = state.tt === 'chung-chi-loi';
    const noExp = bad || !c.exp;
    return { vessel: null, fields: [
      { key: 'typeCode', label: 'Loại chứng chỉ', raw: c.raw, val: bad ? '' : c.name, st: bad ? 'UNKNOWN' : 'PROPOSED', to: 'pf', req: true, hint: bad ? `Không khớp danh mục. Đã lưu tên trên giấy: "${c.raw}". Chọn loại.` : '' },
      { key: 'valid', label: 'Có giá trị đến', raw: noExp ? '' : c.exp.replace(/\//g, '.'), val: noExp ? '' : c.exp, st: noExp ? 'UNKNOWN' : 'PROPOSED', to: 'pf', req: true, date: true, hint: noExp ? 'Giấy không ghi hạn: nhập ngày, hoặc đánh dấu không thời hạn.' : '' },
      { key: 'no', label: 'Số chứng chỉ', raw: c.no, val: c.no, st: 'PROPOSED', to: 'pf', num: true },
      { key: 'issuedOn', label: 'Cấp ngày', raw: c.issued, val: c.issued.replace(/\./g, '/'), st: 'PROPOSED', to: 'pf', date: true },
      { key: 'issuer', label: 'Nơi cấp', raw: c.by, val: c.by, st: 'PROPOSED', to: 'pf' },
      { key: 'holder', label: 'Tên người trên giấy', raw: c.holder, val: c.holder, st: 'PROPOSED', to: 'cmp' },
    ] };
  }
  return { fields: [], vessel: null };
}

// Ô cần chạm một lần: ngày chưa chắc và số GCNKNCM (không âm thầm chấp nhận bằng cách bỏ qua).
const needsTouch = (f) => (f.st === 'DATE_AMBIGUOUS' || f.key === 'coc') && !['ACCEPTED', 'EDITED'].includes(f.st);
function vesselChip(vessel, locked) {
  if (!vessel) return '';
  const [st, text] = vessel;
  if (st === 'MATCHED') return `<span class="d-vchip d-vchip--ok" title="${esc(text)}">${icon('check-circle')}Khớp danh mục</span>`;
  if (st === 'NOT_FOUND') return `<button type="button" class="d-vchip d-vchip--warn" ${locked ? 'aria-disabled="true"' : ''}>${icon('question-circle')}Không thấy tàu · Đối chiếu</button>`;
  return `<button type="button" class="d-vchip" ${locked ? 'aria-disabled="true"' : ''}>${icon('search')}Đối chiếu tàu</button>`;
}
function inputRow(f, { vessel, locked, focusKey }) {
  const unsure = f.st === 'DATE_AMBIGUOUS';
  const unknown = f.st === 'UNKNOWN' || (f.st === 'UNKNOWN_KEPT' && !f.val);
  const edited = f.st === 'EDITED';
  const done = f.st === 'ACCEPTED';
  const value = unknown ? '' : f.val;
  const ph = f.st === 'UNKNOWN_KEPT' ? 'Để trống' : 'Không đọc được';
  const destText = f.to === 'pf' ? 'vào hồ sơ' : f.to === 'cmp' ? 'chỉ để so' : '';
  const hint = f.hint || (unsure ? 'Chữ viết tay, kiểm lại với bản gốc' : f.key === 'coc' ? 'Số dài, so từng ký tự với bản gốc' : (edited && f.raw !== f.val ? `AI đọc: ${f.raw}` : (f.note || '')));
  const touch = edited ? `<span class="d-okmark" title="Đã sửa">${icon('check-circle')}</span>` : needsTouch(f) && !locked ? `<button type="button" class="btn btn--sm btn--icon d-ok" aria-label="Đúng, giữ nguyên" title="Đúng, giữ nguyên">${icon('check')}</button>` : (done && (f.key === 'coc' || f.date) ? `<span class="d-okmark" title="Đã xác nhận">${icon('check-circle')}</span>` : '');
  const vc = f.key === 'ship' ? vesselChip(vessel, locked) : '';
  const norm = f.norm ? `<span class="d-in__hint">→ ${esc(f.norm)}</span>` : '';
  return `<div class="d-in ${f.half ? 'd-in--half' : ''} ${unsure ? 'd-in--warn' : ''} ${edited ? 'd-in--edited' : ''} ${focusKey === f.key ? 'd-in--focus' : ''}" data-key="${f.key}">
    <label class="d-in__label"><span>${esc(f.label)}${f.req ? ' <span class="d-req">*</span>' : ''}</span>${destText ? `<i>${destText}</i>` : ''}${edited ? `<b class="d-in__edited">${icon('check')}Đã sửa</b>` : ''}</label>
    <div class="d-in__box"><input class="input input--sm ${f.num ? 'd-mono' : ''}" data-orig="${esc(value)}" value="${esc(value)}" placeholder="${ph}" ${locked ? 'disabled' : ''} />${touch}${vc}</div>
    ${hint ? `<span class="d-in__hint ${unsure || f.hint ? 'd-in__hint--warn' : ''}">${esc(hint)}</span>` : ''}${norm}</div>`;
}

function t2Screen() {
  const tt = state.tt;
  const id = (state.page && SEQ.includes(state.page) ? state.page : null) || T2_DOC_BY_STATE[tt] || 'c2';
  const meta = DOCMETA[id];
  const idx = SEQ.indexOf(id);
  const locked = tt === 'da-vao-ho-so';
  const reading = tt === 'dang-doc';
  const failed = tt === 'giay-loi';
  const { fields, vessel } = docFieldsFor(id);
  const touch = fields.filter(needsTouch).length;
  const focusKey = fields.some((f) => f.key === state.hl) ? state.hl : (fields.find((f) => f.st === 'DATE_AMBIGUOUS') || fields.find((f) => f.st === 'UNKNOWN') || {}).key;
  const kindName = KIND_NAME[meta.kind];

  const head = `<div class="page-head d-top" data-wf-block="3"><div class="page-head__text"><h1 class="page-head__title">Duyệt giấy tờ</h1></div>
    <div class="page-head__actions"><span class="d-pagerbtns">${iconBtn('left', 'Giấy trước', 'md')}<span class="num">Giấy ${idx + 1}/${SEQ.length}</span>${iconBtn('right', 'Giấy sau', 'md')}</span>${btn('Đưa vào hồ sơ', { variant: 'primary', attrs: tt === 'may-chu-tu-choi' ? '' : 'aria-disabled="true" title="Còn 6 giấy chưa duyệt"' })}</div></div>`;
  const refused = tt === 'may-chu-tu-choi' ? `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Máy chủ không nhận việc đưa vào hồ sơ</p><p class="ds-banner__text">"Còn giấy chưa duyệt xong". Duyệt nốt các giấy còn lại rồi thử lại.</p></div><div class="ds-banner__action">${btn('Thử lại', { size: 'sm' })}</div></div>` : '';
  const mismatch = tt === 'khac-nguoi' && id === 'info' ? `<div role="alert" class="ds-banner ds-banner--warning">${icon('exclamation-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Tên trên giấy khác hồ sơ</p><p class="ds-banner__text">Giấy ghi "TRẦN VĂN KHÔI", hồ sơ là "Trần Minh Khôi". Giấy chưa vào hồ sơ được cho tới khi bạn quyết.</p></div><div class="ds-banner__action">${btn('Vẫn đúng người', { size: 'sm', variant: 'primary' })}${btn('Bỏ giấy', { size: 'sm' })}</div></div>` : '';
  const lockedBanner = locked ? `<div role="status" class="ds-banner ds-banner--neutral">${icon('lock', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Giấy này đã vào hồ sơ ngày 12/10/2026</p><p class="ds-banner__text">Chỉ để xem. Muốn đổi dữ liệu thì sửa ở hồ sơ, kèm lý do.</p></div></div>` : '';

  const frame = (content) => shell({ crumb: 'Thuyền viên', crumb2: 'Trần Minh Khôi', content });
  if (tt === 'dang-tai') return frame(`${head}<div class="cmp"><div class="cmp__pane"><span class="sk" style="width:100%;height:480px;border-radius:12px"></span></div><div class="cmp__pane"><div class="d-stack" style="padding:16px">${rowSkel(5)}</div></div></div>`);
  if (tt === 'rong') return frame(`${head}${emptyBlock('Chưa có giấy nào để duyệt', 'Thả giấy tờ ở hồ sơ thuyền viên. Giấy đọc xong sẽ hiện ở đây, từng giấy một.', btn('Về hồ sơ để thả tệp', { iconName: 'upload' }))}`);
  if (tt === 'mat-ket-noi') return frame(`${head}${errorBlock('Mất kết nối với máy chủ', 'Chưa lấy được giấy này. Phần bạn đã duyệt vẫn được giữ.')}`);
  if (tt === 'chua-cau-hinh') return frame(`${head}${aiOffBanner('Bạn vẫn xem được bản gốc. ')}<div class="cmp"><section class="cmp__pane cmp__pane--goc"><header class="cmp__head"><span class="cmp__title">Bản gốc</span></header><div class="cmp__stage d-doc-stage">${paperGoc(id, fields, focusKey)}</div></section></div>`);

  const left = `<section class="cmp__pane cmp__pane--goc"><header class="cmp__head"><span class="cmp__title">Bản gốc</span><span class="muted d-trunc">${esc(meta.file)} · ${meta.page}</span>
      <span class="cmp__tools">${iconBtn('zoom-out', 'Thu nhỏ')}<span class="num muted">100%</span>${iconBtn('zoom-in', 'Phóng to')}${iconBtn('rotate-right', 'Xoay')}</span></header>
    <div class="cmp__stage d-doc-stage" data-wf-block="5">${paperGoc(id, fields, focusKey)}</div></section>`;

  const typeHead = `<header class="cmp__head d-typehead"><span class="d-kind d-kind--${meta.kind}">${icon(meta.kind === 'cert' ? 'safety-certificate' : meta.kind === 'other' ? 'file' : 'book')}${kindName}</span><span class="d-grow"></span><span class="d-select d-select--ghost" title="Đổi loại giấy: AI đọc lại giấy này, khoảng 30 giây"><span>Đổi loại</span>${icon('down')}</span><span class="d-typehead__sub">${esc(meta.sub)}</span></header>`;
  let inner;
  if (reading) inner = `<div class="d-bulk" aria-live="polite"><span class="d-spin">${icon('loading')}</span><div class="d-grow"><b>Đang xử lý giấy này</b><p class="d-note">Khoảng 30 giây. Bạn xem bản gốc ở bên trái trong lúc chờ.</p></div></div>${Array.from({ length: 5 }, () => `<div class="d-in" aria-busy="true"><span class="sk" style="width:35%"></span><span class="sk" style="width:100%;height:36px;border-radius:8px"></span></div>`).join('')}`;
  else if (failed) inner = `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Không đọc được giấy này</p><p class="ds-banner__text">Các giấy khác vẫn đưa vào hồ sơ được; giấy này ở ngoài cho tới khi đọc xong.</p></div><div class="ds-banner__action">${btn('Thử lại', { size: 'sm', iconName: 'reload' })}${btn('Bỏ giấy', { size: 'sm' })}</div></div>`;
  else if (meta.kind === 'other') inner = `<div class="d-other"><p class="d-h">Giấy này được lưu kèm hồ sơ, không cần duyệt.</p><p class="d-note">Không phải sổ thuyền viên hay chứng chỉ nên không đọc từng ô. AI nhận sai thì bấm Đổi loại.</p><div class="d-row" style="justify-content:center;margin-top:12px">${btn('Giấy tiếp', { variant: 'primary', iconName: 'right' })}</div></div>`;
  else {
    const note = meta.kind === 'duty' ? `<p class="d-note">Mọi ô của trang này vào chuyến đi tàu.</p>` : '';
    const rows = fields.map((f) => inputRow(f, { vessel, locked, focusKey })).join('');
    const label = meta.kind === 'cert' ? 'Đã so số, xác nhận' : 'Xong, giấy tiếp';
    const disabled = locked ? true : touch > 0;
    const why = !locked && touch ? `<span class="d-note d-grow">${touch} ô tô vàng cần bạn xác nhận ✓</span>` : '<span class="d-grow"></span>';
    inner = `${note}<div class="d-ins">${rows}</div>${locked ? '' : `<div class="d-foot">${why}${btn(label, { variant: 'primary', iconName: meta.kind === 'cert' ? 'check' : 'right', attrs: disabled ? 'aria-disabled="true"' : '' })}</div>`}`;
  }
  const right = `<section class="cmp__pane cmp__pane--so">${typeHead}<div class="cmp__stage d-stack d-form-stage" data-wf-block="6">${inner}</div></section>`;
  const switcher = `<div class="switch-view"><div class="seg" role="group" aria-label="Xem"><button type="button" data-view="doc" aria-pressed="${state.view === 'doc'}">Bản gốc</button><button type="button" data-view="fields" aria-pressed="${state.view !== 'doc'}">Bản số hoá</button></div></div>`;
  return frame(`${refused}${head}${mismatch}${lockedBanner}${switcher}<div class="cmp" data-view="${state.view === 'doc' ? 'doc' : 'fields'}">${left}${right}</div>`);
}

const MATCH_PILL = {

  NOT_CHECKED: () => pill('neutral', 'Tàu chưa đối chiếu', 'ring'),

};
function seaBadges(s) {
  const out = [];
  if (s.ongoing) out.push(pill('success', 'Đang trên tàu', 'ring-dot'));
  if (s.overlap) out.push(pill('warning', 'Trùng thời gian', 'swap'));
  if (s.missing) out.push(pill('warning', s.missing, 'calendar'));
  out.push(MATCH_PILL[s.match](s));
  return out;
}

}

const PAPER_LABEL = { info: 'Sổ · trang thông tin', duty: 'Sổ · bố trí chức danh', cert: 'Chứng chỉ', other: 'Khác' };
function paperChip(p, file) {
  const [type, name, st, extra] = p;
  const stPill = st === 'PUBLISHED' ? pill('success', 'Đã vào hồ sơ', 'check-circle') : st === 'SKIPPED' ? pill('neutral', 'Khác · lưu kèm hồ sơ', '') : pill('warning', 'Chờ duyệt', 'ellipsis');
  return `<div class="d-row"><span class="d-cell__main">${esc(PAPER_LABEL[type])}${name ? ` · ${esc(name)}` : ''}</span>${stPill}${extra === 'confirmed' ? pill('neutral', 'Đã xác nhận: vẫn đúng người', 'check-circle') : ''}</div>`;
}
function fileActs(file) {
  const published = file.papers.length && file.papers.every((p) => p[2] === 'PUBLISHED');
  const base = btn('Xem tệp gốc', { size: 'sm', iconName: 'eye' });
  if (file.failed) return `${btn('Đọc lại', { size: 'sm', iconName: 'reload' })}${btn('Bỏ tệp', { size: 'sm', variant: 'ghost' })}`;
  if (published) return `${base}<span class="d-lock">${icon('lock')} Đã vào hồ sơ, không xoá</span>`;
  if (file.papers.some((p) => p[0] === 'other')) return `${base}${btn('Đổi loại', { size: 'sm' })}${btn('Bỏ tệp', { size: 'sm', variant: 'ghost' })}`;
  return `${base}${btn('Duyệt', { size: 'sm', iconName: 'right' })}${btn('Bỏ tệp', { size: 'sm', variant: 'ghost' })}`;
}
function filesA() {
  const rows = T5_FILES.map((file) => `<tr data-tone="${file.failed ? 'warn' : ''}"><td><div class="d-row" style="flex-wrap:nowrap">${rowIcon(file)}<div class="d-cell"><span class="d-cell__main">${esc(file.name)}</span><span class="d-cell__sub">${file.kind === 'pdf' ? 'PDF' : 'JPG'} · ${file.pages} ${file.kind === 'pdf' ? 'trang' : 'ảnh'} · ${file.size} · ${file.at}</span></div></div></td>
    <td>${file.failed ? `<span class="d-file__line--err" style="color:var(--error-text)">${esc(file.failed)}</span>` : `<div class="d-stack-sm">${file.papers.map((p) => paperChip(p, file)).join('')}</div>`}</td>
    <td class="r"><span class="d-row" style="justify-content:flex-end">${fileActs(file)}</span></td></tr>`).join('');
  const cards = T5_FILES.map((file) => `<li><div class="d-row">${rowIcon(file)}<b class="d-grow d-trunc">${esc(file.name)}</b></div>${file.failed ? `<span style="color:var(--error-text)">${esc(file.failed)}</span>` : file.papers.map((p) => paperChip(p, file)).join('')}<div class="d-row">${fileActs(file)}</div></li>`).join('');
  return `<div class="d-only-wide" style="overflow-x:auto"><table class="d-sv-tbl" data-wf-block="6"><thead><tr><th>Tệp đã tải</th><th>Giấy trong tệp</th><th class="r">Thao tác</th></tr></thead><tbody>${rows}</tbody></table></div><ul class="d-card-list d-only-narrow">${cards}</ul>`;
}
function filesB() {
  return `<div class="d-list-cards" data-wf-block="6">${T5_FILES.map((file) => `<section class="panel"><div class="panel__body d-stack"><div class="d-row">${rowIcon(file)}<div class="d-grow d-cell"><b class="d-trunc">${esc(file.name)}</b><span class="d-cell__sub">${file.pages} ${file.kind === 'pdf' ? 'trang' : 'ảnh'} · ${file.size} · ${file.at}</span></div></div>
    ${file.failed ? `<div role="alert" class="ds-banner ds-banner--error">${icon('close-circle', 'ds-banner__icon')}<div class="ds-banner__body"><p class="ds-banner__title">Giấy chưa tách</p><p class="ds-banner__text">${esc(file.failed)}</p></div></div>` : file.papers.map((p) => paperChip(p, file)).join('')}
    <div class="d-row">${fileActs(file)}</div></div></section>`).join('')}</div>`;
}
function filesC() {
  const cur = T5_FILES.find((file) => file.id === (state.sel && state.sel.startsWith('f') ? state.sel : 'f2')) || T5_FILES[1];
  const list = T5_FILES.map((file) => `<li><button type="button" aria-current="${file.id === cur.id}" data-sel="${file.id}"><span class="d-cell__main d-trunc">${esc(file.name)}</span><span class="d-cell__sub">${file.failed ? 'Giấy chưa tách' : file.papers.map((p) => PAPER_LABEL[p[0]]).join(', ')}</span></button></li>`).join('');

      ${cur.failed ? `<p style="color:var(--error-text);margin:0">${esc(cur.failed)}</p>` : cur.papers.map((p) => paperChip(p, cur)).join('')}<div class="d-row">${fileActs(cur)}</div></div></section></div>`;

      'Một màn riêng, mở từ nút Tải giấy tờ lên ở đầu hồ sơ. Một khung duy nhất: dòng tóm tắt ("Đang xử lý 3 tệp" rồi "Xong: 1 sổ, 5 chứng chỉ, 2 khác · cần duyệt 6"), mỗi tệp một dòng (tên, "Đang xử lý" hoặc "Xong", nút Duyệt), khung thả thêm tệp ở chân khung.',
      'Bản cũ ghi "Đã gửi, AI đang đọc" rồi bỏ đó. Bản này bỏ hẳn các bước tải lên, tách giấy, đọc, bỏ n/m, dung lượng, số trang; chỉ giữ lỗi và việc cần làm.',
      'Mất khả năng biết tệp đang kẹt ở bước nào, chỉ còn cảnh báo "quá 5 phút". Cần dữ liệu: tóm tắt từng tệp (số giấy theo loại) trong uploads[] (việc B1), logic do bạn nối.'),
  },
  t2: {
    a: R('A · Gốc trái, ô phải, sửa tại chỗ', 'Việc chính là so từng ô với bản gốc, nên giấy gốc và các ô đứng cạnh nhau, ô sửa ngay trên ô nhập.',
      'Đầu trang: "Duyệt giấy tờ", Giấy 3/9 và nút Đưa vào hồ sơ. Bên trái giấy gốc dựng như nhom-a, bên phải loại giấy và các ô là ô nhập; tàu đối chiếu nằm ngay cạnh ô Tên tàu.',
      'Bỏ nút Chấp nhận, Sửa, Từ chối, bỏ thanh hành động dính đáy, bỏ các con số 8 ô đọc rõ, 12 ô. Bỏ qua là chấp nhận, gõ lại là đã sửa.',
      'Hai ô vẫn cần chạm một lần (ngày chưa chắc, số GCNKNCM) để không chấp nhận âm thầm; chứng chỉ có một nút "Đã so số, xác nhận". Bản gốc dựng giống màn Duyệt của nhom-a (giấy có ô, chữ viết tay), chưa phải ảnh quét thật; số liệu là dữ liệu bịa. Cần dữ liệu: thứ tự giấy trong lần tải (đã có data[]).'),
  },
  t5: {
    a: R('A · Bảng, sửa ở ngăn bên phải', 'Giữ bảng quen thuộc của tab, chuyến mới nhất trước, hợp đồng lao động nằm ngay dưới như cũ.',
      'Tab Đi tàu: bảng chuyến (tàu, chức danh, xuống, rời, nguồn kèm link bản gốc), hợp đồng lao động nằm dưới giữ nguyên. Sửa mở ngăn phải, xoá hỏi lý do bằng hộp. Tab Chứng chỉ: bảng chứng chỉ của thuyền viên (tên, số, cấp ngày, hết hạn, trạng thái).',
      'Bản cũ không có chuyến đi tàu từ sổ. Giờ có chuyến, nguồn, đối chiếu tàu, trùng thời gian, sửa và xoá đều bắt lý do.',
      'Ngăn sửa che bảng khi mở, không so được các chuyến. Cần dữ liệu: nhãn "trùng thời gian" và "đang trên tàu" tính từ ngày (statusMap có sẵn, logic tính do bạn nối).'),
    b: R('B · Dòng thời gian theo chuyến', 'Một cuộc đi tàu là chuỗi theo thời gian, nên chuyến xếp trên đường dọc, trùng hay hở nhìn thấy ngay.',
      'Tab Đi tàu: mỗi chuyến một thẻ trên đường dọc, mới nhất trên cùng; sửa và xoá mở ngay trong thẻ. Tab Chứng chỉ: bảng chứng chỉ của thuyền viên (tên, số, cấp ngày, hết hạn, trạng thái).',
      'Bản cũ là bảng. Giờ chuỗi chuyến đọc như lý lịch đi tàu.',
      'Chiếm chỗ hơn bảng: 5 chuyến cao khoảng gấp đôi. Sửa tại chỗ làm thẻ nở ra, các thẻ dưới bị đẩy xuống.'),
    c: R('C · Danh sách và bản gốc cạnh form', 'Sửa một chuyến từ sổ thì cần thấy bản gốc ngay cạnh ô đang sửa.',
      'Tab Đi tàu: cột trái danh sách chuyến, cột phải ảnh bản gốc phía trên, form sửa phía dưới, nút xoá ở chân.',
      'Bản cũ phải mở bản gốc ở nơi khác để so. Giờ so ngay trong lúc sửa.',
      'Chuyến nhập tay không có bản gốc nên nửa trên trống. Hai cột ở 1280 mỗi cột hẹp, form xếp một cột. Hợp đồng lao động nằm dưới cả hai.'),
  },
};
const DE = {
  t1: { d: ['Mỗi dòng chỉ còn tên tệp và một cụm trạng thái, bỏ thanh bốn nấc và kích thước tệp.', 'Bỏ thanh nấc, bỏ dung lượng, bỏ chú thích "tự cập nhật"; còn cụm "Đang đọc 3/5".', 'Mất chỗ để thấy tệp đang ở nấc nào ngoài nấc hiện tại.'],
    e: ['Mỗi thông tin một chỗ: tổng chỉ ở thẻ đầu, nhóm không lặp lại số đếm, dòng không lặp tên nấc.', 'Bỏ chú giải màu, bỏ dung lượng, bỏ bốn nấc ở tệp đang chạy (nhóm đã nói nó đang chạy).', 'Phải nhớ nhóm "Đang chạy" nghĩa là tải lên, tách hay đọc; chỉ biết ở dòng trạng thái.'] },
  t2: { d: ['Đầu trang chỉ còn loại giấy; nhãn ô và nút ngắn, chip đích chỉ ghi "Hồ sơ" hay "Để so".', 'Bỏ tên tệp, bỏ câu mô tả dưới tiêu đề, bỏ chú thích dưới nút chấp nhận hàng loạt.', 'Mất lời nhắc vì sao số GCNKNCM không nằm trong chấp nhận hàng loạt.'],
    e: ['Mỗi thông tin một chỗ: bỏ câu mô tả dưới tiêu đề, bỏ tên tệp ở đầu trang, bỏ nhắc lại tên tệp trên khung bản gốc.', 'Tên tệp chỉ còn ở tag trên ảnh; câu mô tả bỏ hẳn.', 'Không còn thấy tên tệp ở đầu trang; muốn biết ảnh từ tệp nào thì nhìn tag trên ảnh.'] },
  t5: { d: ['Bảng chỉ còn tên tàu, ngày, nguồn; bỏ tên chức danh đầy đủ và câu về trùng.', 'Bỏ tên đầy đủ chức danh, bỏ dòng giải thích trùng thời gian, bớt dòng tên loại tàu.', 'Mất lời giải thích "trùng với chuyến nào"; chỉ còn nhãn Trùng thời gian.'],
    e: ['Mỗi thông tin một chỗ: nhãn đối chiếu tàu chỉ khi khác "khớp"; nguồn chỉ ở cột nguồn.', 'Bỏ lặp nhãn "tàu khớp danh mục" ở từng dòng; chỉ dòng chưa khớp hay trùng mới có nhãn.', 'Muốn biết tàu nào đã khớp phải suy từ chỗ không có nhãn.'] },
};
const TIPS = {
  t1: ['Gọn hơn nữa', 'Nút Duyệt nổi hơn', 'Thêm màu ở trạng thái Xong', 'Bỏ khối 6'],
  t2: ['Ảnh gốc to hơn, ô hẹp lại', 'Ô tô vàng nổi hơn', 'Thêm màu brand ở nút chính', 'Bỏ khối 3'],
  t5: ['Hợp đồng lao động lên trên', 'Lý do bắt buộc nổi bật hơn', 'Thêm màu ở nhãn trạng thái', 'Bỏ khối 7'],
};
function reasonFor(man, v) {
  const rec = SCREENS[man].recommended;
  if (v === 'd' || v === 'e') {
    const base = REASONS[man][rec];
    const [why, change, trade] = DE[man][v];
    return { name: `${v.toUpperCase()} · ${base.name.slice(4)} ${v === 'd' ? 'gọn chữ' : 'bỏ lặp'}`, why, where: `Cùng bố cục ${rec.toUpperCase()}, ${base.where.charAt(0).toLowerCase()}${base.where.slice(1)}`, change, trade };
  }
  return REASONS[man][v];
}

// ---------- Thanh công cụ ----------
const SVG_DESK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
const SVG_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>';
function renderToolbar() {
  const screen = SCREEN();
  const set = (param, items) => `<span class="wf-set" data-wf-param="${param}">${items.map(([value, label, extra = '']) => `<a href="${hrefFor({ [param]: value })}" ${state[param] === value ? 'aria-current="page"' : ''} ${extra}>${label}</a>`).join('')}</span>`;
  const optionTitle = (v) => reasonFor(state.man, v).name;
  const tt = SCREEN().states.find(([key]) => key === state.tt);
  const bar = document.getElementById('wf-bar');
  bar.innerHTML = `
    <div class="wf-group"><span class="wf-label">Màn</span>${set('man', Object.entries(SCREENS).map(([key, value]) => [key, value.label, `title="${value.label} · ${value.name}"`]))}</div>
    <div class="wf-group"><span class="wf-label">Phương án</span>${set('v', screen.options.map((v) => [v, v.toUpperCase(), `title="${optionTitle(v)}"${v === screen.recommended ? ' data-recommended' : ''}`]))}</div>
    <a class="wf-switch" role="switch" aria-checked="${state.mau === 'mau'}" href="${hrefFor({ mau: state.mau === 'mau' ? 'xam' : 'mau' })}">Màu <i></i></a>
    ${set('kho', [['desktop', `${SVG_DESK}Desktop`], ['mobile', `${SVG_PHONE}Mobile`]])}
    ${state.kho === 'mobile' ? set('nav', [['menu', '☰ Menu'], ['duoi', 'Thanh dưới']]) : ''}
    <div class="wf-menu" id="tt-menu"><button type="button"><span>Trạng thái:</span><b>${esc(tt[1])}</b><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>`;
  const r = reasonFor(state.man, state.v);
  document.getElementById('reason-name').textContent = `${screen.label}\u00A0· ${screen.name}\u00A0· ${r.name.replace(' · ', '\u00A0· ')}`;
  document.getElementById('reason-tag').hidden = layout() !== state.v || state.v !== screen.recommended;
  document.getElementById('reason-why').textContent = r.why;
  document.getElementById('reason-where').textContent = r.where;
  document.getElementById('reason-change').textContent = r.change;
  document.getElementById('reason-trade').textContent = r.trade;
  const tipsEl = document.getElementById('reason-tips');
  tipsEl.querySelectorAll('button').forEach((button) => button.remove());
  TIPS[state.man].forEach((tip) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = tip;
    button.addEventListener('click', async () => { try { await navigator.clipboard.writeText(tip); button.setAttribute('data-copied', ''); setTimeout(() => button.removeAttribute('data-copied'), 1500); } catch (error) { /* bị chặn thì thôi */ } });
    tipsEl.appendChild(button);
  });
  const menu = document.getElementById('tt-menu');
  menu.querySelector('button').addEventListener('click', (event) => {
    const existing = document.querySelector('.wf-popover');
    if (existing) { existing.remove(); menu.removeAttribute('data-open'); return; }
    const rect = event.currentTarget.getBoundingClientRect();
    const popover = document.createElement('div');
    popover.className = 'wf-popover';
    popover.style.top = `${rect.bottom + 6}px`;
    popover.style.left = `${Math.max(8, Math.min(rect.left, window.innerWidth - 320))}px`;
    popover.innerHTML = screen.states.map(([key, label]) => `<a href="${hrefFor({ tt: key })}" ${state.tt === key ? 'aria-current="page"' : ''}>${esc(label)}</a>`).join('');
    document.body.appendChild(popover);
    menu.setAttribute('data-open', '');
    event.stopPropagation();
  });
}

// ---------- Vẽ ----------
function renderDesign() {
  const screens = { t1: t1Screen, t2: t2Screen, t5: t5Screen };
  const html = screens[state.man]();
  document.getElementById('wf-design').innerHTML = state.kho === 'mobile' ? `<div class="wf-phone-wrap"><div class="wf-phone">${html}</div></div>` : html;
  requestAnimationFrame(() => requestAnimationFrame(placeBlockNumbers));
}
function render() {
  document.documentElement.dataset.mau = state.mau;
  document.title = `MCAH Wireframe Nhóm D · ${SCREEN().label} ${state.v.toUpperCase()}`;
  renderToolbar();
  renderDesign();
}
function placeBlockNumbers() {
  const overlap = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  for (const block of document.querySelectorAll('[data-wf-block]')) {
    const rect = block.getBoundingClientRect();
    const numberRect = { left: rect.left + 4, top: rect.top + 4, right: rect.left + 22, bottom: rect.top + 22 };
    const contentRects = [...block.querySelectorAll('svg, img')].map((node) => node.getBoundingClientRect());
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      if (!node.textContent.trim()) continue;
      const range = document.createRange();
      range.selectNodeContents(node);
      contentRects.push(...range.getClientRects());
    }
    block.toggleAttribute('data-wf-block-out', contentRects.some((r) => r.width > 0 && overlap(r, numberRect)));
  }
}

// ---------- Tương tác trong bản thiết kế ----------
document.getElementById('wf-design').addEventListener('click', (event) => {
  const t = event.target.closest('[data-sec-toggle], [data-ptab], [data-page], [data-sel], [data-action], [data-panel-cert], [data-view], [data-flip]');
  if (!t) return;
  if (t.dataset.secToggle) { const key = t.dataset.secToggle; const sec = t.closest('.d-sec'); state.open[key] = sec.dataset.open !== 'true'; renderDesign(); return; }
  if (t.dataset.ptab) { state.ptab = t.dataset.ptab; renderDesign(); return; }
  if (t.dataset.view) { state.view = t.dataset.view; renderDesign(); return; }
  if (t.dataset.flip) { state.flip = t.dataset.flip; renderDesign(); return; }
  if (t.dataset.page) { state.page = state.page === t.dataset.page && t.classList.contains('d-trip__head') ? '__none' : t.dataset.page; renderDesign(); return; }
  if (t.dataset.sel) { state.sel = t.dataset.sel; renderDesign(); return; }
  if (t.dataset.panelCert) { state.panel = t.dataset.panelCert; renderDesign(); return; }
  const action = t.dataset.action;
  if (action === 'menu') state.menuOpen = !state.menuOpen;
  if (action === 'user') state.userOpen = !state.userOpen;
  if (action === 'sider') state.sider = state.sider === 'collapsed' ? 'open' : 'collapsed';
  if (action === 'panel') state.panel = state.panel === 'closed' ? null : 'closed';
  renderDesign();
});
const hlOn = (key) => {
  state.hl = key;
  document.querySelectorAll('#wf-design .pf[data-field]').forEach((r) => r.classList.toggle('pf--focus', r.dataset.field === key));
  document.querySelectorAll('#wf-design .d-in').forEach((r) => r.classList.toggle('d-in--focus', r.dataset.key === key));
};
const syncFoot = (scope) => {
  const left = scope.querySelectorAll('.d-ok').length;
  const note = scope.querySelector('.d-foot .d-note');
  const b = scope.querySelector('.d-foot .btn--primary');
  if (note) note.textContent = left ? `${left} ô tô vàng cần bạn xác nhận ✓` : '';
  if (b) { if (left) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled'); }
};
const markDone = (row, edited) => {
  row.classList.remove('d-in--warn');
  if (edited) {
    row.classList.add('d-in--edited');
    const label = row.querySelector('.d-in__label');
    if (label && !label.querySelector('.d-in__edited')) label.insertAdjacentHTML('beforeend', `<b class="d-in__edited">${icon('check')}Đã sửa</b>`);
  }
  row.querySelector('.d-in__hint--warn')?.remove();
  const ok = row.querySelector('.d-ok');
  const mark = `<span class="d-okmark" title="${edited ? 'Đã sửa' : 'Đã xác nhận'}">${icon('check-circle')}</span>`;
  if (ok) ok.outerHTML = mark;
  else if (edited && !row.querySelector('.d-okmark')) row.querySelector('.d-in__box')?.insertAdjacentHTML('beforeend', mark);
  syncFoot(row.closest('.d-form-stage') || document);
};
document.getElementById('wf-design').addEventListener('focusin', (event) => {
  const row = event.target.closest('.d-in[data-key]');
  if (row && event.target.matches('input')) hlOn(row.dataset.key);
});
document.getElementById('wf-design').addEventListener('input', (event) => {
  const row = event.target.closest('.d-in[data-key]');
  if (row && event.target.matches('input') && event.target.value !== event.target.dataset.orig) markDone(row, true);
});
document.getElementById('wf-design').addEventListener('click', (event) => {
  const pf = event.target.closest('.pf[data-field]');
  if (pf) { hlOn(pf.dataset.field); document.querySelector(`#wf-design .d-in[data-key="${pf.dataset.field}"] input`)?.focus({ preventScroll: true }); return; }
  const ok = event.target.closest('.d-ok');
  if (ok) { const row = ok.closest('.d-in'); hlOn(row.dataset.key); markDone(row, false); return; }
  const row = event.target.closest('.d-in[data-key]');
  if (row) hlOn(row.dataset.key);
});
document.addEventListener('click', (event) => {
  if (!event.target.closest('#tt-menu') && !event.target.closest('.wf-popover')) { document.querySelector('.wf-popover')?.remove(); document.getElementById('tt-menu')?.removeAttribute('data-open'); }
});
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  state.menuOpen = false; state.userOpen = false; state.panel = state.man === 't1' ? 'closed' : null;
  document.querySelector('.wf-popover')?.remove();
  renderDesign();
});
addEventListener('resize', placeBlockNumbers);
render();

</script>
