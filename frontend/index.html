<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: thanh lưu, nút nổi, sheet tự chừa vùng an toàn đáy iPhone bằng env(safe-area-inset-bottom).
         interactive-widget=resizes-content: Chrome Android thu khung khi bàn phím mở, sheet và thanh lưu nằm trên bàn phím. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Thêm ra màn hình chính (bản nhẹ, không offline): manifest cho Android, icon và tên riêng cho iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons-app/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MCAH" />
    <title>MCAH</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
