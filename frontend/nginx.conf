server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Máy chủ dịch vụ của app máy tính (cloud/): proxy bỏ tiền tố /tai-khoan, máy chủ tự thêm lại vào liên kết
    # (CLOUD_PUBLIC_URL=https://<tên miền>/tai-khoan). Ảnh giấy tờ gửi AI có thể lớn nên nới cỡ thân.
    location = /tai-khoan {
        return 301 /tai-khoan/;
    }

    # Trang pháp lý (M5) là tệp tĩnh của frontend (public/phap-ly/): luôn mở được kể cả khi máy chủ tài khoản chưa chạy.
    # Địa chỉ giữ nguyên /tai-khoan/... vì đã khai với Google. Khớp chính xác (=) nên thắng location /tai-khoan/ bên dưới.
    location = /tai-khoan/dieu-khoan {
        try_files /phap-ly/dieu-khoan.html =404;
    }
    location = /tai-khoan/quyen-rieng-tu {
        try_files /phap-ly/quyen-rieng-tu.html =404;
    }

    # Tìm địa chỉ cloud lúc có request (DNS của Docker), không lúc khởi động: server chưa bật cloud thì bản web vẫn chạy,
    # chỉ /tai-khoan trả 502.
    location /tai-khoan/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cloud_upstream http://cloud:4100;
        rewrite ^/tai-khoan/(.*)$ /$1 break;
        proxy_pass $cloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 40m;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Bộ cài app máy tính và latest.json (docs/mcah-ke-hoach-desktop-gd6.md 3.3): thư mục ngoài repo gắn vào /srv/releases.
    # latest.json không cache để app thấy bản mới ngay; bộ cài tên có số phiên bản nên cache được.
    location = /download {
        return 301 /download/;
    }
    location /download/files/ {
        alias /srv/releases/;
        autoindex off;
        location ~ latest\.json$ {
            add_header Cache-Control "no-store";
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
