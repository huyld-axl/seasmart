server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Máy chủ dịch vụ của app máy tính (cloud/): proxy bỏ tiền tố /account, máy chủ tự thêm lại vào liên kết
    # (CLOUD_PUBLIC_URL=https://<tên miền>/account). Ảnh giấy tờ gửi AI có thể lớn nên nới cỡ thân.
    # Tìm địa chỉ cloud lúc có request (DNS của Docker), không lúc khởi động: server chưa bật cloud thì bản web vẫn chạy,
    # chỉ /account trả 502.
    location = /account {
        return 301 /account/;
    }
    location /account/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cloud_upstream http://cloud:4100;
        rewrite ^/account/(.*)$ /$1 break;
        proxy_pass $cloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 40m;
    }

    # Tên cũ /tai-khoan (docs/catoro-ke-hoach-khu-noi-bo.md mục 4). App máy tính đã phát hành gọi thẳng /tai-khoan/token, /api/*…
    # nên proxy như /account (không chuyển hướng POST / API) tới khi mọi máy đã học cloud_url mới qua latest.json.
    # Trang pháp lý và trang quản trị cũ thì chuyển 301 sang địa chỉ mới; khớp chính xác (=) / tiền tố dài hơn nên thắng.
    location = /tai-khoan/dieu-khoan {
        return 301 /legal/terms;
    }
    location = /tai-khoan/quyen-rieng-tu {
        return 301 /legal/privacy;
    }
    location = /tai-khoan/quan-tri {
        return 301 /internal/admin$is_args$args;
    }
    location = /tai-khoan/quan-tri/khach/quan-tri {
        return 301 /internal/admin/customers/admins$is_args$args;
    }
    location = /tai-khoan/quan-tri/khoa {
        return 301 /internal/admin/customers/lock$is_args$args;
    }
    location = /tai-khoan/quan-tri/tai-khoan {
        return 301 /internal/admin/accounts$is_args$args;
    }
    location = /tai-khoan/quan-tri/tai-khoan/khoa {
        return 301 /internal/admin/accounts/lock$is_args$args;
    }
    location = /tai-khoan/quan-tri/nhat-ky {
        return 301 /internal/admin/audit-log$is_args$args;
    }
    location /tai-khoan/quan-tri/ {
        return 301 /internal/admin;
    }
    location = /tai-khoan {
        return 301 /account/;
    }
    location /tai-khoan/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cloud_upstream http://cloud:4100;
        rewrite ^/tai-khoan/(.*)$ /$1 break;
        proxy_pass $cloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 40m;
    }

    # Trang tĩnh đổi tên sang tiếng Anh: giữ đường con (#mục trình duyệt tự giữ).
    location /huong-dan/ {
        rewrite ^/huong-dan/(.*)$ /guide/$1 permanent;
    }
    location /phat-hanh/ {
        rewrite ^/phat-hanh/(.*)$ /release-notes/$1 permanent;
    }
    location = /huong-dan {
        return 301 /guide/;
    }
    location = /phat-hanh {
        return 301 /release-notes/;
    }
    location = /phap-ly/dieu-khoan.html {
        return 301 /legal/terms;
    }
    location = /phap-ly/quyen-rieng-tu.html {
        return 301 /legal/privacy;
    }
    location = /legal/terms {
        try_files /legal/terms.html =404;
    }
    location = /legal/privacy {
        try_files /legal/privacy.html =404;
    }

    # Khu nội bộ (docs/catoro-ke-hoach-khu-noi-bo.md 5.1): Basic Auth cho MỌI đường dưới /internal/ (location con thừa kế),
    # rồi cloud kiểm email + mật khẩu + mã TOTP. Thiếu tệp htpasswd thì nginx trả 500 (đóng, không mở).
    # Cloud nhận nguyên tiền tố /internal (không rewrite). Mật khẩu Basic Auth không chuyển vào ứng dụng.
    location /internal/ {
        auth_basic "MCAH internal";
        auth_basic_user_file /etc/nginx/internal-auth/htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cloud_upstream http://cloud:4100;
        proxy_pass $cloud_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Design system: trang tĩnh của frontend, cần thêm phiên quản trị đã qua mã (hỏi cloud qua auth_request).
        location /internal/design-system/ {
            auth_request /internal/_check;
            error_page 401 = @internal_login;
            try_files $uri $uri/ /internal/design-system/index.html;
        }
    }
    location = /internal {
        return 301 /internal/;
    }
    location = /internal/_check {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $cloud_upstream http://cloud:4100;
        proxy_pass $cloud_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
    }
    location @internal_login {
        return 302 /internal/login?next=$uri;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Bộ cài app máy tính và latest.json (docs/catoro-ke-hoach-desktop-gd6.md 3.3): thư mục ngoài repo gắn vào /srv/releases.
    # latest.json không cache để app thấy bản mới ngay; bộ cài tên có số phiên bản nên cache được.
    location = /download {
        return 301 /download/;
    }
    location /download/files/ {
        alias /srv/releases/;
        autoindex off;
        location ~ latest\.json$ {
            add_header Cache-Control "no-store";
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
