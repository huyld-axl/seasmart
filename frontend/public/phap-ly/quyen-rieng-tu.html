<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chính sách quyền riêng tư · MCAH</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Trang pháp lý tĩnh (M5): nginx trả tại /tai-khoan/quyen-rieng-tu, không cần máy chủ tài khoản chạy.
     Thêm nội dung: viết vào <article> bên dưới, đổi ngày cập nhật. */
  :root { color-scheme: light; --primary: #003366; --bg: #eef0f4; --surface: #fff; --fg: #2c2c2c; --muted: #707070; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.7 Inter, system-ui, 'Segoe UI', sans-serif; padding: 16px; }
  main { max-width: 760px; margin: 32px auto; background: var(--surface); border-radius: 16px; padding: 28px; display: grid; gap: 16px; }
  .brand { display: flex; gap: 10px; align-items: center; font-weight: 700; }
  .brand i { width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 13px; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 14px; }
  a { color: var(--primary); }
  nav { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
</style>
</head>
<body>
<main>
  <div class="brand"><i>MC</i>MCAH</div>
  <h1>Chính sách quyền riêng tư</h1>
  <p class="muted">Cập nhật lần cuối: (chưa có)</p>
  <article>
    <!-- NỘI DUNG: thay đoạn dưới bằng nội dung chính thức. -->
    <p>Nội dung đang được hoàn thiện.</p>
  </article>
  <p class="muted">Cần hỏi thêm, liên hệ MCAH.</p>
  <nav><a href="/download/">Tải MCAH</a><a href="/tai-khoan/dieu-khoan">Điều khoản sử dụng</a><a href="/huong-dan/">Hướng dẫn sử dụng</a></nav>
</main>
</body>
</html>
